name: AU57x cloud-only 12-step evidence and lifecycle gates (NO INSTALL)
on:
  push:
    branches: [main, r92-native-btstack-preload-owner-probe, r93-original-btstack-preload-proof-and-sd-diag, r94-launcher-preload-reversible-offline, r95-offline-steps-03-to-17, r96-oneclick-lab-and-release-review]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-and-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Independent 12-step evidence ledger and fail-closed audit
        run: |
          python3 tools/cloud12_gate.py --report cloud12_result/summary.json
      - name: Mutation-negative evidence regressions
        run: python3 -m unittest discover -s tests -p test_cloud12_gate.py -v
      - name: Handoff/wired-priority state machine ASan UBSan
        run: bash ci/host_handoff.sh
      - name: OEM proof and CSM fail-closed ASan UBSan
        run: bash ci/host_oem_guard.sh
      - name: SD review-only archive integrity and tamper regressions
        run: python3 -m unittest discover -s tests -p test_sd_package_audit.py -v
      - name: Deterministic CSM parser fuzz plus encoder buffer sentinels
        run: bash ci/host_csm_fuzz.sh
      - name: Verified capability-only dual-band and fallback policy ASan UBSan
        run: bash ci/host_radio_policy.sh
      - name: SD transaction isolated rollback and fail-closed simulations
        run: python3 -m unittest discover -s tests -p test_cloud_sd_transaction_sim.py -v
      - name: R87 Congo-inspired car-initiated original iAP2 bootstrap and wired-priority regressions
        run: bash ci/host_wcp_autoconnect.sh
      - name: R87 donor reference manifest negative tests (no donor blobs)
        run: python3 -m unittest discover -s tests -p test_wcp_donor_reference_audit.py -v
      - name: R89 cross-process original R45 socket to R44/R87 transport contract
        run: bash ci/host_wcp_r45_remote.sh
      - name: R92 native btstack LD_PRELOAD real constructor/pthread interposition host tests
        run: bash ci/host_bt_preload_probe.sh
      - name: R94 exact MU1005 launcher static audit and reversible same-process launch staging
        run: bash ci/host_r94_launcher.sh
      - name: R93 exact stock ELF dynamic pthread relocation tests and SD evidence script syntax
        run: bash ci/host_r93_plt_audit.sh
      - name: R92 original btstack pthread entry audit synthetic mutation tests
        run: python3 -m unittest discover -s tests -p test_mu1005_bt_preload_audit.py -v
      - name: R91 RFCOMM fast-connect experiment (both strict and experimental variants)
        run: bash ci/host_rf_arg_experiment.sh
      - name: R90 real TCP original R45/R44 iAP2 handshake and synthetic AA00-AA05 fail-closed test
        run: bash ci/host_wcp_r45_remote_mfi.sh
      - name: R89 exact original MU1005 RFCOMM profile callers (synthetic source tests)
        run: python3 -m unittest discover -s tests -p test_mu1005_rf_register_sites.py -v
      - name: R88 original R45 server-first RFCOMM into R87 (no phone/no OEM)
        run: bash ci/host_wcp_r45_ingress.sh
      - name: R88 pinned original MU1005 bluetooth vs btstack route audit (synthetic public tests)
        run: python3 -m unittest discover -s tests -p test_mu1005_bt_iap_path_audit.py -v
      - name: R86 pinned exact MU1005 OEM delegate ABI parser negative tests (no OEM files)
        run: python3 -m unittest discover -s tests -p test_oem_delegate_audit.py -v
      - name: Pinned MU1005 callback snapshots and negative memory tests
        run: bash ci/host_mu1005_callback.sh
      - name: MU1005 callback snapshot to normalized RFCOMM queue (host)
        run: bash ci/host_mu1005_bridge.sh
      - name: Original MU1005 stock MFi + iAP2 CONTROL mock protocol validation
        run: bash ci/host_step04_stock_mfi.sh
      - name: Upstream iAP2 link port through RFCOMM serialized queue (ASan UBSan)
        run: bash ci/host_step04_link.sh
      - name: RFCOMM to iAP2 link to original MFi auth end-to-end mock (ASan UBSan)
        run: bash ci/host_step04_session.sh
      - name: OEM R14 native registration and callback replay (host fixtures only)
        run: bash ci/host_r14_native.sh
      - name: R14 TCP 57342 normalized stream to R44 real iAP2/MFi state model
        run: bash ci/host_step04_tcp.sh
      - name: R59 local TCP loopback R14 to R44 I/O (no OEM authority)
        run: bash ci/host_step04_socket.sh
      - name: R04-09 owner-bound radio, SI, AirPlay and wired-preemption host test
        run: bash ci/host_cloud_pipeline.sh
      - name: R08 media audio/video/HMI/steering native sink contract test
        run: bash ci/host_cloud_media.sh
      - name: R11 recovered 67 native C transaction and independent rollback tests
        run: bash ci/host_sd_txn.sh
      - name: R95 host strict compile of 40 native C modules
        run: bash ci/host_r95_source_compile.sh
      - name: R95 continuous offline steps 03-17 evidence matrix (records failures, no car)
        run: bash ci/host_r95_to_step17.sh
      - name: R95 checksum-preserving toolchain download retry negative tests
        run: python3 -m unittest discover -s tests -p test_r95_toolchain_retry.py -v
      - name: R95 generated immutable C SD backup/rollback transaction and fault tests
        run: python3 -m unittest discover -s tests -p test_r95_sd_plan_codegen.py -v
      - name: R96 actual C one-click supervised host laboratory and failure recovery
        run: bash ci/host_r96_oneclick.sh
      - name: R96 tamper-proof non-executing candidate review ZIP and negative tests
        run: bash ci/host_r96_candidate.sh
      - name: R96 multi-suite stage 18-19 final evidence (not a car installer)
        run: bash ci/host_r96_to_step19.sh
      - name: Assemble source-only review ZIP and SHA256
        if: always()
        run: bash ci/build_cloud_review_bundle.sh
      - name: Publish cloud-only evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AU57x-cloud12-evidence-NO-INSTALL
          path: |
            cloud12_result/
            r95_result/
            r96_result/
          if-no-files-found: warn
          retention-days: 14
