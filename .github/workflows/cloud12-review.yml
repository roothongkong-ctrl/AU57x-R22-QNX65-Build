name: AU57x cloud-only 12-step evidence and lifecycle gates (NO INSTALL)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-and-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Independent 12-step evidence ledger and fail-closed audit
        run: |
          python3 tools/cloud12_gate.py --report cloud12_result/summary.json
      - name: Mutation-negative evidence regressions
        run: python3 -m unittest discover -s tests -p test_cloud12_gate.py -v
      - name: Handoff/wired-priority state machine ASan UBSan
        run: bash ci/host_handoff.sh
      - name: OEM proof and CSM fail-closed ASan UBSan
        run: bash ci/host_oem_guard.sh
      - name: SD review-only archive integrity and tamper regressions
        run: python3 -m unittest discover -s tests -p test_sd_package_audit.py -v
      - name: Deterministic CSM parser fuzz plus encoder buffer sentinels
        run: bash ci/host_csm_fuzz.sh
      - name: Verified capability-only dual-band and fallback policy ASan UBSan
        run: bash ci/host_radio_policy.sh
      - name: SD transaction isolated rollback and fail-closed simulations
        run: python3 -m unittest discover -s tests -p test_cloud_sd_transaction_sim.py -v
      - name: Pinned MU1005 callback snapshots and negative memory tests
        run: bash ci/host_mu1005_callback.sh
      - name: MU1005 callback snapshot to normalized RFCOMM queue (host)
        run: bash ci/host_mu1005_bridge.sh
      - name: Assemble source-only review ZIP and SHA256
        if: always()
        run: bash ci/build_cloud_review_bundle.sh
      - name: Publish cloud-only evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AU57x-cloud12-evidence-NO-INSTALL
          path: cloud12_result/
          if-no-files-found: warn
          retention-days: 14
