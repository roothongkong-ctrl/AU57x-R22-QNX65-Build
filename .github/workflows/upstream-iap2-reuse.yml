name: AU57x real upstream iAP2 C++11 reuse (REVIEW_ONLY)
on:
  push:
    branches: [r113-r116-cloud-review]
    paths:
      - '.github/workflows/upstream-iap2-reuse.yml'
      - 'third_party/entrynav2_iap2/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream-iap2-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and execute actual EntryNav2 upstream link test (no rewriting)
        shell: bash
        run: |
          set -euo pipefail
          D=third_party/entrynav2_iap2
          g++ -std=gnu++11 -O2 -Wall -Wextra -Werror -pedantic \
            -I"$D/include" -I"$D/tests" \
            "$D/src/iap2_link.cpp" "$D/tests/test_iap2_link.cpp" \
            -o /tmp/au57x_upstream_iap2_link
          /tmp/au57x_upstream_iap2_link
          g++ -std=gnu++11 -O2 -Wall -Wextra -Werror -pedantic \
            -I"$D/include" -c "$D/src/iap2_wire.cpp" \
            -o /tmp/au57x_upstream_iap2_wire.o
          g++ -std=gnu++11 -O2 -Wall -Wextra -Werror -pedantic \
            -I"$D/include" \
            "$D/src/iap2_link.cpp" "$D/src/au57x_iap2_capi.cpp" \
            "$D/tests/test_au57x_capi.cpp" -o /tmp/au57x_iap2_cbridge
          /tmp/au57x_iap2_cbridge
          # Compile actual original MU1005 C RFCOMM backend + R113 owner gate,
          # not a mock implementation of inbound_send().
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iproject/source/legacy_mu1005/bluetooth -Ir113/src \
            -Ir113/third_party -I"$D/include" \
            -c project/source/legacy_mu1005/bluetooth/inbound.c -o /tmp/mu_inbound.o
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iproject/source/legacy_mu1005/bluetooth -Ir113/src \
            -Ir113/third_party -I"$D/include" \
            -c r113/src/au108_oem_port.c -o /tmp/mu_owner.o
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iproject/source/legacy_mu1005/bluetooth -Ir113/src \
            -Ir113/third_party -I"$D/include" \
            -c r113/third_party/r105_owner_gate.c -o /tmp/mu_r105.o
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Iproject/source/legacy_mu1005/bluetooth -Ir113/src \
            -Ir113/third_party -I"$D/include" \
            -c r113/src/mu1005_iap2_stream.c -o /tmp/mu_iap2_join.o
          g++ -std=gnu++11 -O2 -Wall -Wextra -Werror -pedantic \
            -I"$D/include" -Iproject/source/legacy_mu1005/bluetooth \
            -Ir113/src -Ir113/third_party \
            "$D/src/iap2_link.cpp" "$D/src/au57x_iap2_capi.cpp" \
            r113/tests/test_mu1005_native_iap2_stream.cpp \
            /tmp/mu_inbound.o /tmp/mu_owner.o /tmp/mu_r105.o /tmp/mu_iap2_join.o \
            -o /tmp/mu1005_upstream_native_stream
          /tmp/mu1005_upstream_native_stream
          echo 'PASS: unmodified GPL3 donor iAP2 wire/link host compile and tests'
  upstream-iap2-qnx-arm:
    needs: upstream-iap2-host
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned QNX 6.5 ARMv7 C++17 toolchain
        shell: bash
        run: |
          set -euo pipefail
          git init -q /tmp/qnx65
          git -C /tmp/qnx65 remote add origin https://github.com/luka-dev/qnx65-armv7-toolchain.git
          git -C /tmp/qnx65 fetch -q --depth=1 origin baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          git -C /tmp/qnx65 checkout -q FETCH_HEAD
          docker build --platform linux/amd64 --target base-env --build-arg BASE=base-8.5 -t au57x-iap2-reuse-qnx:8.5 /tmp/qnx65
      - name: Cross-compile original iAP2 link+wire into QNX ARM review-only static archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qnx_iap2_reuse_result
          docker run --rm --platform linux/amd64 -v "$GITHUB_WORKSPACE":/src -w /src au57x-iap2-reuse-qnx:8.5 bash -c '
            set -euo pipefail
            D=third_party/entrynav2_iap2
            CXX=/opt/qnx650/host/linux/x86/usr/bin/arm-unknown-nto-qnx6.5.0eabi-g++
            AR=/opt/qnx650/host/linux/x86/usr/bin/arm-unknown-nto-qnx6.5.0eabi-ar
            RE=/opt/qnx650/host/linux/x86/usr/bin/arm-unknown-nto-qnx6.5.0eabi-readelf
            OPTS="-std=gnu++11 -O2 -Wall -Wextra -Werror -Wno-ignored-attributes -fPIC -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=softfp -I$D/include"
            $CXX $OPTS -c "$D/src/iap2_link.cpp" -o qnx_iap2_reuse_result/iap2_link.o
            $CXX $OPTS -c "$D/src/iap2_wire.cpp" -o qnx_iap2_reuse_result/iap2_wire.o
            $CXX $OPTS -c "$D/src/au57x_iap2_capi.cpp" -o qnx_iap2_reuse_result/au57x_iap2_capi.o
            CC=/opt/qnx650/host/linux/x86/usr/bin/arm-unknown-nto-qnx6.5.0eabi-gcc
            $CC -std=c11 -O2 -Wall -Wextra -Werror -fPIC -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=softfp \
              -I$D/include -Iproject/source/legacy_mu1005/bluetooth \
              -Ir113/src -Ir113/third_party \
              -c r113/src/mu1005_iap2_stream.c -o qnx_iap2_reuse_result/mu1005_iap2_stream.o
            $AR rcs qnx_iap2_reuse_result/libau57x_upstream_iap2_REVIEW_ONLY.a qnx_iap2_reuse_result/iap2_link.o qnx_iap2_reuse_result/iap2_wire.o qnx_iap2_reuse_result/au57x_iap2_capi.o qnx_iap2_reuse_result/mu1005_iap2_stream.o
            $RE -h qnx_iap2_reuse_result/iap2_link.o > qnx_iap2_reuse_result/link_elf.txt
            $RE -h qnx_iap2_reuse_result/iap2_wire.o > qnx_iap2_reuse_result/wire_elf.txt
            grep -q "Machine:.*ARM" qnx_iap2_reuse_result/link_elf.txt
            grep -q "Machine:.*ARM" qnx_iap2_reuse_result/wire_elf.txt
            echo "QNX 6.5 ARM32 original upstream link + wire compiled; NO INSTALL"
          '
          sudo chown -R "$(id -u):$(id -g)" qnx_iap2_reuse_result
          file qnx_iap2_reuse_result/*.o qnx_iap2_reuse_result/*.a
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AU57x-original-upstream-iAP2-QNX-REVIEW_ONLY
          path: qnx_iap2_reuse_result/
          if-no-files-found: warn
          retention-days: 10
