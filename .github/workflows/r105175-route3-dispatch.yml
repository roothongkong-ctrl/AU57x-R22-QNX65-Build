name: R105.184 route 3 reuse IPC ACK to byte-count adapter (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105175-route3-dispatch.yml, lab/mu1005_route3_dispatch/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipc-finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test new IPC completion connection to existing byte adapter
        run: |
          set -euxo pipefail
          s=project/source/src
          l=lab/mu1005_route3_dispatch
          cc -std=c99 -Wall -Wextra -Werror -fsanitize=undefined -I"$s" -I"$l" "$s"/{cp_bt_bridge,cp_bt_stream,cp_step2_transport,cp_step2_ipc_link}.c "$l"/{byte_contract,ipc_finish,test_ipc_finish}.c -o "$RUNNER_TEMP/route3"
          "$RUNNER_TEMP/route3"
      - uses: ./.github/actions/mu1005-qnx-image
        with:
          require-cache: 'true'
      - name: Compile only new IPC finish adapter for QNX ARM
        run: |
          set -euxo pipefail
          mkdir -p evidence
          docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src qnx65-armv7-toolchain:8.5 arm-unknown-nto-qnx6.5.0eabi-gcc -std=gnu99 -D_QNX_SOURCE -Wall -Wextra -Werror -O2 -Iproject/source/src -Ilab/mu1005_route3_dispatch -c lab/mu1005_route3_dispatch/ipc_finish.c -o /src/evidence/ipc_finish.o
          readelf -h evidence/ipc_finish.o | grep -E 'Machine:.*ARM'
          echo ROUTE3_IPC_FINISH_ARM_COMPILE_ONLY_NOT_LIVE
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: R105184-ROUTE3-REVIEW-NO-INSTALL
          path: evidence/ipc_finish.o
