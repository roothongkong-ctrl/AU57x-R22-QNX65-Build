name: MU1005 OEM app image extraction (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/mu1005-oem-app-extract.yml, tools/mu1005_extract_app70.py]
  workflow_dispatch:
    inputs:
      nas_run_id:
        description: "Successful NAS acquisition run id"
        default: "45918406584"
        type: string
permissions:
  contents: read
  actions: read
jobs:
  extract-app70:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.nas_run_id || '45918406584' }}
    steps:
      - uses: actions/checkout@v4
      - name: Obtain retained archive from existing NAS task (no second NAS request)
        run: |
          set -euo pipefail
          mkdir -p firmware evidence
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          for i in $(seq 1 100); do
            result=$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '.status + ":" + .conclusion')
            if [ "$result" = "completed:success" ]; then break; fi
            if [[ "$result" == completed:* ]]; then echo "NAS_SOURCE_NOT_SUCCESS:$result"; exit 2; fi
            sleep 15
          done
          test "$result" = "completed:success"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name mu1005-nas-firmware-archive --dir firmware
          test -s firmware/MHI2_CN_AU57x_K1006_2_MU1005_4M0906961EJ.7z
      - name: Fetch exact upstream MHI2 extractor and QNX6 reader
        run: |
          set -euxo pipefail
          git init extractor
          git -C extractor remote add origin https://github.com/harman-f/MHI2-MHI2Q-MH2P-Firmware-Toolkit.git
          git -C extractor fetch --depth 1 origin 64a44fe23dbaa08771440d69642d2874d7028295
          git -C extractor checkout --detach FETCH_HEAD
          test "$(git -C extractor rev-parse HEAD)" = 64a44fe23dbaa08771440d69642d2874d7028295
          git init qnxmount
          git -C qnxmount remote add origin https://github.com/NetherlandsForensicInstitute/qnxmount.git
          git -C qnxmount fetch --depth 1 origin 0379c064975d5bbe3595ac7e3d149ea789406794
          git -C qnxmount checkout --detach FETCH_HEAD
          test "$(git -C qnxmount rev-parse HEAD)" = 0379c064975d5bbe3595ac7e3d149ea789406794
          python3 -m venv /tmp/mu1005-extract-venv
          /tmp/mu1005-extract-venv/bin/pip install kaitaistruct==0.10 crcmod==1.7
          command -v 7z || { sudo apt-get update -qq && sudo apt-get install -y p7zip-full; }
      - name: Extract variant 70 using upstream read-only QNX6 implementation
        run: |
          set -euo pipefail
          python3 tools/mu1005_extract_app70.py firmware/MHI2_CN_AU57x_K1006_2_MU1005_4M0906961EJ.7z "${RUNNER_TEMP}/app70/app.img"
          /tmp/mu1005-extract-venv/bin/python extractor/tools/extract_firmware.py --source "${RUNNER_TEMP}/app70/app.img" --output "${RUNNER_TEMP}/app70-tree" --variant 70 --qnxmount-root "$PWD/qnxmount" > evidence/extract-summary.json
          test -d "${RUNNER_TEMP}/app70-tree/filesystems"
      - name: Locate exact original Bluetooth and CarPlay ELF inputs
        run: |
          set -euo pipefail
          python3 tools/mu1005_oem_inventory.py "${RUNNER_TEMP}/app70-tree/filesystems" --out evidence/oem-app70-inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mu1005-app70-extraction-evidence
          path: evidence/
          retention-days: 30
