name: 'R14: actual H264 112 decode to YUV and 70pct original card; no install'
on:
  workflow_dispatch:
  push:
    branches: [experiment/cluster-card-r14-real-h264-decode-bridge]
    paths:
      - 'experiments/cluster-compact-card/r14/**'
      - '.github/workflows/cluster-card-r14-real-decoder.yml'
permissions:
  contents: read
jobs:
  real-h264-decode:
    name: ${{ matrix.compiler }} / ${{ matrix.threads }} threads
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        compiler: [g++, clang++]
        threads: [1, 4, 8]
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg development headers (same API family as official MIB)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libavcodec-dev libavutil-dev pkg-config ffmpeg
      - name: Generate real encoded H264 card and invalid geometry samples
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -loglevel error -y -f lavfi -i 'color=c=white:s=800x298:r=10' \
            -vf 'drawbox=x=180:y=22:w=60:h=40:color=black:t=fill' \
            -frames:v 1 -pix_fmt yuv420p -c:v libx264 -preset ultrafast \
            -x264-params keyint=1:scenecut=0:bframes=0 -f h264 /tmp/r14-112-card.h264
          ffmpeg -loglevel error -y -f lavfi -i 'color=c=white:s=640x360:r=10' \
            -frames:v 1 -pix_fmt yuv420p -c:v libx264 -preset ultrafast \
            -x264-params keyint=1:scenecut=0:bframes=0 -f h264 /tmp/r14-wrong-112.h264
          test -s /tmp/r14-112-card.h264
          test -s /tmp/r14-wrong-112.h264
      - name: Run real H264/libavcodec decode to R12 compositor
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
          THREADS: ${{ matrix.threads }}
        run: |
          set -euo pipefail
          "$CXX" -std=c++11 -pthread -O2 -g -Wall -Wextra -Werror -pedantic \
            $(pkg-config --cflags libavcodec libavutil) \
            experiments/cluster-compact-card/r14/test_r14_decoder.cpp \
            $(pkg-config --libs libavcodec libavutil) -o /tmp/r14-real-decode-test
          /tmp/r14-real-decode-test /tmp/r14-112-card.h264 /tmp/r14-wrong-112.h264 "$THREADS"
          echo "R14 PASSED: actual H264 decode, not a real GaoDe/iPhone 112 stream"
