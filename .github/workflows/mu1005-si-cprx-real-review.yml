name: MU1005 SI real CPRX source integration (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths-ignore:
      - 'lab/mu1005_step8_*/**'
      - 'lab/mu1005_stock_reuse/**'
      - 'lab/mu1005_route1_path/**'
      - '.github/workflows/r105173-route1-path.yml'
      - '.github/workflows/r105172-stock-reuse.yml'
      - 'docs/R105172_STOCK_REUSE_CN.md'
      - '.github/workflows/r*-step8-*.yml'
      - '.github/workflows/mu1005-si-cprx-real-review.yml'
      - 'docs/MASTER_HANDOFF_AND_NO_REPEAT_RULES_CN.md'
      - 'docs/WIRELESS_FIRST_LINK_TASK_REGISTER_CN.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-cprx-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Build real R85 client and server with SI session bridge
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth 1 origin 7f595231394d97091ec0fee209677b6e45fd50dc
          test "$(git rev-parse FETCH_HEAD)" = 7f595231394d97091ec0fee209677b6e45fd50dc
          mkdir -p r85 evidence
          git archive FETCH_HEAD project/source/legacy_mu1005/airplay | tar -x -C r85
          a=r85/project/source/legacy_mu1005/airplay
          s=integration/mu1005_si_native
          cc -std=c99 -O2 -Wall -Wextra -Werror -I"$a" -I"$s" "$s"/{si_mu1005_layout,si_mu1005_registration,si_mu1005_activation,si_mu1005_snapshot,si_mu1005_owner,si_mu1005_cprx,test_real_cprx}.c "$a"/{cprx_service,native_exports,semantic,mu1005_r34_ap_server}.c -ldl -o "$RUNNER_TEMP/real-cprx"
          timeout 30 "$RUNNER_TEMP/real-cprx" | tee evidence/real-cprx.log
          grep -F HOST_REAL_CPRX_OEM_FIXTURES_ONLY_NO_INSTALL evidence/real-cprx.log
          # First-connect mode uses the current DIO implementation, not an
          # old pinned server that cannot report optional unknown channels.
          a=project/source/legacy_mu1005/airplay
          cc -std=c99 -O2 -Wall -Wextra -Werror -I"$a" -I"$s" "$s"/{si_mu1005_layout,si_mu1005_registration,si_mu1005_activation,si_mu1005_snapshot,si_mu1005_owner,si_mu1005_cprx,test_real_cprx}.c "$a"/{cprx_service,native_exports,semantic,mu1005_r34_ap_server}.c -ldl -o "$RUNNER_TEMP/first-video-cprx"
          timeout 30 "$RUNNER_TEMP/first-video-cprx" first-video | tee evidence/first-video-cprx.log
          grep -F 'PASS real op11 first video with optional channels unknown' evidence/first-video-cprx.log
          timeout 30 "$RUNNER_TEMP/first-video-cprx" first-session | tee evidence/first-session-cprx.log
          grep -F 'PASS first session with all media channels unknown' evidence/first-session-cprx.log
          grep -F 'PASS first session history survives immediate disconnect; no live grant' evidence/first-session-cprx.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si-real-cprx-host-evidence-NO-INSTALL
          path: evidence
  bt-discovery-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p evidence
      - name: Verify original Bluetooth handoff revocation and fresh ACL recovery
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p evidence
          bash ci/host_r98_iap2_handoff.sh | tee evidence/bt-owner-handoff.log
          grep -F 'PASS owner/transport lease revoked before or during tick; no stale resume' evidence/bt-owner-handoff.log
          grep -F 'PASS prepared daemon fd adoption' evidence/bt-owner-handoff.log
          grep -F 'PASS unified owner lifecycle' evidence/bt-owner-handoff.log
          bash ci/host_wcp_autoconnect.sh | tee evidence/bt-autoconnect.log
      - name: Test offline Bluetooth trace reference locator
        run: python3 -m unittest discover -s tests -p test_mu1005_bt_trace_entry.py -v
      - name: Verify actual service state and upstream EIR discovery
        run: |
          set -euxo pipefail
          bash ci/host_r14_native.sh | tee evidence/r5-native-discovery.log
          bash ci/host_r102_upstream_reuse.sh | tee evidence/upstream-eir.log
          grep -F 'PASS actual R5 publication state controls discovery' evidence/r5-native-discovery.log
          grep -F 'PASS EOF with outstanding native TX drains in both close/completion orders' evidence/r5-native-discovery.log
          b=project/source/legacy_mu1005/bluetooth
          cc -std=c99 -Wall -Wextra -Werror -I"$b" -c "$b/native_eir_bridge.c" -o "$RUNNER_TEMP/native-eir-bridge.o"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bt-discovery-host-evidence-NO-INSTALL
          path: evidence
  bt-owner-lifecycle-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p evidence
      - name: Verify OEM startup state snapshot
        run: |
          set -euxo pipefail
          b=project/source/legacy_mu1005/bluetooth
          cc -std=c99 -O2 -Wall -Wextra -Werror -I"$b" "$b/bt_startup_snapshot.c" tests/test_mu1005_bt_startup_snapshot.c -o "$RUNNER_TEMP/bt-startup"
          "$RUNNER_TEMP/bt-startup" | tee evidence/bt-startup.log
      - name: Verify original OSAPI ActiveObject thread identity
        run: |
          set -euxo pipefail
          b=project/source/legacy_mu1005/bluetooth
          cc -std=c99 -O2 -Wall -Wextra -Werror -I"$b" "$b/bt_owner_identity.c" tests/test_bt_owner_identity.c -o "$RUNNER_TEMP/bt-owner-identity"
          "$RUNNER_TEMP/bt-owner-identity" | tee evidence/bt-owner-identity.log
      - name: Verify actual daemon socket producer
        run: |
          set -euxo pipefail
          b=project/source/legacy_mu1005/bluetooth
          cc -std=c99 -O2 -Wall -Wextra -Werror -pthread -DAU57X_R98_HOST_TEST=1 -I"$b" "$b"/{bt_socket_worker,bt_iap2_owner_handoff,rf_arg_experiment}.c tests/test_bt_socket_worker.c -o "$RUNNER_TEMP/bt-worker"
          timeout 20 "$RUNNER_TEMP/bt-worker" | tee evidence/bt-worker.log
      - name: Verify integrated worker and callback lifecycle on host
        run: |
          set -euxo pipefail
          b=project/source/legacy_mu1005/bluetooth
          cc -std=c99 -O2 -Wall -Wextra -Werror -pthread -I"$b" lab/mu1005_qnx_runtime/bt_owner_runtime.c "$b"/{bt_socket_worker,bt_iap2_owner_handoff,rf_arg_experiment,bt_notify_bridge}.c -o "$RUNNER_TEMP/bt-owner-runtime"
          timeout 20 "$RUNNER_TEMP/bt-owner-runtime" | tee evidence/bt-owner-runtime.log
          grep -F 'BT_OWNER_REAL_SOCKET_PTHREAD_TWO_SESSIONS_PASS_NO_OEM' evidence/bt-owner-runtime.log
      - name: Verify periodic event coalescing and release
        run: |
          set -euxo pipefail
          b=project/source/legacy_mu1005/bluetooth
          cc -std=c99 -O2 -Wall -Wextra -Werror -I"$b" "$b/bt_queue_pulse.c" tests/test_bt_queue_pulse.c -o "$RUNNER_TEMP/bt-pulse"
          "$RUNNER_TEMP/bt-pulse" | tee evidence/bt-pulse.log
      - name: Verify original-first notify callback bridge
        run: |
          set -euxo pipefail
          b=project/source/legacy_mu1005/bluetooth
          cc -std=c99 -O2 -Wall -Wextra -Werror -I"$b" "$b/bt_notify_bridge.c" tests/test_bt_notify_bridge.c -o "$RUNNER_TEMP/bt-notify"
          "$RUNNER_TEMP/bt-notify" | tee evidence/bt-notify.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bt-owner-lifecycle-host-evidence-NO-INSTALL
          path: evidence
  bt-trace-latch-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Nonblocking trace hint and original forwarding contract
        run: |
          set -euxo pipefail
          b=project/source/legacy_mu1005/bluetooth
          cc -std=c99 -O2 -Wall -Wextra -Werror -DTRACE_LATCH_STANDALONE -I"$b" "$b/bt_trace_latch.c" tests/test_bt_trace_latch.c -o "$RUNNER_TEMP/latch"
          "$RUNNER_TEMP/latch" | tee latch.log
          grep -F MU1005_TRACE_LATCH_COALESCING_PASS_FIXTURE_ONLY latch.log
      - name: Trace before startup and bounded leased retry
        run: |
          set -euxo pipefail
          b=project/source/legacy_mu1005/bluetooth
          cc -std=c99 -O2 -Wall -Wextra -Werror -DSTARTUP_WATCH_STANDALONE -I"$b" "$b"/{bt_startup_watch,bt_trace_latch,bt_startup_snapshot}.c tests/test_bt_startup_watch.c -o "$RUNNER_TEMP/watch"
          "$RUNNER_TEMP/watch"
