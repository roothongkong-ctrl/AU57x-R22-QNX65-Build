name: MU1005 real QNX 6.5 runtime loader (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/mu1005-qnx-runtime.yml, lab/mu1005_qnx_runtime/**]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qnx-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download exact previously built native binding library
        uses: actions/download-artifact@v4
        with:
          name: mu1005-si-cprx-arm-NO-INSTALL
          run-id: 45536789512
          github-token: ${{ github.token }}
          path: previous-native
      - name: Verify exact source revision and artifact hashes
        run: |
          set -euxo pipefail
          mkdir -p qnx-runtime-evidence
          grep -Fx 'source=b51325eb6e06bc317206764c764d160163da40cf' previous-native/evidence/revisions.txt
          (cd previous-native && sha256sum -c SHA256SUMS) > qnx-runtime-evidence/previous-checksums.log
          sha256sum previous-native/payload/libmu1005_bt_native_review.so | tee qnx-runtime-evidence/library.sha256
          python3 - <<'PY'
          from pathlib import Path
          blob=Path('previous-native/payload/libmu1005_bt_native_review.so').read_bytes()
          assert blob[:4]==b'\x7fELF'
          Path('lab/mu1005_qnx_runtime/native_blob.h').write_text(
              'static const unsigned char native_blob[] = {\n'+
              '\n'.join(','.join(f'0x{x:02x}' for x in blob[i:i+20])+',' for i in range(0,len(blob),20))+'\n};\n')
          PY
      - name: Fetch locked public QNX boot environment and QEMU
        run: |
          set -euxo pipefail
          git init toolchain
          git -C toolchain remote add origin https://github.com/luka-dev/qnx65-armv7-toolchain.git
          git -C toolchain fetch --depth 1 origin baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          git -C toolchain checkout --detach FETCH_HEAD
          test "$(git -C toolchain rev-parse HEAD)" = baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          for f in startup-virt libstartup.a devc-serdebug u-boot.bin; do test -s "toolchain/tests/qemu/$f"; done
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm
          qemu-system-arm --version | tee qnx-runtime-evidence/qemu-version.log
          sha256sum toolchain/tests/qemu/{startup-virt,libstartup.a,devc-serdebug,u-boot.bin} toolchain/tests/qemu-run.sh | tee qnx-runtime-evidence/boot-inputs.sha256
      - uses: actions/cache/restore@v4
        id: gnu-cache
        with:
          path: ~/.cache/au57x-gnu
          key: mu1005-gnu-gcc850-d308841a-binutils238-e316477a-v1
      - name: Build verified toolchain
        run: |
          set -euxo pipefail
          bash tools/ci/mu1005_gnu_mirrors.sh "$HOME/.cache/au57x-gnu" toolchain | tee qnx-runtime-evidence/gnu.log
          docker build --platform linux/amd64 --target base-env --build-arg BASE=base-8.5 -t qnx65-armv7-toolchain:8.5 toolchain 2>&1 | tee qnx-runtime-evidence/compiler.log
      - name: Build ICU 58.2 data candidate and check SDK XML exports
        continue-on-error: true
        run: bash lab/mu1005_qnx_runtime/build_dependency_candidates.sh
      - name: Build QNX process and load previous exact shared library
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src qnx65-armv7-toolchain:8.5 bash -c '
            set -eux
            arm-unknown-nto-qnx6.5.0eabi-gcc -std=gnu99 -D_QNX_SOURCE -Wall -Wextra -Werror -O2 lab/mu1005_qnx_runtime/runtime_loader.c -lc -o qnx-runtime-evidence/mu1005-loader-probe
            arm-unknown-nto-qnx6.5.0eabi-readelf -h -dW qnx-runtime-evidence/mu1005-loader-probe
          ' 2>&1 | tee qnx-runtime-evidence/probe-build.log
          # Add the exact, hash-verified library to the upstream IFS instead of
          # relying on a writable /dev/shmem in the minimal QNX guest.
          python3 lab/mu1005_qnx_runtime/prepare_ifs.py toolchain/tests/qemu-run.sh
          export QNX_TEST_NATIVE_LIB="$PWD/previous-native/payload/libmu1005_bt_native_review.so"
          set +e
          QEMU_KEEP_LOG="$PWD/qnx-runtime-evidence/qemu-serial.log" QEMU_TIMEOUT=65 QEMU_RUN_SECS=20 sh toolchain/tests/qemu-run.sh "$PWD/qnx-runtime-evidence/mu1005-loader-probe" 8.5 2>&1 | tee qnx-runtime-evidence/runtime.log
          rc=${PIPESTATUS[0]}
          set -e
          if test -f qnx-runtime-evidence/qemu-serial.log; then
            tail -100 qnx-runtime-evidence/qemu-serial.log
          fi
          test "$rc" -eq 0
          grep -F 'MU1005_IFS_EXACT_BYTES_OK' qnx-runtime-evidence/runtime.log
          grep -F 'MU1005_QNX65_NATIVE_DLOPEN_OK_NO_OEM_ATTACH' qnx-runtime-evidence/runtime.log
          grep -F '@@QNXRUN-END@@' qnx-runtime-evidence/qemu-serial.log
          grep -E 'Process [0-9]+ \(mu1005-loader-probe\) exited status=0' qnx-runtime-evidence/qemu-serial.log
          printf '%s\n' 'QNX kernel and runtime dynamic loader executed the exact previous library. No factory btstack, no native SDK call, no radio, no MFi, no installation.' > qnx-runtime-evidence/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mu1005-real-qnx-runtime-evidence-NO-INSTALL
          path: qnx-runtime-evidence/
          retention-days: 30
