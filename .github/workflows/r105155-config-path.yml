name: R105.155 read-only configuration path closure (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105155-config-path.yml, lab/mu1005_config_path/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash lab/mu1005_config_path/test.sh
  qnx-read-only-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p qnx-runtime-evidence
      - name: Fetch locked public QNX boot environment and QEMU
        run: |
          set -euxo pipefail
          git init toolchain
          git -C toolchain remote add origin https://github.com/luka-dev/qnx65-armv7-toolchain.git
          git -C toolchain fetch --depth 1 origin baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          git -C toolchain checkout --detach FETCH_HEAD
          test "$(git -C toolchain rev-parse HEAD)" = baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          for f in startup-virt libstartup.a devc-serdebug u-boot.bin; do test -s "toolchain/tests/qemu/$f"; done
          if ! command -v qemu-system-arm >/dev/null; then
            aptopts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
            sudo apt-get "${aptopts[@]}" update -qq
            sudo apt-get "${aptopts[@]}" install -y -qq qemu-system-arm
          fi
          qemu-system-arm --version | tee qnx-runtime-evidence/qemu-version.log
          sha256sum toolchain/tests/qemu/{startup-virt,libstartup.a,devc-serdebug,u-boot.bin} toolchain/tests/qemu-run.sh | tee qnx-runtime-evidence/boot-inputs.sha256
      - uses: actions/cache/restore@v4
        id: gnu-cache
        with:
          path: ~/.cache/au57x-gnu
          key: mu1005-gnu-gcc850-d308841a-binutils238-e316477a-v1
      - name: Configure reusable compiler build cache
        uses: docker/setup-buildx-action@v3
      - name: Build verified toolchain
        run: |
          set -euxo pipefail
          bash tools/ci/mu1005_gnu_mirrors.sh "$HOME/.cache/au57x-gnu" toolchain | tee qnx-runtime-evidence/gnu.log
          docker buildx build --load --platform linux/amd64 --target base-env --build-arg BASE=base-8.5 --cache-from type=gha,scope=mu1005-qnx65-baa45224-gcc85-v1 --cache-to type=gha,scope=mu1005-qnx65-baa45224-gcc85-v1,mode=min,ignore-error=true -t qnx65-armv7-toolchain:8.5 toolchain 2>&1 | tee qnx-runtime-evidence/compiler.log
          docker run --rm --platform linux/amd64 qnx65-armv7-toolchain:8.5 arm-unknown-nto-qnx6.5.0eabi-gcc --version | tee qnx-runtime-evidence/compiler-version.log
      - name: Build read-only QNX ARM helper and package
        run: |
          set -euo pipefail
          mkdir -p qnx-runtime-evidence/probe
          docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src qnx65-armv7-toolchain:8.5 arm-unknown-nto-qnx6.5.0eabi-gcc -std=gnu99 -D_QNX_SOURCE -Wall -Wextra -Werror -O2 lab/mu1005_config_path/probe.c -o qnx-runtime-evidence/probe/config-path-probe
          readelf -h qnx-runtime-evidence/probe/config-path-probe | tee qnx-runtime-evidence/probe-elf.log
          grep -E 'Machine:.*ARM' qnx-runtime-evidence/probe-elf.log
          cp lab/mu1005_config_path/probe.sh qnx-runtime-evidence/probe/
          cp docs/R105155_CONFIG_PATH_CN.md qnx-runtime-evidence/probe/README_CN.md
          (cd qnx-runtime-evidence/probe && sha256sum config-path-probe probe.sh README_CN.md > SHA256SUMS)
          QEMU_KEEP_LOG="$PWD/qnx-runtime-evidence/serial.log" QEMU_TIMEOUT=70 QEMU_RUN_SECS=25 sh toolchain/tests/qemu-run.sh "$PWD/qnx-runtime-evidence/probe/config-path-probe" 8.5 > qnx-runtime-evidence/runtime.log 2>&1 || true
          grep -F 'CONFIG_PATH_PROBE_READ_ONLY_BEGIN' qnx-runtime-evidence/serial.log
          grep -F 'CONFIG_PATH_PROBE_END_NOT_CONSUMER_PROOF' qnx-runtime-evidence/serial.log
          grep -E 'Process [0-9]+ \(config-path-probe\) exited status=0' qnx-runtime-evidence/serial.log
      - uses: actions/upload-artifact@v4
        with:
          name: R105155-MU1005-READ-ONLY-PROBE
          path: qnx-runtime-evidence/probe/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R105155-CONFIG-PATH-EVIDENCE
          path: qnx-runtime-evidence/*.log
