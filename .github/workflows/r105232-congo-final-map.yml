name: R105.232 Congo exact remaining interfaces and guard words (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: ['.github/workflows/r105232-congo-final-map.yml','lab/mu1005_congo_final/map.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact original btstack only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir firmware original-tools evidence
          gh run download 45923122041 --repo "$GITHUB_REPOSITORY" --name mu1005-nas-firmware-archive --dir firmware
          archive="$PWD/firmware/MHI2_CN_AU57x_K1006_2_MU1005_4M0906961EJ.7z"
          echo "6946216d1f87f073aefc873a4252b9b952d261e3b9fd2fedf403d26ea2f2db94  $archive" | sha256sum -c -
          git fetch --depth 1 origin 713fddea9bb11acfdb1df7eff02ca645011ad6d6
          git archive FETCH_HEAD tools/mu1005_extract_app70.py | tar -x -C original-tools
          git init extractor
          git -C extractor remote add origin https://github.com/harman-f/MHI2-MHI2Q-MH2P-Firmware-Toolkit.git
          git -C extractor fetch --depth 1 origin 64a44fe23dbaa08771440d69642d2874d7028295
          git -C extractor checkout --detach FETCH_HEAD
          git init qnxmount
          git -C qnxmount remote add origin https://github.com/NetherlandsForensicInstitute/qnxmount.git
          git -C qnxmount fetch --depth 1 origin 0379c064975d5bbe3595ac7e3d149ea789406794
          git -C qnxmount checkout --detach FETCH_HEAD
          python3 -m venv /tmp/extract-venv
          /tmp/extract-venv/bin/pip install kaitaistruct==0.11 crcmod==1.7
          python3 original-tools/tools/mu1005_extract_app70.py "$archive" "$RUNNER_TEMP/app70/app.img"
          /tmp/extract-venv/bin/python extractor/tools/extract_firmware.py --source "$RUNNER_TEMP/app70/app.img" --output "$RUNNER_TEMP/original" --variant 70 --qnxmount-root "$PWD/qnxmount" > /tmp/app-summary.json
          python3 - <<'PY'
          import os,pathlib,hashlib,shutil
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          matches=[p for p in (root/"original").rglob("btstack") if p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()=="51ecbd44c3581bd69f01ed5bdc053ba28ccc6fef3bf1bd4c3a8f010898ab0566"]
          assert matches,"Exact original btstack missing from app70"
          shutil.copyfile(matches[0],root/"btstack")
          PY
      - name: Resolve remaining candidates from exact original and pinned donor
        run: |
          set -euxo pipefail
          git init donor
          git -C donor remote add origin https://github.com/congobg/MHI2Q_WiFi_CarPlay
          git -C donor fetch --depth 1 origin 223b42f90bf7c15fbbbef23259da36caa9bd4994
          git -C donor checkout --detach FETCH_HEAD
          python3 -m venv /tmp/disasm
          /tmp/disasm/bin/pip install capstone==5.0.6
          /tmp/disasm/bin/python lab/mu1005_congo_final/map.py "$RUNNER_TEMP/btstack" donor/MHI2QC_3638/wcp.tar.gz evidence/final-map.json
      - uses: actions/upload-artifact@v4
        with:
          name: congo-final-map-R105232-NO-INSTALL
          path: evidence/final-map.json
          retention-days: 7
