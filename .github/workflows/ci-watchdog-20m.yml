# Review-only: schedules GitHub CI inspection; cannot resume an AI coding session.
name: AU57x 20-minute CI watchdog (NO INSTALL)
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: au57x-review-ci-watchdog
  cancel-in-progress: false
jobs:
  review-ci-watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect main-branch CI and resume only safe unattended tests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GH_REPO"]
          sha = os.environ["GH_SHA"]
          token = os.environ["GH_TOKEN"]
          now = dt.datetime.now(dt.timezone.utc)
          messages = []
          def api(path, method="GET", payload=None):
              raw = None if payload is None else json.dumps(payload).encode("utf-8")
              if method == "POST" and payload is None:
                  raw = b""
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + path,
                  data=raw, method=method,
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "User-Agent": "AU57x-review-only-watchdog"})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = resp.read()
              return json.loads(data) if data else {}
          def age_minutes(value):
              timestamp = dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
              return (now - timestamp).total_seconds()/60.0
          def report(message):
              print(message)
              messages.append(message)

          # A new commit gets time for regular push workflows to appear.
          commit = api("/commits/" + sha)
          head_age = age_minutes(commit["commit"]["committer"]["date"])
          targets = (
              ("cloud12-review.yml", 45),
              ("qnx65-compile.yml", 180),
          )
          for filename, hang_minutes in targets:
              ref = urllib.parse.quote(filename, safe="")
              data = api("/actions/workflows/" + ref +
                         "/runs?branch=main&per_page=30")
              runs = [r for r in data.get("workflow_runs", [])
                      if r.get("head_sha") == sha]
              if not runs:
                  if head_age >= 20:
                      api("/actions/workflows/" + ref + "/dispatches",
                          "POST", {"ref": "main"})
                      report(filename + ": no CI for HEAD; dispatched review test")
                  else:
                      report(filename + ": waiting for new push CI")
                  continue
              latest = max(runs, key=lambda r: (r["created_at"], r["id"]))
              run_id = latest["id"]
              state = latest["status"]
              conclusion = latest.get("conclusion")
              age = age_minutes(latest["created_at"])
              attempts = latest.get("run_attempt", 1)
              if state in ("queued", "in_progress", "waiting", "pending"):
                  if age > hang_minutes:
                      # Only act after the workflow's expected wall-clock lifetime.
                      api("/actions/runs/" + str(run_id) + "/cancel", "POST")
                      api("/actions/workflows/" + ref + "/dispatches",
                          "POST", {"ref": "main"})
                      report(filename + ": expired CI run cancelled and re-dispatched")
                  else:
                      report(filename + ": running or queued (" + str(int(age)) + "m)")
              elif conclusion in ("failure", "timed_out") and attempts < 2:
                  # At most one automatic retry of a failed run/commit.
                  api("/actions/runs/" + str(run_id) + "/rerun-failed-jobs", "POST")
                  report(filename + ": failure, one retry requested for #" + str(run_id))
              else:
                  report(filename + ": " + str(conclusion) +
                         " (attempts=" + str(attempts) + ")")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## AU57x 20-minute review CI check\n\n")
              f.write("Head: `" + sha[:12] + "` (main)\n\n")
              for line in messages:
                  f.write("- " + line + "\n")
              f.write("\nNo OEM access, vehicle installation, or AI-code generation.\n")
          PY
