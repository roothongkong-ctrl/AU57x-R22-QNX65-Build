name: R105.281 original startup before donor and safe unpublished withdrawal (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: ['.github/workflows/r105281-startup-order.yml','lab/mu1005_route4_5/test_wcp_start_order.c']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  startup-order:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euxo pipefail
          l=lab/mu1005_route4_5
          b=project/source/legacy_mu1005/bluetooth
          cc -std=c99 -Wall -Wextra -Werror -g -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -I"$l" -I"$b" "$l/wcp_start.c" "$l/test_wcp_start_order.c" -o /tmp/start-order
          /tmp/start-order
  native-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mu1005-qnx-image
        with:
          require-cache: 'true'
      - name: Link one native DSO including the original preload, paired resume and inherited daemon
        run: |
          set -euxo pipefail
          mkdir -p output
          test "$(git hash-object third_party/luka-dev/mib2q-carplay-rgi/wireless/graft/eir.c)" = 99f42933e7c6b98af11fb387a1e68727ffe31997
          docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src qnx65-armv7-toolchain:8.5 bash -ec '
            C=arm-unknown-nto-qnx6.5.0eabi-gcc
            R=arm-unknown-nto-qnx6.5.0eabi-readelf
            b=project/source/legacy_mu1005/bluetooth
            s=project/source/src
            l=lab/mu1005_route4_5
            p=lab/mu1005_paired_start
            u=lab/mu1005_usb_exit
            "$C" -std=gnu99 -D_QNX_SOURCE -O2 -Wall -Wextra -Werror -fPIC -shared -Wl,--no-undefined -Wl,--hash-style=sysv -I"$b" -I"$s" -I"$l" -I"$p" -I"$u" \
              "$b"/{native_binding,native_event,inbound,inbound_r5,mu1005_rf_ingress,mu1005_ipc_stream,mu1005_socket_pump,rf_arg_experiment,native_eir_bridge,au102_eir_advertisement,bt_iap2_owner_handoff,bt_route_gate,bt_startup_snapshot,bt_owner_identity,bt_notify_bridge,bt_socket_worker,bt_queue_pulse,bt_self_reader,bt_trace_latch,bt_startup_watch,bt_preload_probe,bt_thread_owner,bt_got_observer,bt_trace_attach}.c \
              "$b/bt_trace_tail_arm.S" tools/review_txn/sha256.c third_party/luka-dev/mib2q-carplay-rgi/wireless/graft/eir.c \
              "$l"/{daemon_supervisor,supervised_notify,supervised_startup,wcp_start}.c "$p/paired_start.c" "$u/usb_exit_watch.c" "$s/cp_wcp_autoconnect.c" \
              -lsocket -lc -o output/libmu1005_bt_runtime_review.so
            "$R" -h -l -dW -sW output/libmu1005_bt_runtime_review.so > output/elf.txt
            grep -Eq "Machine:.*ARM" output/elf.txt
            grep -Eq "Type:.*DYN" output/elf.txt
            for sym in mu_wcp_start_begin mu_wcp_start_poll mu_wcp_start_cancel_unpublished mu_supervised_notify_prepare mu_bt_queue_bootstrap mu_bt_notify_bind_queue_only mu_bt_notify_periodic_dispatch mu_bt_self_reader_open au57x_r92_stock_image_verified mu_bt_trace_attach mu_paired_start_tick mu_paired_start_usb_ended mu_usb_exit_arm mu_usb_exit_tick cp_wcp_bt_resume_wired au98_drive_stock_native_ack; do
              awk -v name="$sym" '\''$7!="UND" && $8==name {found=1} END {exit !found}'\'' output/elf.txt
            done
          '
      - name: Collect exact existing full ARM donor executable and record source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p output/donor
          gh run download 46109600160 --repo "$GITHUB_REPOSITORY" --name R105248-full-donor-auto-ie-arm-NO-INSTALL --dir output/donor
          printf '%s\n' "source=$(git rev-parse HEAD)" 'donor_run=46109600160' > output/revisions.txt
          cp lab/mu1005_bt_runtime/STATUS_CN.md output/README.md
          (cd output && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: R105281-native-bt-runtime-and-donor-NO-INSTALL
          path: output/
          if-no-files-found: error
