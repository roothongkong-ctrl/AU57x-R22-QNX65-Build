name: R105.197 owner dispatch lifetime lease boundary (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105185-route4-5.yml, lab/mu1005_route4_5/**]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  owner-dispatch-lease:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test new dispatch lease boundary only
        run: |
          set -euxo pipefail
          s=project/source/legacy_mu1005/bluetooth
          cc -std=gnu99 -Wall -Wextra -Werror -I"$s" "$s/bt_queue_pulse.c" lab/mu1005_route4_5/test_queue_lease.c -o "$RUNNER_TEMP/lease"
          "$RUNNER_TEMP/lease"
      - uses: ./.github/actions/mu1005-qnx-image
        with:
          require-cache: 'true'
      - name: Compile changed actual ARM queue dispatch
        run: |
          set -euxo pipefail
          mkdir -p evidence
          s=project/source/legacy_mu1005/bluetooth
          docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src qnx65-armv7-toolchain:8.5 arm-unknown-nto-qnx6.5.0eabi-gcc -std=gnu99 -D_QNX_SOURCE -Wall -Wextra -Werror -O2 -fPIC -I"$s" -c "$s/bt_queue_pulse.c" -o /src/evidence/bt_queue_pulse.o
          readelf -h evidence/bt_queue_pulse.o | grep -E 'Machine:.*ARM'
          echo ROUTE6_8_9_DISPATCH_LIFETIME_ARM_COMPILE_ONLY
      - uses: actions/upload-artifact@v4
        with:
          name: R105197-QUEUE-LEASE-NO-INSTALL
          path: evidence/
