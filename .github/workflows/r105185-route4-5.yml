name: R105.200 batch B startup and transport error boundaries (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105185-route4-5.yml, lab/mu1005_route4_5/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup-provider-error:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [0, 1, 2]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test actual startup watcher error handling
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euxo pipefail
          s=project/source/legacy_mu1005/bluetooth
          cc -std=gnu99 -Wall -Wextra -Werror -I"$s" "$s"/{bt_startup_watch,bt_startup_snapshot,bt_trace_latch}.c lab/mu1005_route4_5/test_batch_startup_error.c -o /tmp/startup
          /tmp/startup "$CASE"
  ipc-terminal:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [0, 1, 2]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test existing IPC parser terminal and counter boundaries
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euxo pipefail
          s=project/source/src
          cc -std=c99 -Wall -Wextra -Werror -I"$s" "$s"/{cp_bt_bridge,cp_bt_stream,cp_step2_transport,cp_step2_ipc_link}.c lab/mu1005_route4_5/test_batch_ipc_close.c -o /tmp/ipc
          /tmp/ipc "$CASE"
