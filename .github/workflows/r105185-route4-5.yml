name: R105.213 existing original receiver coordinator (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105185-route4-5.yml, lab/mu1005_route4_5/dio_existing_receiver.*, lab/mu1005_route4_5/test_dio_existing_receiver.c]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-singleton-coordinator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify direct existing singleton and restoration on open failure
        run: |
          set -euxo pipefail
          a=project/source/legacy_mu1005/airplay
          l=lab/mu1005_route4_5
          cc -std=c99 -Wall -Wextra -Werror -rdynamic -I"$a" "$l/dio_existing_receiver.c" "$l/test_dio_existing_receiver.c" -ldl -o /tmp/dio
          /tmp/dio
