name: R105.187 route4 native read-only identity and route5 backup mapping (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105185-route4-5.yml, lab/mu1005_route4_5/**]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  route4-native-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Reuse accepted reference and compile new host identity helper
        run: |
          set -euxo pipefail
          l=lab/mu1005_route4_5
          mkdir -p package
          gh run download 46027944302 --repo "$GITHUB_REPOSITORY" --name R105186-ROUTE4-READONLY-NO-INSTALL --dir package
          (cd package && sha256sum -c SHA256SUMS)
          python3 "$l/make_identity_header.py" package/reference_manifest.json "$l/identity_rows.h"
          cc -std=gnu99 -Wall -Wextra -Werror -DHOST_TEST -Itools/review_txn "$l/observe_identity.c" tools/review_txn/sha256.c -o "$RUNNER_TEMP/identity"
          printf abc > "$RUNNER_TEMP/a"
          ln "$RUNNER_TEMP/a" "$RUNNER_TEMP/alias"
          cp "$RUNNER_TEMP/a" "$RUNNER_TEMP/copy"
          printf xyz > "$RUNNER_TEMP/wrong"
          "$RUNNER_TEMP/identity" "$RUNNER_TEMP/a" "$RUNNER_TEMP/alias" | grep -F SAME_FILE
          "$RUNNER_TEMP/identity" "$RUNNER_TEMP/a" "$RUNNER_TEMP/copy" | grep -F DISTINCT_FILE
          "$RUNNER_TEMP/identity" "$RUNNER_TEMP/a" "$RUNNER_TEMP/wrong" | grep -F DIFFERENT_BYTES
      - uses: ./.github/actions/mu1005-qnx-image
        with:
          require-cache: 'true'
      - name: Compile new read-only QNX ARM helper
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src qnx65-armv7-toolchain:8.5 arm-unknown-nto-qnx6.5.0eabi-gcc -std=gnu99 -D_QNX_SOURCE -Wall -Wextra -Werror -O2 -Itools/review_txn lab/mu1005_route4_5/observe_identity.c tools/review_txn/sha256.c -o /src/package/observe-identity
          readelf -h package/observe-identity | grep -E 'Machine:.*ARM'
          (cd package && sha256sum reference_manifest.json candidate_paths.tsv observe_files.sh observe-identity > SHA256SUMS)
          echo ROUTE4_NATIVE_IDENTITY_ARM_COMPILE_ONLY
      - uses: actions/upload-artifact@v4
        with:
          name: R105187-ROUTE4-IDENTITY-READONLY
          path: package/
  route5-backup-mapping:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test new explicit backup mapping against retained verifier
        run: python3 lab/mu1005_route4_5/test_backup_mapping.py -v
