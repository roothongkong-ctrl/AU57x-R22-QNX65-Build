name: R105.211 supervised startup to native queue (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105185-route4-5.yml, lab/mu1005_route4_5/supervised_startup.*, lab/mu1005_route4_5/test_supervised_startup.c]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-startup-coordinator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test coordinator pending, terminal failure and single queue handoff
        run: |
          set -euxo pipefail
          l=lab/mu1005_route4_5
          s=project/source/legacy_mu1005/bluetooth
          cc -std=c99 -Wall -Wextra -Werror -I"$s" "$l/supervised_startup.c" "$l/test_supervised_startup.c" -o /tmp/startup
          /tmp/startup
  qnx-arm-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mu1005-qnx-image
        with:
          require-cache: 'true'
      - name: Compile and combine coordinator with actual native watcher
        run: |
          set -euxo pipefail
          mkdir -p evidence
          docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src qnx65-armv7-toolchain:8.5 bash -ec '
            cc=arm-unknown-nto-qnx6.5.0eabi-gcc
            s=project/source/legacy_mu1005/bluetooth
            l=lab/mu1005_route4_5
            for spec in "$l/supervised_startup" "$l/supervised_notify" "$s/bt_startup_watch"; do
              "$cc" -std=gnu99 -D_QNX_SOURCE -Wall -Wextra -Werror -O2 -I"$s" -c "$spec.c" -o "evidence/${spec##*/}.o"
            done
            "$cc" -nostdlib -r evidence/{supervised_startup,supervised_notify,bt_startup_watch}.o -o evidence/startup-combined.o
          '
          readelf -h evidence/startup-combined.o | grep -E 'Machine:.*ARM'
          readelf -Ws evidence/startup-combined.o | grep -E 'GLOBAL.*mu_bt_startup_bootstrap_tick'
      - uses: actions/upload-artifact@v4
        with:
          name: R105211-startup-ARM-NO-INSTALL
          path: evidence/startup-combined.o
