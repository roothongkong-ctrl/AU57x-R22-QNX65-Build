name: R105.193 four-route fallback transaction lab (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105185-route4-5.yml, lab/mu1005_route4_5/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fallback-sequence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reuse existing transaction supervisor for new four-route sequence
        run: |
          set -euxo pipefail
          s=tools/review_txn
          cc -std=c99 -Wall -Wextra -Werror -pedantic "$s"/{txn,sha256,fixture_cli,supervisor_fixture}.c -o "$RUNNER_TEMP/txn"
          mkdir -p evidence
          TXN_TEST_BIN="$RUNNER_TEMP/txn" python3 -B lab/mu1005_route4_5/test_fallback_lab.py 2>&1 | tee evidence/fallback-tests.txt
          cp lab/mu1005_route4_5/FOUR_ROUTE_PLAN_CN.md evidence/
          echo ROUTE_FOUR_SEQUENCE_HOST_FIXTURE_ONLY_NO_INSTALL
      - uses: actions/upload-artifact@v4
        with:
          name: R105193-FOUR-ROUTE-LAB-NO-INSTALL
          path: evidence/
