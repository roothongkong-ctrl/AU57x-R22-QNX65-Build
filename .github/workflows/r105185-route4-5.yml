name: R105.202 rolling D receiver owner revocation (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105185-route4-5.yml, lab/mu1005_route4_5/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receiver-owner-revocation:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [0, 1, 2]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exercise actual receiver wrapper with owner revocation
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euxo pipefail
          s=project/source/legacy_mu1005/airplay
          cc -std=c99 -Wall -Wextra -Werror -I"$s" "$s/mu1005_r34_ap_server.c" lab/mu1005_route4_5/test_batch_receiver_owner.c -o /tmp/receiver
          /tmp/receiver "$CASE"
