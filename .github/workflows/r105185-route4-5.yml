name: R105.199 batch A remaining software boundaries (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105185-route4-5.yml, lab/mu1005_route4_5/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mfi-owner-revoke:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test actual existing MFi wrapper after OEM call and release
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euxo pipefail
          s=project/source/src
          cc -std=c99 -Wall -Wextra -Werror -rdynamic -I"$s" "$s/cp_step04_stock_mfi.c" lab/mu1005_route4_5/test_batch_mfi.c -ldl -o /tmp/mfi-test
          /tmp/mfi-test "$CASE"
  receiver-registration:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test actual existing receiver registration verification
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euxo pipefail
          s=integration/mu1005_si_native
          cc -std=c99 -Wall -Wextra -Werror -I"$s" "$s"/{si_mu1005_registration,si_mu1005_layout}.c lab/mu1005_route4_5/test_batch_registration.c -o /tmp/reg-test
          /tmp/reg-test "$CASE"
