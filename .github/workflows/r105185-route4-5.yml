name: R105.191 existing owner dispatch selects ACK only on explicit daemon support (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105185-route4-5.yml, lab/mu1005_route4_5/**]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  owner-ack-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test new ACK witness and owner context via existing real TCP handoff
        run: |
          set -euxo pipefail
          s=project/source/legacy_mu1005/bluetooth
          cc -std=gnu99 -D_DEFAULT_SOURCE -DAU57X_R98_HOST_TEST=1 -Wall -Wextra -Werror -fsanitize=undefined -I"$s" "$s"/{bt_iap2_owner_handoff,rf_arg_experiment,bt_route_gate}.c lab/mu1005_route4_5/test_ack_handoff.c -o "$RUNNER_TEMP/ack-handoff"
          timeout 15 "$RUNNER_TEMP/ack-handoff"
      - uses: ./.github/actions/mu1005-qnx-image
        with:
          require-cache: 'true'
      - name: Compile only changed QNX native glue
        run: |
          set -euxo pipefail
          mkdir -p evidence
          s=project/source/legacy_mu1005/bluetooth
          for n in native_binding bt_iap2_owner_handoff bt_notify_bridge; do
            docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src qnx65-armv7-toolchain:8.5 arm-unknown-nto-qnx6.5.0eabi-gcc -std=gnu99 -D_QNX_SOURCE -Wall -Wextra -Werror -O2 -fPIC -I"$s" -c "$s/$n.c" -o "/src/evidence/$n.o"
            readelf -h "evidence/$n.o" | grep -E 'Machine:.*ARM'
          done
          readelf -Ws evidence/bt_notify_bridge.o | grep -w au98_drive_stock_native_ack
          echo ROUTE6_8_9_ACK_DISPATCH_ARM_COMPILE_ONLY
      - uses: actions/upload-artifact@v4
        with:
          name: R105191-OWNER-ACK-CONTEXT-NO-INSTALL
          path: evidence/
