name: R105.189 reuse accepted probes and MIB workflow (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105185-route4-5.yml, lab/mu1005_route4_5/**]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  assemble-existing-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Reuse existing accepted ARM binaries, not recompile
        run: |
          set -euxo pipefail
          mkdir -p input/identity input/config package/mod/au57x-readonly
          gh run download 46028235774 --repo "$GITHUB_REPOSITORY" --name R105187-ROUTE4-IDENTITY-READONLY --dir input/identity
          gh run download 46020545537 --repo "$GITHUB_REPOSITORY" --name R105173-ROUTE1-READ-ONLY-PROBE --dir input/config
          (cd input/identity && sha256sum -c SHA256SUMS)
          (cd input/config && sha256sum -c SHA256SUMS)
          p=package/mod/au57x-readonly
          cp input/identity/observe-identity input/config/config-path-probe "$p/"
          cp input/identity/reference_manifest.json "$p/"
          cp lab/mu1005_stock_reuse/observe.sh "$p/observe_stock.sh"
          cp lab/mu1005_route4_5/custom_readonly.sh "$p/"
          cp lab/mu1005_route4_5/SIMPLE_REUSE_CN.md package/README_CN.md
          chmod +x "$p/observe-identity" "$p/config-path-probe"
          sh -n "$p/custom_readonly.sh"
          sh -n "$p/observe_stock.sh"
          (cd "$p" && sha256sum observe-identity config-path-probe reference_manifest.json observe_stock.sh custom_readonly.sh > SHA256SUMS && sha256sum -c SHA256SUMS)
          echo ROUTE4_5_6_EXISTING_READONLY_PACKAGE_NOT_RUNTIME
      - uses: actions/upload-artifact@v4
        with:
          name: R105189-MU1005-READONLY-NO-INSTALL
          path: package/
