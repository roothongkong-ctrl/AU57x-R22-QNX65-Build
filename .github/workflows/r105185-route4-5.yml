name: R105.209 SI activation record continuity (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105185-route4-5.yml, lab/mu1005_route4_5/test_activation_revoke.c, integration/mu1005_si_native/si_mu1005_activation.c]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  activation-record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test activation, revocation and record replacement
        run: |
          set -euxo pipefail
          s=integration/mu1005_si_native
          cc -std=c99 -Wall -Wextra -Werror -I"$s" "$s"/{si_mu1005_activation,si_mu1005_layout}.c lab/mu1005_route4_5/test_activation_revoke.c -o /tmp/activation
          /tmp/activation
