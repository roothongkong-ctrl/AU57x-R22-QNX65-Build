name: R105.201 batch C AP same-attempt snapshot and advertisement (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105185-route4-5.yml, lab/mu1005_route4_5/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ap-snapshot-change:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [0, 1]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test actual AP refresh with generation and credentials changes
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euxo pipefail
          s=project/source/src
          a=integration/mu1005_si_native/ap_live
          cc -std=gnu99 -Wall -Wextra -Werror -I"$s" -I"$a" -Iproject/source/legacy_mu1005/bluetooth -Iproject/source/legacy_mu1005/airplay "$a"/{ap_live,ap_refresh}.c "$s"/{cp_csm,cp_radio_policy}.c lab/mu1005_route4_5/test_batch_ap_epoch.c -o /tmp/ap-epoch
          /tmp/ap-epoch "$CASE"
