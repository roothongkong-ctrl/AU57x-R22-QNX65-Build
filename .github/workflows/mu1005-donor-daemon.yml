name: MU1005 complete upstream daemon reuse (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/mu1005-donor-daemon.yml, integration/mu1005_donor_daemon/**, tools/mu1005_lifecycle_observer.py, tools/mu1005_efs_launcher_stage.py, tests/test_mu1005_efs_launcher_stage.py]
  workflow_dispatch:
permissions:
  contents: read
env:
  DONOR: 20c94f51c0f0ae88b154c12e4f604643ba23022c
  TOOLCHAIN: baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
jobs:
  actual-host-daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact launcher schema staging (synthetic only)
        run: python3 tests/test_mu1005_efs_launcher_stage.py
      - name: Fetch exact upstream daemon source
        run: |
          set -euxo pipefail
          git init donor
          git -C donor remote add origin https://github.com/luka-dev/mib2q-carplay-rgi.git
          git -C donor fetch --depth 1 origin "$DONOR"
          git -C donor checkout --detach FETCH_HEAD
          test "$(git -C donor rev-parse HEAD)" = "$DONOR"
          mkdir -p donor-host-evidence
          rustup toolchain install nightly-2026-07-21 --profile minimal
      - name: Compile and test upstream as-is, no software MFi feature
        run: |
          set -euxo pipefail
          cargo +nightly-2026-07-21 test --offline --locked --workspace --manifest-path donor/wireless/daemon/Cargo.toml 2>&1 | tee donor-host-evidence/upstream-tests.log
          cargo +nightly-2026-07-21 build --offline --locked --bin mhi2q-wireless-daemon --manifest-path donor/wireless/daemon/Cargo.toml 2>&1 | tee donor-host-evidence/upstream-build.log
      - name: Join real donor executable to current MU1005 C transport and run rollback regression
        run: bash integration/mu1005_donor_daemon/run_host.sh donor donor-host-evidence
      - name: Adapt complete donor daemon to original MU1005 live AP
        run: |
          set -euxo pipefail
          python3 integration/mu1005_donor_daemon/adapt_live_ap.py donor | tee donor-host-evidence/ap-port.log
          python3 integration/mu1005_donor_daemon/adapt_receiver_unix.py donor | tee donor-host-evidence/unix-port.log
          python3 integration/mu1005_donor_daemon/adapt_mfi_sequence.py donor | tee donor-host-evidence/mfi-port.log
          git -C donor diff -- wireless/daemon > donor-host-evidence/ap-port.diff
          cargo +nightly-2026-07-21 test --offline --locked --workspace --manifest-path donor/wireless/daemon/Cargo.toml 2>&1 | tee donor-host-evidence/adapted-tests.log
          cargo +nightly-2026-07-21 build --offline --locked --bin mhi2q-wireless-daemon --manifest-path donor/wireless/daemon/Cargo.toml 2>&1 | tee donor-host-evidence/adapted-build.log
          grep -F 'mu1005_live_ap_both_bands_reach_real_donor_wire ... ok' donor-host-evidence/adapted-tests.log
          grep -F 'private_socket_real_exchange_and_denial ... ok' donor-host-evidence/adapted-tests.log
          grep -F 'mu1005_mfi_requires_current_real_provider_exchange ... ok' donor-host-evidence/adapted-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mu1005-donor-host-NO-INSTALL
          path: donor-host-evidence/
          retention-days: 30
  qnx-arm-daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fetch locked daemon and Rust-capable QNX compiler
        run: |
          set -euxo pipefail
          mkdir -p donor-arm-evidence
          git init donor
          git -C donor remote add origin https://github.com/luka-dev/mib2q-carplay-rgi.git
          git -C donor fetch --depth 1 origin "$DONOR"
          git -C donor checkout --detach FETCH_HEAD
          test "$(git -C donor rev-parse HEAD)" = "$DONOR"
          git init toolchain
          git -C toolchain remote add origin https://github.com/luka-dev/qnx65-armv7-toolchain.git
          git -C toolchain fetch --depth 1 origin "$TOOLCHAIN"
          git -C toolchain checkout --detach FETCH_HEAD
          test "$(git -C toolchain rev-parse HEAD)" = "$TOOLCHAIN"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/au57x-gnu
          key: mu1005-gnu-gcc850-d308841a-binutils238-e316477a-v1
      - name: Verify GNU sources
        run: bash tools/ci/mu1005_gnu_mirrors.sh "$HOME/.cache/au57x-gnu" toolchain
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: toolchain
          platforms: linux/amd64
          target: with-rust
          build-args: BASE=base-8.5
          tags: mu1005-qnx65-rust:review
          load: true
          push: false
          cache-from: |
            type=gha,scope=mu1005-qnx65-baa45224-gcc85-v1
            type=gha,scope=mu1005-qnx65-baa45224-rust-v1
          cache-to: type=gha,scope=mu1005-qnx65-baa45224-rust-v1,mode=min,ignore-error=true
      - name: Adapt original MU1005 live AP source
        run: |
          set -euxo pipefail
          python3 integration/mu1005_donor_daemon/adapt_live_ap.py donor | tee donor-arm-evidence/ap-port.log
          python3 integration/mu1005_donor_daemon/adapt_receiver_unix.py donor | tee donor-arm-evidence/unix-port.log
          python3 integration/mu1005_donor_daemon/adapt_mfi_sequence.py donor | tee donor-arm-evidence/mfi-port.log
          git -C donor diff -- wireless/daemon > donor-arm-evidence/ap-port.diff
      - name: Build adapted full QNX daemon (default feature set)
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src/donor mu1005-qnx65-rust:review \
            /opt/rust/qnx-cargo build --locked --manifest-path /src/donor/wireless/daemon/Cargo.toml --bin mhi2q-wireless-daemon 2>&1 | tee donor-arm-evidence/build.log
          bin=donor/wireless/daemon/target/armv7-unknown-nto-qnx650/release/mhi2q-wireless-daemon
          test -s "$bin"
          readelf -h -dW -AW "$bin" | tee donor-arm-evidence/elf.log
          grep -Eq 'Machine:.*ARM' donor-arm-evidence/elf.log
          grep -Eq 'Class:.*ELF32' donor-arm-evidence/elf.log
          sha256sum "$bin" | tee donor-arm-evidence/daemon.sha256
          # Explicitly non-installable research payload, not named like stock binary.
          cp "$bin" donor-arm-evidence/donor-daemon-MU1005-AP-REVIEW-ONLY.bin
          for f in LICENSE LICENSE.md COPYING; do if test -f "donor/$f"; then cp "donor/$f" donor-arm-evidence/; fi; done
          printf '%s\n' 'NO INSTALL: live AP source adapted; actual band selection, MU1005 runtime ABI, MFi owner, receiver and hardware not accepted' "donor=$DONOR" "toolchain=$TOOLCHAIN" "source=$GITHUB_SHA" > donor-arm-evidence/STATUS.txt
      - name: Build and run actual adapted donor engine in QNX (isolated lab)
        run: |
          set -euxo pipefail
          mkdir -p donor/wireless/daemon/examples
          cp integration/mu1005_donor_daemon/qnx_bridge_lab.rs donor/wireless/daemon/examples/mu1005-donor-lab.rs
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src/donor mu1005-qnx65-rust:review \
            /opt/rust/qnx-cargo build --locked --manifest-path /src/donor/wireless/daemon/Cargo.toml --example mu1005-donor-lab 2>&1 | tee donor-arm-evidence/lab-rust-build.log
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src mu1005-qnx65-rust:review bash -c '
            set -eux
            b=project/source/legacy_mu1005/bluetooth
            r=integration/mu1005_donor_daemon
            cc=arm-unknown-nto-qnx6.5.0eabi-gcc
            "$cc" -std=gnu99 -O2 -Wall -Wextra -Werror -Dmain=mu1005_bridge_peer_main -I"$b" -c "$r/bridge_peer.c" -o donor-arm-evidence/lab-peer.o
            "$cc" -std=gnu99 -O2 -Wall -Wextra -Werror "$r/qnx_launch_lab.c" donor-arm-evidence/lab-peer.o "$b"/{mu1005_rf_ingress,mu1005_ipc_stream,mu1005_socket_pump}.c -lsocket -lc -o donor-arm-evidence/mu1005-donor-launch
          ' 2>&1 | tee donor-arm-evidence/lab-c-build.log
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm
          docker tag mu1005-qnx65-rust:review qnx65-armv7-toolchain:8.5
          python3 integration/mu1005_donor_daemon/prepare_qnx_donor_ifs.py toolchain/tests/qemu-run.sh
          export QNX_DONOR_LAB="$PWD/donor/wireless/daemon/target/armv7-unknown-nto-qnx650/release/examples/mu1005-donor-lab"
          export QNX_DONOR_DIO_FIXTURE="$PWD/donor/wireless/daemon/probes/dio_manager.fixture.json"
          test -s "$QNX_DONOR_LAB"
          QEMU_KEEP_LOG="$PWD/donor-arm-evidence/lab-serial.log" QEMU_TIMEOUT=95 QEMU_RUN_SECS=50 sh toolchain/tests/qemu-run.sh "$PWD/donor-arm-evidence/mu1005-donor-launch" 8.5 2>&1 | tee donor-arm-evidence/lab-runtime.log
          grep -F MU1005_DONOR_QNX_RUST_ENGINE_TWO_TCP_PASS_NO_OEM donor-arm-evidence/lab-runtime.log
          grep -F MU1005_DONOR_QNX_SPAWN_AND_FOUR_GENERATIONS_PASS_NO_OEM donor-arm-evidence/lab-runtime.log
          grep -E 'Process [0-9]+ \(mu1005-donor-launch\) exited status=0' donor-arm-evidence/lab-serial.log
      - name: Validate relocated PHDR layout on real QNX lab executable
        run: |
          set -euxo pipefail
          python3 integration/mu1005_donor_daemon/qnx_phdr_lab.py donor-arm-evidence/mu1005-donor-launch donor-arm-evidence/mu1005-phdr-lab
          readelf -lW donor-arm-evidence/mu1005-phdr-lab | tee donor-arm-evidence/phdr-layout.log
          export QNX_DONOR_LAB="$PWD/donor/wireless/daemon/target/armv7-unknown-nto-qnx650/release/examples/mu1005-donor-lab"
          export QNX_DONOR_DIO_FIXTURE="$PWD/donor/wireless/daemon/probes/dio_manager.fixture.json"
          QEMU_KEEP_LOG="$PWD/donor-arm-evidence/phdr-serial.log" QEMU_TIMEOUT=95 QEMU_RUN_SECS=50 sh toolchain/tests/qemu-run.sh "$PWD/donor-arm-evidence/mu1005-phdr-lab" 8.5 2>&1 | tee donor-arm-evidence/phdr-runtime.log
          grep -F MU1005_DONOR_QNX_SPAWN_AND_FOUR_GENERATIONS_PASS_NO_OEM donor-arm-evidence/phdr-runtime.log
          grep -E 'Process [0-9]+ \(mu1005-phdr-lab\) exited status=0' donor-arm-evidence/phdr-serial.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mu1005-full-donor-arm-NO-INSTALL
          path: donor-arm-evidence/
          retention-days: 30
