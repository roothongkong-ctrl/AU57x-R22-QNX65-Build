name: R105.148 exact PIC logging provider in three native QNX guests (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105148-pic-native.yml, lab/mu1005_pic_native/**]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pic-native:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        program: [btstack, bluetooth, smartphone_integrator]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: "45923122041"
    steps:
      - uses: actions/checkout@v4
      - name: Obtain retained archive from existing NAS task (no second NAS request)
        run: |
          set -euo pipefail
          mkdir -p firmware evidence
          # A push that updates both workflows uses its own acquisition run.
          # Never consume the known failed 20-minute run or duplicate a NAS request.
          if [ -z "$SOURCE_RUN" ]; then
            for i in $(seq 1 40); do
              SOURCE_RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mu1005-oem-nas.yml --branch mu1005-si-cprx-real-review --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              if [ -n "$SOURCE_RUN" ]; then break; fi
              sleep 15
            done
          fi
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          echo "NAS_SOURCE_RUN:$SOURCE_RUN"
          for i in $(seq 1 380); do
            result=$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '.status + ":" + .conclusion')
            if [ "$result" = "completed:success" ]; then break; fi
            if [[ "$result" == completed:* ]]; then echo "NAS_SOURCE_NOT_SUCCESS:$result"; exit 2; fi
            sleep 15
          done
          test "$result" = "completed:success"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name mu1005-nas-firmware-archive --dir firmware
          echo "6946216d1f87f073aefc873a4252b9b952d261e3b9fd2fedf403d26ea2f2db94  firmware/MHI2_CN_AU57x_K1006_2_MU1005_4M0906961EJ.7z" | sha256sum -c -
      - name: Fetch exact upstream MHI2 extractor and QNX6 reader
        run: |
          set -euxo pipefail
          git init extractor
          git -C extractor remote add origin https://github.com/harman-f/MHI2-MHI2Q-MH2P-Firmware-Toolkit.git
          git -C extractor fetch --depth 1 origin 64a44fe23dbaa08771440d69642d2874d7028295
          git -C extractor checkout --detach FETCH_HEAD
          test "$(git -C extractor rev-parse HEAD)" = 64a44fe23dbaa08771440d69642d2874d7028295
          git init qnxmount
          git -C qnxmount remote add origin https://github.com/NetherlandsForensicInstitute/qnxmount.git
          git -C qnxmount fetch --depth 1 origin 0379c064975d5bbe3595ac7e3d149ea789406794
          git -C qnxmount checkout --detach FETCH_HEAD
          test "$(git -C qnxmount rev-parse HEAD)" = 0379c064975d5bbe3595ac7e3d149ea789406794
          python3 -m venv /tmp/mu1005-extract-venv
          /tmp/mu1005-extract-venv/bin/pip install kaitaistruct==0.11 crcmod==1.7
          command -v 7z || { sudo apt-get update -qq && sudo apt-get install -y p7zip-full; }
      - name: Extract exact app70 and stage2/EFS into a common original-only tree
        run: |
          set -euo pipefail
          archive="$PWD/firmware/MHI2_CN_AU57x_K1006_2_MU1005_4M0906961EJ.7z"
          mkdir -p "${RUNNER_TEMP}/combined"
          python3 tools/mu1005_extract_app70.py "$archive" "${RUNNER_TEMP}/app70/app.img"
          /tmp/mu1005-extract-venv/bin/python extractor/tools/extract_firmware.py --source "${RUNNER_TEMP}/app70/app.img" --output "${RUNNER_TEMP}/combined/app70" --variant 70 --qnxmount-root "$PWD/qnxmount" > evidence/app-summary.json
          /tmp/mu1005-extract-venv/bin/python tools/mu1005_extract_stage2.py "$archive" "${RUNNER_TEMP}/combined/stage2" --toolkit extractor --qnxmount qnxmount --report evidence/stage2-summary.json
      - name: Fetch locked public QNX boot environment and QEMU
        run: |
          set -euxo pipefail
          mkdir -p qnx-runtime-evidence
          git init toolchain
          git -C toolchain remote add origin https://github.com/luka-dev/qnx65-armv7-toolchain.git
          git -C toolchain fetch --depth 1 origin baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          git -C toolchain checkout --detach FETCH_HEAD
          test "$(git -C toolchain rev-parse HEAD)" = baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          for f in startup-virt libstartup.a devc-serdebug u-boot.bin; do test -s "toolchain/tests/qemu/$f"; done
          # Ubuntu packages only: unrelated Microsoft repo returned HTTP 403.
          if ! command -v qemu-system-arm >/dev/null; then
            test -f /etc/apt/sources.list.d/ubuntu.sources
            aptopts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
            sudo apt-get "${aptopts[@]}" update -qq
            sudo apt-get "${aptopts[@]}" install -y -qq qemu-system-arm
          fi
          qemu-system-arm --version | tee qnx-runtime-evidence/qemu-version.log
          sha256sum toolchain/tests/qemu/{startup-virt,libstartup.a,devc-serdebug,u-boot.bin} toolchain/tests/qemu-run.sh | tee qnx-runtime-evidence/boot-inputs.sha256
      - uses: actions/cache/restore@v4
        id: gnu-cache
        with:
          path: ~/.cache/au57x-gnu
          key: mu1005-gnu-gcc850-d308841a-binutils238-e316477a-v1
      - name: Configure reusable compiler build cache
        uses: docker/setup-buildx-action@v3
      - name: Build verified toolchain
        run: |
          set -euxo pipefail
          bash tools/ci/mu1005_gnu_mirrors.sh "$HOME/.cache/au57x-gnu" toolchain | tee qnx-runtime-evidence/gnu.log
          docker buildx build --load --platform linux/amd64 --target base-env --build-arg BASE=base-8.5 --cache-from type=gha,scope=mu1005-qnx65-baa45224-gcc85-v1 --cache-to type=gha,scope=mu1005-qnx65-baa45224-gcc85-v1,mode=min,ignore-error=true -t qnx65-armv7-toolchain:8.5 toolchain 2>&1 | tee qnx-runtime-evidence/compiler.log
          docker run --rm --platform linux/amd64 qnx65-armv7-toolchain:8.5 arm-unknown-nto-qnx6.5.0eabi-gcc --version | tee qnx-runtime-evidence/compiler-version.log
      - name: Build confirmed PIC archive member and run actual OEM guest
        env:
          PROGRAM: ${{ matrix.program }}
        run: |
          set -euo pipefail
          bash lab/mu1005_pic_native/run.sh "$PROGRAM"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r105148-${{ matrix.program }}-pic-native-NO-INSTALL
          path: |
            qnx-runtime-evidence/sdk-build.log
            qnx-runtime-evidence/*/*.json
            qnx-runtime-evidence/*/*-result.txt
          retention-days: 30
