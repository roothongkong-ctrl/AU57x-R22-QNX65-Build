name: R105.106 radio capability probe and logging symbol diagnosis (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105106-radio-probe.yml, lab/mu1005_radio_probe/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  radio-host:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test portable frequency and flag classification
        run: |
          mkdir -p evidence
          ${{ matrix.compiler }} -std=c99 -Wall -Wextra -Werror -O1 -g -fsanitize=undefined -Ilab/mu1005_radio_probe lab/mu1005_radio_probe/radio_classify.c lab/mu1005_radio_probe/test_radio_classify.c -o /tmp/test-radio
          /tmp/test-radio | tee evidence/radio-host.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r105106-host-${{ matrix.compiler }}-NO-INSTALL
          path: evidence/
  radio-qnx:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p qnx-runtime-evidence
      - name: Fetch locked public QNX boot environment and QEMU
        run: |
          set -euxo pipefail
          git init toolchain
          git -C toolchain remote add origin https://github.com/luka-dev/qnx65-armv7-toolchain.git
          git -C toolchain fetch --depth 1 origin baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          git -C toolchain checkout --detach FETCH_HEAD
          test "$(git -C toolchain rev-parse HEAD)" = baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          for f in startup-virt libstartup.a devc-serdebug u-boot.bin; do test -s "toolchain/tests/qemu/$f"; done
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm
          qemu-system-arm --version | tee qnx-runtime-evidence/qemu-version.log
          sha256sum toolchain/tests/qemu/{startup-virt,libstartup.a,devc-serdebug,u-boot.bin} toolchain/tests/qemu-run.sh | tee qnx-runtime-evidence/boot-inputs.sha256
      - uses: actions/cache/restore@v4
        id: gnu-cache
        with:
          path: ~/.cache/au57x-gnu
          key: mu1005-gnu-gcc850-d308841a-binutils238-e316477a-v1
      - name: Configure reusable compiler build cache
        uses: docker/setup-buildx-action@v3
      - name: Build verified toolchain
        run: |
          set -euxo pipefail
          bash tools/ci/mu1005_gnu_mirrors.sh "$HOME/.cache/au57x-gnu" toolchain | tee qnx-runtime-evidence/gnu.log
          docker buildx build --load --platform linux/amd64 --target base-env --build-arg BASE=base-8.5 --cache-from type=gha,scope=mu1005-qnx65-baa45224-gcc85-v1 --cache-to type=gha,scope=mu1005-qnx65-baa45224-gcc85-v1,mode=min,ignore-error=true -t qnx65-armv7-toolchain:8.5 toolchain 2>&1 | tee qnx-runtime-evidence/compiler.log
          docker run --rm --platform linux/amd64 qnx65-armv7-toolchain:8.5 arm-unknown-nto-qnx6.5.0eabi-gcc --version | tee qnx-runtime-evidence/compiler-version.log
      - name: Compile read-only native QNX radio probe against actual SDK headers
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src qnx65-armv7-toolchain:8.5 bash -c '
            arm-unknown-nto-qnx6.5.0eabi-gcc -std=gnu99 -D_QNX_SOURCE -Wall -Wextra -Werror -O2 lab/mu1005_radio_probe/radio_classify.c lab/mu1005_radio_probe/qnx_radio_probe.c -lsocket -lc -o qnx-runtime-evidence/mu1005-radio-probe
            arm-unknown-nto-qnx6.5.0eabi-readelf -h -dW qnx-runtime-evidence/mu1005-radio-probe
          ' | tee qnx-runtime-evidence/probe-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r105106-radio-arm-NO-INSTALL
          path: qnx-runtime-evidence/
  logging:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose exact SDK libc static and dynamic slogf definitions
        run: |
          set -euo pipefail
          mkdir evidence
          root=https://raw.githubusercontent.com/luka-dev/qnx65-armv7-toolchain/baa45224f18ae6b13c2e9c77c6663bb8181eb6a1/sdp/target/qnx6/armle-v7/lib
          curl -fLsS --max-time 60 "$root/libc.a" -o /tmp/libc.a
          curl -fLsS --max-time 60 "$root/libc.so.3" -o /tmp/libc.so.3
          test "$(git hash-object /tmp/libc.a)" = a23748fe03e3184f563e1075ef88cf0c610daf74
          test "$(git hash-object /tmp/libc.so.3)" = c7e7b5aa9dd3ef8580d1a215c013cbe252ca80e7
          { readelf -Ws /tmp/libc.a | grep -E ' (slogf|vslogf|slogb)(@|$)' || true; } > evidence/archive-symbols.txt
          { readelf -Ws /tmp/libc.so.3 | grep -E ' (slogf|vslogf|slogb)(@|$)' || true; } > evidence/section-symbols.txt
          { readelf -D -sW /tmp/libc.so.3 | grep -E ' (slogf|vslogf|slogb)(@|$)' || true; } > evidence/dynamic-symbols.txt
          cat evidence/*.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r105106-logging-NO-INSTALL
          path: evidence/
