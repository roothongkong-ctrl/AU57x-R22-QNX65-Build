name: MU1005 isolated QNX runtime review (NO INSTALL)
on:
  push:
    branches: [mu1005-cloud-isolated-runtime-review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qnx:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PIN: baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
      IMG: qnx65-armv7-toolchain:8.5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned QNX environment
        id: setup
        run: |
          set -euxo pipefail
          mkdir -p build/qnx
          sha256sum -c R137_PRELOAD_SHA256.txt
          sha256sum -c R132_TRACE_SHA256.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm
          git init -q "$RUNNER_TEMP/toolchain"
          git -C "$RUNNER_TEMP/toolchain" remote add origin https://github.com/luka-dev/qnx65-armv7-toolchain.git
          git -C "$RUNNER_TEMP/toolchain" fetch --depth 1 origin "$PIN"
          git -C "$RUNNER_TEMP/toolchain" checkout -q FETCH_HEAD
          git -C "$RUNNER_TEMP/toolchain" rev-parse HEAD | tee build/qnx/toolchain_commit.txt
          docker build --platform linux/amd64 --target base-env --build-arg BASE=base-8.5 -t "$IMG" "$RUNNER_TEMP/toolchain" 2>&1 | tee build/qnx/toolchain.log
      - name: ARM variadic trace proof independent of preload
        if: always() && steps.setup.outcome == 'success'
        run: |
          set -euxo pipefail
          sed 's/R137_PRELOAD_SHA256.txt/R132_TRACE_SHA256.txt/' ci/r140_trace_target.sh > build/qnx/trace_target_review.sh
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src "$IMG" bash /src/build/qnx/trace_target_review.sh 2>&1 | tee build/qnx/trace_compile.log
          QEMU_KEEP_LOG="$PWD/build/qnx/trace_boot.log" QEMU_RUN_SECS=20 QEMU_TIMEOUT=80 bash "$RUNNER_TEMP/toolchain/tests/qemu-run.sh" "$PWD/build/qnx/r132_arm_trace_smoke" 8.5 2>&1 | tee build/qnx/trace_runtime.log
          grep -Fq AU57X_R132_QNX_ARM_VARIADIC_PASSTHROUGH_OK_NO_OEM build/qnx/trace_runtime.log
      - name: Compile preload and loader diagnostics
        id: preload_build
        if: always() && steps.setup.outcome == 'success'
        run: |
          set -euxo pipefail
          cat >build/qnx/loader_diag.c <<'C'
          #include <sys/types.h>
          #include <sys/stat.h>
          #include <dlfcn.h>
          #include <errno.h>
          #include <stdio.h>
          #include <unistd.h>
          #include <string.h>
          int main(void) {
            const char *path="/proc/boot/libau57x_r137_preload_REVIEW.so";
            struct stat st;
            if(stat(path,&st)){printf("REVIEW_STAT_FAIL errno=%d %s\n",errno,strerror(errno));return 1;}
            printf("REVIEW_STAT_OK size=%ld\n",(long)st.st_size);
            if(access(path,R_OK)){printf("REVIEW_READ_FAIL errno=%d %s\n",errno,strerror(errno));return 2;}
            void *h=dlopen(path,RTLD_NOW|RTLD_LOCAL);
            if(!h){const char *e=dlerror();printf("REVIEW_DLOPEN_FAIL %s\n",e?e:"unknown");return 3;}
            void *p=dlsym(h,"r137_preload_pid");void *q=dlsym(h,"r137_preload_count");
            int (*pid)(void)=0;unsigned (*count)(void)=0;
            if(!p||!q||sizeof p!=sizeof pid||sizeof q!=sizeof count){puts("REVIEW_SYMBOL_FAIL");return 4;}
            memcpy(&pid,&p,sizeof pid);memcpy(&count,&q,sizeof count);
            if(pid()!=(int)getpid()||count()!=1){puts("REVIEW_CONSTRUCTOR_FAIL");return 5;}
            puts("REVIEW_DLOPEN_CONSTRUCTOR_OK_NO_OEM");
            return 0;
          }
          C
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src "$IMG" bash -c 'bash ci/r137_target.sh && arm-unknown-nto-qnx6.5.0eabi-gcc -D_QNX_SOURCE=1 -O2 -Wall -Wextra -Werror build/qnx/loader_diag.c -o build/qnx/loader_diag' 2>&1 | tee build/qnx/loader_compile.log
          python3 - "$RUNNER_TEMP/toolchain/tests/qemu-run.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          def replace(s,a,b):
              if s.count(a)!=1: raise SystemExit("upstream anchor mismatch: "+a)
              return s.replace(a,b,1)
          s=replace(s,'cp "$BIN" "$WORK/$NAME"\n','cp "$BIN" "$WORK/$NAME"\ncp "$REVIEW_LIB" "$WORK/"\n')
          s=replace(s,'EOF\n\ndocker run --rm --platform=linux/amd64 -v "$WORK":/w','EOF\nprintf "%s\\n" "$(basename "$REVIEW_LIB")" >> "$WORK/test.build"\n\ndocker run --rm --platform=linux/amd64 -v "$WORK":/w')
          p.with_name("qemu-run-loader-review.sh").write_text(s)
          t=replace(s,'    $NAME\n    display_msg "@@QNXRUN-END@@"','    LD_PRELOAD=/proc/boot/libau57x_r137_preload_REVIEW.so /proc/boot/$NAME preloaded\n    display_msg "@@QNXRUN-END@@"')
          p.with_name("qemu-run-preload-review.sh").write_text(t)
          PY
      - name: Separate QNX boot - file and dlopen diagnostics
        if: always() && steps.preload_build.outcome == 'success'
        run: |
          set -euxo pipefail
          REVIEW_LIB="$PWD/build/qnx/libau57x_r137_preload_REVIEW.so" QEMU_KEEP_LOG="$PWD/build/qnx/dlopen_boot.log" QEMU_RUN_SECS=20 QEMU_TIMEOUT=80 bash "$RUNNER_TEMP/toolchain/tests/qemu-run-loader-review.sh" "$PWD/build/qnx/loader_diag" 8.5 2>&1 | tee build/qnx/dlopen_runtime.log
          grep -Fq REVIEW_DLOPEN_CONSTRUCTOR_OK_NO_OEM build/qnx/dlopen_runtime.log
      - name: Separate QNX boot - LD_PRELOAD only
        if: always() && steps.preload_build.outcome == 'success'
        run: |
          set -euxo pipefail
          REVIEW_LIB="$PWD/build/qnx/libau57x_r137_preload_REVIEW.so" QEMU_KEEP_LOG="$PWD/build/qnx/preload_boot.log" QEMU_RUN_SECS=20 QEMU_TIMEOUT=80 bash "$RUNNER_TEMP/toolchain/tests/qemu-run-preload-review.sh" "$PWD/build/qnx/r137_preload_test" 8.5 2>&1 | tee build/qnx/preload_runtime.log
          grep -Fq R137_PRELOAD_CONSTRUCTOR_SAME_PID_OK build/qnx/preload_runtime.log
          grep -Fq R137_QNX_READONLY_SELF_AS_OK build/qnx/preload_runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MU1005-isolated-runtime-review-NO-INSTALL
          path: build/qnx/
          retention-days: 7
