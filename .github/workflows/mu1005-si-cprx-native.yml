name: MU1005 unified parallel development (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/mu1005-si-cprx-native.yml, integration/mu1005_si_native/**, tools/ci/mu1005_gnu_mirrors.sh, tools/mu1005_oem_inventory.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch locked original receiver and proven ARM toolchain
        run: |
          set -euxo pipefail
          mkdir -p review/{payload,source,evidence}
          python3 -m py_compile tools/mu1005_oem_inventory.py
          cp tools/mu1005_oem_inventory.py review/source/
          git fetch --depth 1 origin 7f595231394d97091ec0fee209677b6e45fd50dc
          test "$(git rev-parse FETCH_HEAD)" = 7f595231394d97091ec0fee209677b6e45fd50dc
          mkdir r85
          git archive FETCH_HEAD project/source/legacy_mu1005/airplay | tar -x -C r85
          cp -R r85/project/source/legacy_mu1005/airplay review/source/
          cp -R integration/mu1005_si_native review/source/si
          cp -R project/source/legacy_mu1005/bluetooth review/source/bluetooth
          cp third_party/luka-dev/mib2q-carplay-rgi/wireless/graft/eir.c review/source/bluetooth/upstream_eir.c
          test "$(git hash-object review/source/bluetooth/upstream_eir.c)" = 99f42933e7c6b98af11fb387a1e68727ffe31997
          bash integration/mu1005_si_native/r29_full_source/unpack.sh review/source/r29-full
          bash review/source/r29-full/test.sh | tee review/evidence/r29-full-host.log
          # Reuse the actual upstream signer, not a replacement or software credential.
          git init luka
          git -C luka remote add origin https://github.com/luka-dev/mib2q-carplay-rgi.git
          git -C luka fetch --depth 1 origin 20c94f51c0f0ae88b154c12e4f604643ba23022c
          git -C luka checkout --detach FETCH_HEAD
          test "$(git -C luka rev-parse HEAD)" = 20c94f51c0f0ae88b154c12e4f604643ba23022c
          mkdir -p review/source/upstream-signer
          cp luka/hook/wireless/mfi_stock.c review/source/upstream-signer/
          mkdir -p review/source/ap-live
          cp -R integration/mu1005_si_native/ap_live/. review/source/ap-live/
          cp luka/wireless/daemon/src/qnx_process.c review/source/ap-live/
          cp luka/wireless/daemon/src/wifi_ie.rs review/source/ap-live/
          cp project/source/src/cp_csm.{c,h} review/source/ap-live/
          bash review/source/ap-live/test.sh | tee review/evidence/ap-live-host.log
          git -C luka show HEAD:hook/wireless/mfi_stock.c | cmp - review/source/upstream-signer/mfi_stock.c
          # Preserve upstream license alongside verbatim source.
          for lic in LICENSE LICENSE.md COPYING; do
            if test -f "luka/$lic"; then cp "luka/$lic" review/source/upstream-signer/; fi
          done
          test -f review/source/upstream-signer/LICENSE || test -f review/source/upstream-signer/LICENSE.md || test -f review/source/upstream-signer/COPYING

          git init toolchain
          git -C toolchain remote add origin https://github.com/luka-dev/qnx65-armv7-toolchain.git
          git -C toolchain fetch --depth 1 origin baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          git -C toolchain checkout --detach FETCH_HEAD
          test "$(git -C toolchain rev-parse HEAD)" = baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
      - name: Restore checksum-pinned GNU source cache
        id: gnu-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/au57x-gnu
          key: mu1005-gnu-gcc850-d308841a-binutils238-e316477a-v1
      - name: Fetch and verify GNU archives from independent mirrors
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/mu1005_gnu_mirrors.sh "$HOME/.cache/au57x-gnu" toolchain | tee review/evidence/gnu-sources.log
      - name: Save verified archives before building
        if: steps.gnu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/au57x-gnu
          key: mu1005-gnu-gcc850-d308841a-binutils238-e316477a-v1
      - name: Build locked ARM toolchain using verified local archives
        run: |
          set -euxo pipefail
          docker build --platform linux/amd64 --target base-env --build-arg BASE=base-8.5 -t qnx65-armv7-toolchain:8.5 toolchain 2>&1 | tee review/evidence/compiler.log
      - name: Compile and link tested SI and actual CPRX transport on QNX ARM
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src qnx65-armv7-toolchain:8.5 bash -c '
            set -eux
            inner=review/source/si/inner_iap2
            a=review/source/airplay
            s=review/source/si
            C=arm-unknown-nto-qnx6.5.0eabi-gcc
            R=arm-unknown-nto-qnx6.5.0eabi-readelf
            "$C" -std=gnu99 -D_QNX_SOURCE -Wall -Wextra -Werror -O2 -fPIC -shared -Wl,--no-undefined "$inner/inner_iap2.c" "$inner/inner_airplay.c" "$inner/inner_socket.c" "$inner/mm_peer.c" "$inner/mm_notify.c" -lsocket -lc -o review/payload/libmu1005_inner_iap2_review.so
            "$R" -h -dW -sW review/payload/libmu1005_inner_iap2_review.so > review/evidence/inner-iap2-elf.log
            "$C" -print-file-name=libc.so
            "$C" -print-file-name=libsocket.so
            "$C" -std=gnu99 -D_QNX_SOURCE -O2 -Wall -Wextra -Werror -fPIC -shared -Wl,--no-undefined -I"$a" -I"$s" "$s"/{si_mu1005_layout,si_mu1005_registration,si_mu1005_activation,si_mu1005_snapshot,si_mu1005_owner,si_mu1005_cprx}.c "$a"/{cprx_service,native_exports,semantic,mu1005_r34_ap_server}.c -lsocket -lc -o review/payload/libmu1005_si_cprx.so
            "$R" -h -dW -sW review/payload/libmu1005_si_cprx.so > review/evidence/native-elf.log
            # Standalone PIC object; not loaded and not linked into an OEM process.
            # RTLD_NEXT must later resolve genuine libairplay in the same owner process.
            "$C" -std=gnu99 -D_QNX_SOURCE -O2 -Wall -Wextra -Werror -fPIC -c review/source/upstream-signer/mfi_stock.c -o review/payload/mfi_stock-review.o
            "$R" -h -sW review/payload/mfi_stock-review.o > review/evidence/signer-elf.log
            "$C" -std=gnu99 -D_QNX_SOURCE -O2 -Wall -Wextra -Werror -fPIC -DWCP_QNX_LAB_ONLY -DWCP_LAB_BT_TYPE_CANDIDATE=3 -c "$s/r29_profile/wcp_bt_link_profile.c" -o review/payload/r29-bt-profile-review.o
            "$R" -h -sW review/payload/r29-bt-profile-review.o > review/evidence/r29-profile-elf.log
            "$C" -std=gnu99 -D_QNX_SOURCE -O2 -Wall -Wextra -Werror -fPIC -Ireview/source/bluetooth -c review/source/bluetooth/bt_iap2_owner_handoff.c -o review/payload/r98-owner-handoff-review.o
            "$R" -h -sW review/payload/r98-owner-handoff-review.o > review/evidence/r98-owner-elf.log
            b=review/source/bluetooth
            "$C" -std=gnu99 -D_QNX_SOURCE -O2 -Wall -Wextra -Werror -fPIC -shared -Wl,--no-undefined -I"$b" "$b"/{native_binding,native_event,inbound,inbound_r5,mu1005_rf_ingress,mu1005_ipc_stream,mu1005_socket_pump,rf_arg_experiment,native_eir_bridge,au102_eir_advertisement,upstream_eir}.c -lsocket -lc -o review/payload/libmu1005_bt_native_review.so
            "$R" -h -dW -sW review/payload/libmu1005_bt_native_review.so > review/evidence/native-bt-elf.log
            ap=review/source/ap-live
            "$C" -std=gnu99 -D_QNX_SOURCE -O2 -Wall -Wextra -Werror -fPIC -shared -Wl,--no-undefined "$ap"/{ap_live,qnx_process,cp_csm}.c -lc -o review/payload/libmu1005_ap_live_review.so
            "$R" -h -dW -sW review/payload/libmu1005_ap_live_review.so > review/evidence/ap-live-elf.log
            sh review/source/r29-full/build_qnx_review.sh
            cp review/source/r29-full/review-output/ipod-transport-R29-NO-INSTALL.so review/payload/
            cp review/source/r29-full/review-output/elf.log review/evidence/r29-full-elf.log
            rm -rf review/source/r29-full/review-output
            b=review/source/bluetooth
            r=review/source/r29-full
            "$C" -std=gnu99 -D_QNX_SOURCE -Wall -Wextra -Werror -O2 -fPIC -shared -Wl,--no-undefined -I"$b" -I"$r" "$b"/{mu1005_rf_ingress,mu1005_ipc_stream,mu1005_socket_pump}.c "$r"/{wcp_oem_graft_io,wcp_graft_frames,wcp_stream_bridge}.c -lsocket -lc -o review/payload/libmu1005_rf_r29_review.so
            "$R" -h -dW -sW review/payload/libmu1005_rf_r29_review.so > review/evidence/r29-r45-elf.log
            tcp=review/source/si/r29_tcp
            "$C" -std=gnu99 -D_QNX_SOURCE -Wall -Wextra -Werror -O2 -fPIC -shared -Wl,--no-undefined -I"$b" -I"$r" -I"$tcp" "$b"/{mu1005_rf_ingress,mu1005_ipc_stream,mu1005_socket_pump}.c "$r"/{wcp_oem_graft_io,wcp_graft_frames,wcp_stream_bridge}.c "$tcp/tcp_adopt.c" -lsocket -lc -o review/payload/libmu1005_rf_r29_tcp_review.so
            "$R" -h -dW -sW review/payload/libmu1005_rf_r29_tcp_review.so > review/evidence/r29-tcp-elf.log
          ' 2>&1 | tee review/evidence/native-build.log
          for sym in mu_bt_native_append_eir mu_bt_native_discovery_ready ir5_discovery_ready; do
            awk -v name="$sym" '$7!="UND" && $8==name {found=1} END {exit !found}' review/evidence/native-bt-elf.log
          done
          grep -Eq 'Machine:.*ARM' review/evidence/native-elf.log
          grep -Eq 'Type:.*DYN' review/evidence/native-elf.log
          grep -Eq 'Machine:.*ARM' review/evidence/signer-elf.log
          grep -Eq 'Type:.*REL' review/evidence/signer-elf.log
          grep -Eq 'Machine:.*ARM' review/evidence/r29-profile-elf.log
          grep -Eq 'Type:.*REL' review/evidence/r29-profile-elf.log
          for sym in wcp_bt_link_profile_default wcp_bt_type_candidate; do
            awk -v name="$sym" '$7!="UND" && $8==name {found=1} END {exit !found}' review/evidence/r29-profile-elf.log
          done
          echo R29_NATIVE_TYPE3_PROFILE_COMPILED_NOT_FULL_PLUGIN | tee review/evidence/r29-result.txt
          grep -Eq 'Machine:.*ARM' review/evidence/r98-owner-elf.log
          grep -Eq 'Type:.*REL' review/evidence/r98-owner-elf.log
          for sym in au98_publish au98_tick au98_withdraw au98_bind_stock_native; do
            awk -v name="$sym" '$7!="UND" && $8==name {found=1} END {exit !found}' review/evidence/r98-owner-elf.log
          done
          echo R98_OWNER_HANDOFF_NATIVE_OBJECT_ONLY_NO_OEM_ATTACH | tee review/evidence/r98-result.txt
          grep -Eq 'Machine:.*ARM' review/evidence/ap-live-elf.log
          grep -Eq 'Type:.*DYN' review/evidence/ap-live-elf.log
          for sym in mu_ap_live_read mu_ap_live_session mu_ap_live_clear mhi2q_qnx_capture; do
            awk -v name="$sym" '$7!="UND" && $8==name {found=1} END {exit !found}' review/evidence/ap-live-elf.log
          done
          echo OEM_AP_READ_AND_CSM_ENCODER_LINKED_NOT_EXECUTED_ON_QNX | tee review/evidence/ap-live-result.txt
          grep -Eq 'Machine:.*ARM' review/evidence/r29-full-elf.log
          grep -Eq 'Type:.*DYN' review/evidence/r29-full-elf.log
          for sym in ipod_module wcp_lab_supply_fd wcp_oem_graft_pump wcp_graft_feed; do
            awk -v name="$sym" '$7!="UND" && $8==name {found=1} END {exit !found}' review/evidence/r29-full-elf.log
          done
          echo R29_FULL_PLUGIN_ARM_LINK_ONLY_INERT_NO_OEM_ATTACH | tee review/evidence/r29-full-result.txt
          grep -Eq 'Machine:.*ARM' review/evidence/r29-r45-elf.log
          grep -Eq 'Type:.*DYN' review/evidence/r29-r45-elf.log
          for sym in au_rf_connected au_ipc_pump au_socket_step wcp_oem_graft_adopt wcp_oem_graft_pump; do
            awk -v name="$sym" '$7!="UND" && $8==name {found=1} END {exit !found}' review/evidence/r29-r45-elf.log
          done
          echo R29_R45_JOINT_ARM_LINK_NO_OEM_OWNER | tee review/evidence/r29-r45-result.txt
          grep -Eq 'Machine:.*ARM' review/evidence/r29-tcp-elf.log
          grep -Eq 'Type:.*DYN' review/evidence/r29-tcp-elf.log
          awk '$7!="UND" && $8=="wcp_r29_tcp_adopt" {found=1} END {exit !found}' review/evidence/r29-tcp-elf.log
          echo R29_TCP_ARM_LINK_ONLY_EXTERNAL_PEER_PROOF_REQUIRED | tee review/evidence/r29-tcp-result.txt
          for sym in MFiPlatform_CreateSignature MFiPlatform_CopyCertificate; do
            awk -v name="$sym" '$7!="UND" && $8==name {found=1} END {exit !found}' review/evidence/signer-elf.log
          done
          echo UPSTREAM_STOCK_MFI_ADAPTER_COMPILED_NOT_EXECUTED | tee review/evidence/signer-result.txt
          grep -Eq 'NEEDED.*libc\.so' review/evidence/native-elf.log
          grep -Eq 'NEEDED.*libsocket\.so' review/evidence/native-elf.log
          for sym in mu_si_cprx_init mu_si_cprx_tick mu_si_cprx_cleanup mu_owner_tick mu_cprx_client_begin_remote mu_cprx_client_tick; do
            awk -v name="$sym" '$7!="UND" && $8==name {found=1} END {exit !found}' review/evidence/native-elf.log
          done
          printf '%s\n' "source=$(git rev-parse HEAD)" "receiver=7f595231394d97091ec0fee209677b6e45fd50dc" "toolchain=baa45224f18ae6b13c2e9c77c6663bb8181eb6a1" > review/evidence/revisions.txt
          printf '%s\n' 'NO INSTALL: native cross-compiled review library only' 'Original owner attachment, MFi authentication, real Wi-Fi and physical media not verified.' 'No firmware or installation instructions.' > review/README.txt
          echo QNX_ARM_SI_CPRX_LINK_AND_EXPORT_CHECK_OK_NO_OEM_NO_INSTALL | tee review/evidence/result.txt
          (cd review && find source payload evidence -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: si-cprx-native-build-evidence
          path: review/evidence
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mu1005-si-cprx-arm-NO-INSTALL
          path: review/
          retention-days: 30
          if-no-files-found: error

  parallel-host:
    strategy:
      fail-fast: false
      matrix:
        lane: [transport, stock-config, authentication, radio, media, recovery]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute existing source tests and new profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lane-evidence
          lane="${{ matrix.lane }}"
          {
            case "$lane" in
              transport)
                bash integration/mu1005_si_native/r29_profile/test.sh
                bash ci/host_r98_iap2_handoff.sh
                bash ci/host_rf_arg_experiment.sh
                cc -std=c99 -Wall -Wextra -Werror -Iproject/source/legacy_mu1005/bluetooth tests/test_r101_scn_contract.c project/source/legacy_mu1005/bluetooth/inbound.c -o /tmp/mu1005-scn-fixture
                /tmp/mu1005-scn-fixture
                bash ci/host_r14_native.sh
                bash ci/host_r102_upstream_reuse.sh
                bash integration/mu1005_si_native/r29_full_source/unpack.sh "${RUNNER_TEMP}/r29-full"
                bash "${RUNNER_TEMP}/r29-full/test.sh"
                bash integration/mu1005_si_native/r29_r45/test.sh "${RUNNER_TEMP}/r29-full"
                bash integration/mu1005_si_native/r29_tcp/test.sh "${RUNNER_TEMP}/r29-full"
                ;;
              stock-config) bash ci/host_r99_stock_iap2.sh ;;
              authentication)
                bash ci/host_step04_stock_mfi.sh
                bash ci/host_step04_session.sh
                bash ci/host_cloud_pipeline.sh
                ;;
              radio) bash ci/host_radio_policy.sh ;;
              media)
                bash ci/host_cloud_media.sh
                inner=integration/mu1005_si_native/inner_iap2
                cc -std=c99 -Wall -Wextra -Werror -O2 "$inner/inner_iap2.c" "$inner/inner_airplay.c" "$inner/test.c" -ldl -o "$RUNNER_TEMP/inner-iap2"
                "$RUNNER_TEMP/inner-iap2"
                cc -std=c99 -Wall -Wextra -Werror -O2 -rdynamic "$inner/inner_iap2.c" "$inner/inner_airplay.c" "$inner/test_airplay.c" -ldl -o "$RUNNER_TEMP/inner-airplay"
                "$RUNNER_TEMP/inner-airplay"
                cc -std=c99 -Wall -Wextra -Werror -O2 "$inner/inner_iap2.c" "$inner/inner_socket.c" "$inner/test_socket.c" -o "$RUNNER_TEMP/inner-socket"
                "$RUNNER_TEMP/inner-socket"
                cc -std=c99 -Wall -Wextra -Werror -O2 "$inner/inner_iap2.c" "$inner/inner_socket.c" "$inner/mm_peer.c" "$inner/test_mm_peer.c" -o "$RUNNER_TEMP/inner-mm-peer"
                "$RUNNER_TEMP/inner-mm-peer"
                cc -std=c99 -Wall -Wextra -Werror -O2 -DMU_MM_NOTIFY_HOST_TEST -rdynamic "$inner/mm_notify.c" "$inner/test_mm_notify.c" -ldl -o "$RUNNER_TEMP/inner-mm-notify"
                "$RUNNER_TEMP/inner-mm-notify"
                ;;
              recovery) bash ci/host_sd_txn.sh ;;
              *) exit 2 ;;
            esac
            echo "HOST_LANE_PASS:$lane:NO_INSTALL"
          } 2>&1 | tee "lane-evidence/$lane.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-lane-${{ matrix.lane }}
          path: lane-evidence/
          retention-days: 14
  upstream-graft:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned earlier source port and upstream
        run: |
          set -euxo pipefail
          mkdir -p graft-evidence
          git fetch --depth 1 origin c99d9a357672e55cbbeacf7aaeffbe85140392d4
          test "$(git rev-parse FETCH_HEAD)" = c99d9a357672e55cbbeacf7aaeffbe85140392d4
          git show FETCH_HEAD:integration/mu1005_full_graft/port.py > graft-evidence/port.py
          git init upstream
          git -C upstream remote add origin https://github.com/luka-dev/mib2q-carplay-rgi.git
          git -C upstream fetch --depth 1 origin 20c94f51c0f0ae88b154c12e4f604643ba23022c
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = 20c94f51c0f0ae88b154c12e4f604643ba23022c
          python3 graft-evidence/port.py upstream adapted | tee graft-evidence/port.log
      - name: Link existing source port without OEM attachment
        run: |
          set -euxo pipefail
          for f in graft eir deny; do
            clang -target armv7-none-eabi -march=armv7-a -marm -O2 -ffreestanding -fno-builtin -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-stack-protector -fno-pic -DAU57X_LINK_REVIEW_ONLY -c "adapted/$f.c" -o "adapted/$f.o"
          done
          if ! command -v ld.lld >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq lld
          fi
          ld.lld --version | tee graft-evidence/linker-version.txt
          ld.lld -flavor gnu -m armelf -T adapted/graft.ld --no-undefined adapted/{graft,eir,deny}.o -o adapted/review.elf
          readelf -h -SW -sW -rW adapted/review.elf | tee graft-evidence/elf.log
          grep -Eq 'Machine:.*ARM' graft-evidence/elf.log
          grep -q 'There are no relocations' graft-evidence/elf.log
          grep -q au57x_review_owner graft-evidence/elf.log
          echo UPSTREAM_GRAFT_LINKED_DENY_ONLY_NO_OEM | tee graft-evidence/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-upstream-graft-evidence
          path: graft-evidence/
          retention-days: 14
  collect-review:
    if: always()
    needs: [native-library, parallel-host, upstream-graft]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: unified-*
          path: combined/lanes
      - uses: actions/download-artifact@v4
        if: needs.native-library.result == 'success'
        with:
          name: mu1005-si-cprx-arm-NO-INSTALL
          path: combined/native
      - uses: actions/download-artifact@v4
        if: needs.native-library.result != 'success'
        with:
          name: si-cprx-native-build-evidence
          path: combined/native-failure
      - name: Record results without claiming vehicle readiness
        if: always()
        run: |
          mkdir -p combined
          printf '%s\n' 'NO INSTALL — no OEM execution or vehicle verification' 'native-library=${{ needs.native-library.result }}' 'parallel-host=${{ needs.parallel-host.result }}' 'upstream-graft=${{ needs.upstream-graft.result }}' "revision=$GITHUB_SHA" > combined/STATUS.txt
          cat combined/STATUS.txt >> "$GITHUB_STEP_SUMMARY"
          (cd combined && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MU1005-unified-review-NO-INSTALL
          path: combined/
          retention-days: 30
