name: AU57x R113-R116 QNX6.5 ARM review (NO INSTALL)
on:
  push:
    branches: [r113-r116-cloud-review]
    paths:
      - '.github/workflows/r113-r116-review.yml'
      - 'r113/**'
      - 'project/source/legacy_mu1005/bluetooth/inbound.c'
      - 'project/source/legacy_mu1005/bluetooth/inbound.h'
      - 'docs/R113_R116_CLOUD_REVIEW_CN.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qnx-owner-bridge-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - name: Source provenance and non-installable guard
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/R113_R116_CLOUD_REVIEW_CN.md
          test "$(find project/source -type f -name '*.c' | wc -l)" = 34
          ! find . -name '*.img' -o -name '*.key' -o -name '*.pem' | grep -q .
          echo "NO_INSTALL: host + QNX ABI verification only, no car payload"
      - name: Host core regression + sanitizers
        shell: bash
        run: bash tests/run_bt_host.sh
      - name: MU1005 native inbound_publish SCN 1..30 regression
        run: |
          set -Eeuo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iproject/source/legacy_mu1005/bluetooth \
            project/source/legacy_mu1005/bluetooth/inbound.c \
            tests/test_mu1005_rf_scn_extended.c -o /tmp/au57x-mu-scn
          /tmp/au57x-mu-scn
      - name: R113 native publication guard HOST tests
        run: |
          set -Eeuo pipefail
          cc -std=c99 -O2 -Wall -Wextra -Werror -Ir113/src -Ir113/third_party \
            r113/src/au108_oem_port.c r113/third_party/r105_owner_gate.c \
            r113/tests/test_owner.c -o /tmp/r113-owner-test
          /tmp/r113-owner-test
      - name: Native MU1005 inbound -> R113 owner integration test
        shell: bash
        run: |
          set -Eeuo pipefail
          cc -std=c11 -Wall -Wextra -Werror -pedantic -O2 \
            -Iproject/source/legacy_mu1005/bluetooth -Ir113/src -Ir113/third_party \
            project/source/legacy_mu1005/bluetooth/inbound.c \
            r113/src/mu1005_native_gate_adapter.c \
            r113/src/au108_oem_port.c r113/third_party/r105_owner_gate.c \
            r113/tests/test_native_join.c -o /tmp/mu1005-native-join
          /tmp/mu1005-native-join
      - name: Build pinned QNX 6.5 ARMv7 compiler image
        shell: bash
        run: |
          set -Eeuo pipefail
          git init -q /tmp/qnx65
          git -C /tmp/qnx65 remote add origin https://github.com/luka-dev/qnx65-armv7-toolchain.git
          git -C /tmp/qnx65 fetch -q --depth=1 origin baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          git -C /tmp/qnx65 checkout -q FETCH_HEAD
          docker build --platform linux/amd64 --target base-env --build-arg BASE=base-8.5 -t au57x-r114-qnx65:8.5 /tmp/qnx65
      - name: Cross compile and link original public MU1005 bridge (QNX)
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --platform linux/amd64 -v "$GITHUB_WORKSPACE":/src -w /src au57x-r114-qnx65:8.5 bash /src/ci/compile_qnx_in_image.sh
      - name: R113 owner publication source TARGET QNX ARM link
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --platform linux/amd64 -v "$GITHUB_WORKSPACE":/src -w /src au57x-r114-qnx65:8.5 bash -c '
            set -Eeuo pipefail
            CC=/opt/qnx650/host/linux/x86/usr/bin/arm-unknown-nto-qnx6.5.0eabi-gcc
            RE=/opt/qnx650/host/linux/x86/usr/bin/arm-unknown-nto-qnx6.5.0eabi-readelf
            mkdir -p qnx_build_result/r113
            CFLAGS="-std=c99 -O2 -Wall -Wextra -Werror -fPIC -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=softfp -Ir113/src -Ir113/third_party"
            $CC $CFLAGS -c r113/src/au108_oem_port.c -o qnx_build_result/r113/au108_oem_port.o
            $CC $CFLAGS -Iproject/source/legacy_mu1005/bluetooth -c r113/src/mu1005_native_gate_adapter.c -o qnx_build_result/r113/mu1005_native_gate_adapter.o
            $CC $CFLAGS -c r113/third_party/r105_owner_gate.c -o qnx_build_result/r113/r105_owner_gate.o
            $CC -shared -Wl,--hash-style=sysv -o qnx_build_result/r113/libau57x_r113_REVIEW_ONLY.so qnx_build_result/r113/au108_oem_port.o qnx_build_result/r113/mu1005_native_gate_adapter.o qnx_build_result/r113/r105_owner_gate.o qnx_build_result/objects/inbound.o -Wl,--no-as-needed -lc -Wl,--as-needed
            $RE -h -d qnx_build_result/r113/libau57x_r113_REVIEW_ONLY.so > qnx_build_result/r113/readelf.txt
            grep -q "Shared library: \\[libc.so.3\\]" qnx_build_result/r113/readelf.txt
            echo "R113 QNX ARM owner boundary linked -- NO OEM callbacks, NOT installable"
          '
          sudo chown -R "$(id -u):$(id -g)" qnx_build_result
          python3 r113/../project/tools/qnx_elf_gate.py --candidate qnx_build_result/r113/libau57x_r113_REVIEW_ONLY.so --output qnx_build_result/r113/elf_gate.json
      - name: Check target ELF headers, dependencies and QEMU smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo chown -R "$(id -u):$(id -g)" qnx_build_result
          python3 project/tools/qnx_elf_gate.py --candidate qnx_build_result/libau57x_r24_native_qnx_REVIEW_ONLY.so --output qnx_build_result/logs/r114_qnx_elf_gate.json
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm
          # Match the existing smoke script's upstream path and image alias.
          # This is a CI harness repair, not proof of actual Bluetooth/MFi.
          ln -s /tmp/qnx65 /tmp/qnx65-toolchain
          docker tag au57x-r114-qnx65:8.5 au57x-qnx65-cc:8.5
          bash ci/qnx_runtime_smoke.sh
      - name: Preserve compiler and smoke logs on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AU57x-R114-QNX65-REVIEW_ONLY
          path: qnx_build_result/
          if-no-files-found: warn
          retention-days: 10
