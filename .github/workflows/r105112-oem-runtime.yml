name: R105.112 real OEM library runtime and process boundary (NO INSTALL)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  first-link-qnx:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        route: [separate-owner]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download previously verified exact ARM payload
        uses: actions/download-artifact@v4
        with:
          name: mu1005-si-cprx-arm-NO-INSTALL
          run-id: 45546789122
          github-token: ${{ github.token }}
          path: previous-native
      - name: Verify locked artifact and fixture source
        run: |
          set -euxo pipefail
          mkdir -p qnx-runtime-evidence
          grep -Fx 'source=082340439793b5c4aaf4b90d20b48e9a4318535c' previous-native/evidence/revisions.txt
          (cd previous-native && sha256sum -c SHA256SUMS) > qnx-runtime-evidence/checksums.log
          sha256sum previous-native/payload/libmu1005_inner_iap2_review.so | tee qnx-runtime-evidence/library.sha256
          for f in mm_peer.h inner_socket.h inner_iap2.h test_mm_peer.c; do
            cmp "previous-native/source/si/inner_iap2/$f" "integration/mu1005_si_native/inner_iap2/$f"
          done
      - name: Fetch locked public QNX boot environment and QEMU
        run: |
          set -euxo pipefail
          git init toolchain
          git -C toolchain remote add origin https://github.com/luka-dev/qnx65-armv7-toolchain.git
          git -C toolchain fetch --depth 1 origin baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          git -C toolchain checkout --detach FETCH_HEAD
          test "$(git -C toolchain rev-parse HEAD)" = baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          for f in startup-virt libstartup.a devc-serdebug u-boot.bin; do test -s "toolchain/tests/qemu/$f"; done
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm
          qemu-system-arm --version | tee qnx-runtime-evidence/qemu-version.log
          sha256sum toolchain/tests/qemu/{startup-virt,libstartup.a,devc-serdebug,u-boot.bin} toolchain/tests/qemu-run.sh | tee qnx-runtime-evidence/boot-inputs.sha256
      - uses: ./.github/actions/mu1005-qnx-image
        with:
          require-cache: 'true'
      - name: Build isolated QNX test provider
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src qnx65-armv7-toolchain:8.5 bash -c '
            arm-unknown-nto-qnx6.5.0eabi-gcc -std=gnu99 -D_QNX_SOURCE -fPIC -shared -Wl,--no-undefined -Wall -Wextra lab/mu1005_qnx_runtime/lab_fixture_provider.c -lc -o qnx-runtime-evidence/libmu_lab_fixture.so
            arm-unknown-nto-qnx6.5.0eabi-readelf -sW qnx-runtime-evidence/libmu_lab_fixture.so
          ' | tee qnx-runtime-evidence/fixture-exports.log
          python3 lab/mu1005_qnx_runtime/prepare_fixture_ifs.py toolchain/tests/qemu-run.sh
          echo "QNX_LAB_FIXTURE=$PWD/qnx-runtime-evidence/libmu_lab_fixture.so" >> "$GITHUB_ENV"
      - name: Execute selected QNX ARM route
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src qnx65-armv7-toolchain:8.5 bash -c '
            set -eux
            c=project/source/src
            a=project/source/legacy_mu1005/airplay
            b=project/source/legacy_mu1005/bluetooth
            extra=""
            case "${{ matrix.route }}" in
              separate-owner) extra="-DMU1005_QNX_SEPARATE_OWNER_FIXTURE" ;;
              wired-restore) extra="-DMU1005_QNX_WIRED_RESTORE_FIXTURE" ;;
              *) exit 2 ;;
            esac
              arm-unknown-nto-qnx6.5.0eabi-gcc -std=gnu99 -D_QNX_SOURCE -Wall -Wextra -Werror -Wno-unused-function -O2 -DMU1005_QNX_FIRST_LINK_FIXTURE $extra -Wl,-E -I"$c" -I"$a" -I"$b" tests/test_cloud_pipeline.c "$c"/{cp_cloud_pipeline,cp_wcp_autoconnect,cp_wcp_handoff,cp_radio_policy,cp_session_handoff,cp_step04_session,cp_step04_link,cp_step04_iap2_auth,cp_step04_stock_mfi,cp_oem_boundary,cp_wireless,cp_event,cp_csm}.c "$a"/{mu1005_r34_ap_server,native_exports,cprx_service,semantic}.c "$b/mu1005_rf_ingress.c" -lsocket -lc -o qnx-runtime-evidence/mu1005-first-link
            arm-unknown-nto-qnx6.5.0eabi-readelf -h -dW qnx-runtime-evidence/mu1005-first-link
          ' 2>&1 | tee qnx-runtime-evidence/first-link-build.log
          python3 lab/mu1005_qnx_runtime/prepare_inner_ifs.py toolchain/tests/qemu-run.sh
          python3 lab/mu1005_qnx_runtime/prepare_first_link_flash.py toolchain/tests/qemu-run.sh
          export QNX_TEST_INNER_LIB="$PWD/previous-native/payload/libmu1005_inner_iap2_review.so"
          QEMU_KEEP_LOG="$PWD/qnx-runtime-evidence/first-link-serial.log" QEMU_TIMEOUT=120 QEMU_RUN_SECS=75 sh toolchain/tests/qemu-run.sh "$PWD/qnx-runtime-evidence/mu1005-first-link" 8.5 2>&1 | tee qnx-runtime-evidence/first-link-runtime.log
          case "${{ matrix.route }}" in
            separate-owner) grep -F 'MU1005_QNX_SEPARATE_OWNER_PASS_FIXTURE_ONLY' qnx-runtime-evidence/first-link-runtime.log ;;
            wired-restore) grep -F 'MU1005_QNX_WIRED_RESTORE_PASS_FIXTURE_ONLY' qnx-runtime-evidence/first-link-runtime.log ;;
          esac
          grep -E 'Process [0-9]+ \(mu1005-first-link\) exited status=0' qnx-runtime-evidence/first-link-serial.log
          printf '%s\n' 'QNX_ROUTE=${{ matrix.route }}; OEM callbacks/radio/MFi/video are fixtures; no phone or display' > qnx-runtime-evidence/first-link-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r105112-${{ matrix.route }}-NO-INSTALL
          path: qnx-runtime-evidence/
          retention-days: 30
  host-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/host_cloud_pipeline.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r105112-host-regression-NO-INSTALL
          path: cloud12_result/cloud_pipeline.log
  oem-library-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: "45923122041"
    steps:
      - uses: actions/checkout@v4
      - name: Obtain retained archive from existing NAS task (no second NAS request)
        run: |
          set -euo pipefail
          mkdir -p firmware evidence
          # A push that updates both workflows uses its own acquisition run.
          # Never consume the known failed 20-minute run or duplicate a NAS request.
          if [ -z "$SOURCE_RUN" ]; then
            for i in $(seq 1 40); do
              SOURCE_RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mu1005-oem-nas.yml --branch mu1005-si-cprx-real-review --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              if [ -n "$SOURCE_RUN" ]; then break; fi
              sleep 15
            done
          fi
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          echo "NAS_SOURCE_RUN:$SOURCE_RUN"
          for i in $(seq 1 380); do
            result=$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '.status + ":" + .conclusion')
            if [ "$result" = "completed:success" ]; then break; fi
            if [[ "$result" == completed:* ]]; then echo "NAS_SOURCE_NOT_SUCCESS:$result"; exit 2; fi
            sleep 15
          done
          test "$result" = "completed:success"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name mu1005-nas-firmware-archive --dir firmware
          echo "6946216d1f87f073aefc873a4252b9b952d261e3b9fd2fedf403d26ea2f2db94  firmware/MHI2_CN_AU57x_K1006_2_MU1005_4M0906961EJ.7z" | sha256sum -c -
      - name: Fetch exact upstream MHI2 extractor and QNX6 reader
        run: |
          set -euxo pipefail
          git init extractor
          git -C extractor remote add origin https://github.com/harman-f/MHI2-MHI2Q-MH2P-Firmware-Toolkit.git
          git -C extractor fetch --depth 1 origin 64a44fe23dbaa08771440d69642d2874d7028295
          git -C extractor checkout --detach FETCH_HEAD
          test "$(git -C extractor rev-parse HEAD)" = 64a44fe23dbaa08771440d69642d2874d7028295
          git init qnxmount
          git -C qnxmount remote add origin https://github.com/NetherlandsForensicInstitute/qnxmount.git
          git -C qnxmount fetch --depth 1 origin 0379c064975d5bbe3595ac7e3d149ea789406794
          git -C qnxmount checkout --detach FETCH_HEAD
          test "$(git -C qnxmount rev-parse HEAD)" = 0379c064975d5bbe3595ac7e3d149ea789406794
          python3 -m venv /tmp/mu1005-extract-venv
          /tmp/mu1005-extract-venv/bin/pip install kaitaistruct==0.11 crcmod==1.7
          command -v 7z || { sudo apt-get update -qq && sudo apt-get install -y p7zip-full; }
      - name: Extract exact app70 into a private original-only tree
        run: |
          set -euo pipefail
          archive="$PWD/firmware/MHI2_CN_AU57x_K1006_2_MU1005_4M0906961EJ.7z"
          mkdir -p "${RUNNER_TEMP}/combined"
          python3 tools/mu1005_extract_app70.py "$archive" "${RUNNER_TEMP}/app70/app.img"
          /tmp/mu1005-extract-venv/bin/python extractor/tools/extract_firmware.py --source "${RUNNER_TEMP}/app70/app.img" --output "${RUNNER_TEMP}/combined/app70" --variant 70 --qnxmount-root "$PWD/qnxmount" > evidence/app-summary.json
      - name: Stage only three exact OEM libraries in private runner storage
        run: |
          mkdir -p qnx-runtime-evidence
          python3 lab/mu1005_oem_runtime/stage.py "${RUNNER_TEMP}/combined" "$PWD/oem-runtime-private"
      - name: Fetch locked public QNX boot environment and QEMU
        run: |
          set -euxo pipefail
          git init toolchain
          git -C toolchain remote add origin https://github.com/luka-dev/qnx65-armv7-toolchain.git
          git -C toolchain fetch --depth 1 origin baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          git -C toolchain checkout --detach FETCH_HEAD
          test "$(git -C toolchain rev-parse HEAD)" = baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          for f in startup-virt libstartup.a devc-serdebug u-boot.bin; do test -s "toolchain/tests/qemu/$f"; done
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm
          qemu-system-arm --version | tee qnx-runtime-evidence/qemu-version.log
          sha256sum toolchain/tests/qemu/{startup-virt,libstartup.a,devc-serdebug,u-boot.bin} toolchain/tests/qemu-run.sh | tee qnx-runtime-evidence/boot-inputs.sha256
      - uses: ./.github/actions/mu1005-qnx-image
        with:
          require-cache: 'true'
      - name: Build actual OEM library loader adapter
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src qnx65-armv7-toolchain:8.5 bash -c '
            arm-unknown-nto-qnx6.5.0eabi-gcc -std=gnu99 -D_QNX_SOURCE -Wall -Wextra -Werror -O2 lab/mu1005_oem_runtime/loader.c -lc -o qnx-runtime-evidence/mu1005-oem-loader
          '
          python3 lab/mu1005_oem_runtime/prepare_ifs.py toolchain/tests/qemu-run.sh
      - name: Run exact original iAP2 and Bonjour libraries on QNX
        run: |
          set -euxo pipefail
          export QNX_OEM_PRIVATE="$PWD/oem-runtime-private"
          QEMU_KEEP_LOG="$PWD/qnx-runtime-evidence/original-serial.log" QEMU_TIMEOUT=120 QEMU_RUN_SECS=75 sh toolchain/tests/qemu-run.sh "$PWD/qnx-runtime-evidence/mu1005-oem-loader" 8.5 2>&1 | tee qnx-runtime-evidence/original-runtime.log
          grep -F 'OEM_RUNTIME_IAP2_PASS' qnx-runtime-evidence/original-runtime.log
          grep -F 'OEM_RUNTIME_BONJOUR_PASS' qnx-runtime-evidence/original-runtime.log
          grep -E 'Process [0-9]+ \(mu1005-oem-loader\) exited status=0' qnx-runtime-evidence/original-serial.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r105112-original-runtime-evidence-NO-INSTALL
          path: |
            qnx-runtime-evidence/*.log
            qnx-runtime-evidence/*.sha256
            evidence/app-summary.json
          retention-days: 30
