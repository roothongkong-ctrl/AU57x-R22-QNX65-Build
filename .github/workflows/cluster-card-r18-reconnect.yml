name: 'R18 card reconnect and stock player regression (SOURCE ONLY)'
on:
  workflow_dispatch:
  push:
    branches: [experiment/cluster-card-r18-reconnect-guard]
    paths:
      - 'experiments/cluster-compact-card/r17/**'
      - '.github/workflows/cluster-card-r18-reconnect.yml'
permissions:
  contents: read
jobs:
  player:
    name: ${{ matrix.compiler }} / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        compiler: [g++, clang++]
        variant: [stock-off, experimental-source, actual-sidecar]
    steps:
      - uses: actions/checkout@v4
      - name: Install upstream host compile dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev pkg-config \
            ffmpeg libglfw3-dev libgles2-mesa-dev
      - name: Checkout REAL v1.2.14 player and strictly integrate R17
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch v1.2.14 https://github.com/MacsInSpace/mib-cluster-map.git /tmp/mib-r17
          mkdir -p /tmp/mib-r17/player/r17/{r9,r12,r14}
          cp experiments/cluster-compact-card/r9/compact_card_r9.h /tmp/mib-r17/player/r17/r9/
          cp experiments/cluster-compact-card/r12/dual_stream_joiner.h /tmp/mib-r17/player/r17/r12/
          cp experiments/cluster-compact-card/r14/card112_ffmpeg_decoder.h /tmp/mib-r17/player/r17/r14/
          cp experiments/cluster-compact-card/r17/r17_card_sidecar.h /tmp/mib-r17/player/r17/
          python3 experiments/cluster-compact-card/r17/patch_real_player.py /tmp/mib-r17/player/opengl_gpu.cc
          git -C /tmp/mib-r17 diff --check
          test "$(git -C /tmp/mib-r17 diff --name-only)" = 'player/opengl_gpu.cc'
      - name: Compile real player or test real H264 over card socket
        env:
          CXX: ${{ matrix.compiler }}
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          set -euo pipefail
          PL=/tmp/mib-r17/player
          FLAGS="-std=c++11 -pthread -O1 -g -Wall -Wextra"
          PKG="$(pkg-config --cflags libavcodec libavformat libavutil glfw3 glesv2)"
          if [ "$VARIANT" = stock-off ];then
            "$CXX" $FLAGS $PKG -fsyntax-only "$PL/opengl_gpu.cc"
            echo 'PASS: actual upstream player default build, experimental source NOT compiled'
          elif [ "$VARIANT" = experimental-source ];then
            "$CXX" $FLAGS $PKG -DCLUSTERMAP_R17_CARD70_LAB \
              -fsyntax-only "$PL/opengl_gpu.cc"
            grep -Fq 'compose_111(buf->pixels,w,h,now_us())' "$PL/opengl_gpu.cc"
            grep -Fq 'g_r17_card.stop()' "$PL/opengl_gpu.cc"
            echo 'PASS: real upstream decoder path + 112 sidecar joins before frame pool publish'
          else
            ffmpeg -loglevel error -y -f lavfi -i 'color=c=white:s=800x298:r=10' \
              -vf 'drawbox=x=182:y=18:w=42:h=32:color=black:t=fill' \
              -frames:v 5 -pix_fmt yuv420p -c:v libx264 -preset ultrafast \
              -x264-params keyint=1:scenecut=0:bframes=0 -f h264 /tmp/r17-card.h264
            "$CXX" $FLAGS -Werror -pedantic -I"$PL/r17" $PKG \
              experiments/cluster-compact-card/r17/test_player_sidecar.cpp \
              $(pkg-config --libs libavcodec libavutil) -o /tmp/r17-sidecar
            /tmp/r17-sidecar /tmp/r17-card.h264
            echo 'PASS: two H264 sessions with disconnection fallback and pixel-exact map'
          fi
