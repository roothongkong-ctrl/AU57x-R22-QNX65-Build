name: MU1005 OEM firmware acquisition (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/mu1005-oem-acquire.yml, oem_inputs/mu1005/inspect_firmware.py, oem_inputs/mu1005/download_mirror.py]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mu1005-oem-acquire
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore previously validated archive
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .oem-cache/MHI2_CN_AU57x_K1006_2_MU1005_4M0906961EJ.7z
          key: mu1005-oem-archive-v2
      - name: Install browser for the public mirror download
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv /tmp/mu1005-download-venv
          /tmp/mu1005-download-venv/bin/pip install playwright==1.51.0
          /tmp/mu1005-download-venv/bin/python -m playwright install chromium
      - name: Fetch exact named file using MIB Vault public download
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .oem-cache oem-acquisition-evidence
          archive=.oem-cache/MHI2_CN_AU57x_K1006_2_MU1005_4M0906961EJ.7z
          timeout 1200 /tmp/mu1005-download-venv/bin/python oem_inputs/mu1005/download_mirror.py "$archive.part" | tee oem-acquisition-evidence/download.log
          python3 -c 'import sys; f=open(sys.argv[1],"rb"); assert f.read(6)==bytes.fromhex("377abcaf271c"), "OEM_DOWNLOAD_NOT_7Z"' "$archive.part"
          mv "$archive.part" "$archive"
      - name: Verify archive and extract image candidates
        run: |
          set -euo pipefail
          mkdir -p oem-acquisition-evidence
          command -v 7z || { sudo apt-get update -qq && sudo apt-get install -y p7zip-full; }
          python3 oem_inputs/mu1005/inspect_firmware.py .oem-cache/MHI2_CN_AU57x_K1006_2_MU1005_4M0906961EJ.7z "${RUNNER_TEMP}/mu1005-extracted" | tee oem-acquisition-evidence/inspect.log
          cp "${RUNNER_TEMP}/mu1005-extracted/inventory.json" oem-acquisition-evidence/
      - name: Cache only a validated archive
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .oem-cache/MHI2_CN_AU57x_K1006_2_MU1005_4M0906961EJ.7z
          key: mu1005-oem-archive-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mu1005-oem-acquisition-evidence
          path: oem-acquisition-evidence/
          retention-days: 30
