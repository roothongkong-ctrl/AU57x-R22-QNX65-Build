name: R105.236 raw transport QNX ARM runtime (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: ['.github/workflows/r105236-route3-qnx.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  arm-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mu1005-qnx-image
        with:
          require-cache: 'true'
      - name: Reuse pinned QNX boot harness
        run: |
          set -euxo pipefail
          git init toolchain
          git -C toolchain remote add origin https://github.com/luka-dev/qnx65-armv7-toolchain.git
          git -C toolchain fetch --depth 1 origin baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          git -C toolchain checkout --detach FETCH_HEAD
          test "$(git -C toolchain rev-parse HEAD)" = baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm
      - name: Build actual raw data transport and run existing child-process exchange
        run: |
          set -euxo pipefail
          mkdir -p evidence
          s=project/source/src
          l=lab/mu1005_route3_dispatch
          docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src qnx65-armv7-toolchain:8.5 arm-unknown-nto-qnx6.5.0eabi-gcc -std=gnu99 -D_QNX_SOURCE -Wall -Wextra -Werror -O2 -I"$s" -I"$l" "$l"/route3_fd.c "$l"/test_route3_fd.c "$l"/ipc_finish.c "$l"/byte_contract.c "$s"/cp_step2_ipc_link.c "$s"/cp_step2_transport.c "$s"/cp_bt_bridge.c "$s"/cp_bt_stream.c -lsocket -lc -o evidence/mu-route3-fd
          readelf -h evidence/mu-route3-fd | tee evidence/elf.log
          grep -E 'Machine:.*ARM' evidence/elf.log
          python3 lab/mu1005_supervisor_runtime/prepare_net.py toolchain/tests/qemu-run.sh
          QEMU_KEEP_LOG="$PWD/evidence/serial.log" QEMU_TIMEOUT=100 QEMU_RUN_SECS=45 sh toolchain/tests/qemu-run.sh "$PWD/evidence/mu-route3-fd" 8.5 | tee evidence/runtime.log
          grep -F REAL_FD_RAW_TRANSPORT_ACK_RX_LOSS_PASS_NO_OEM evidence/runtime.log
          grep -E 'Process [0-9]+ \(mu-route3-fd\) exited status=0' evidence/serial.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R105236-QNX-raw-transport-NO-INSTALL
          path: evidence/*.log
