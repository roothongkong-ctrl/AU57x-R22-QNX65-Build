name: R105.248 full donor ARM with automatic original AP slot (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105230-donor-ie-arm.yml, lab/mu1005_donor_ie/adapt.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  DONOR: 20c94f51c0f0ae88b154c12e4f604643ba23022c
  TOOLCHAIN: baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
jobs:
  qnx-arm-daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fetch locked daemon and Rust-capable QNX compiler
        run: |
          set -euxo pipefail
          mkdir -p donor-arm-evidence
          git init donor
          git -C donor remote add origin https://github.com/luka-dev/mib2q-carplay-rgi.git
          git -C donor fetch --depth 1 origin "$DONOR"
          git -C donor checkout --detach FETCH_HEAD
          test "$(git -C donor rev-parse HEAD)" = "$DONOR"
          git init toolchain
          git -C toolchain remote add origin https://github.com/luka-dev/qnx65-armv7-toolchain.git
          git -C toolchain fetch --depth 1 origin "$TOOLCHAIN"
          git -C toolchain checkout --detach FETCH_HEAD
          test "$(git -C toolchain rev-parse HEAD)" = "$TOOLCHAIN"
      - uses: ./.github/actions/mu1005-qnx-image
        with:
          require-cache: 'true'
      - name: Restore pinned Rust language runtime cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mu1005-rust/rustup
            ~/.cache/mu1005-rust/cargo
          key: mu1005-rust-nightly-20260721-baa45224-v1
      - name: Prepare Rust on verified existing QNX compiler (no SDK rebuild)
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.cache/mu1005-rust"/{rustup,cargo}
          docker run --rm --platform linux/amd64 --entrypoint /bin/bash \
            -v "$PWD":/src -v "$HOME/.cache/mu1005-rust/rustup":/opt/rustup \
            -v "$HOME/.cache/mu1005-rust/cargo":/opt/cargo \
            -e RUSTUP_HOME=/opt/rustup -e CARGO_HOME=/opt/cargo \
            -w /src qnx65-armv7-toolchain:8.5 -ec '
              export PATH=/opt/cargo/bin:$PATH
              if [ ! -x /opt/cargo/bin/rustup ]; then
                curl -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
              fi
              rustup toolchain install nightly-2026-07-21 --profile minimal --component rust-src
              export PATH=/opt/rustup/toolchains/nightly-2026-07-21-x86_64-unknown-linux-gnu/bin:$PATH
              test "$(arm-unknown-nto-qnx6.5.0eabi-gcc -dumpfullversion)" = 8.5.0
              cd /src/toolchain/rust
              arm-unknown-nto-qnx6.5.0eabi-gcc -c shim/unwind_shim.c -o shim/unwind_shim.o
              arm-unknown-nto-qnx6.5.0eabi-ar rcs shim/libqnxunwind.a shim/unwind_shim.o
              if ! find /opt/cargo/registry/src -maxdepth 2 -name libc-0.2.185 2>/dev/null | grep -q .; then
                seed=$(mktemp -d /tmp/qnx-std-seed.XXXXXX)
                cp -R /src/toolchain/rust/tests/stdhello/. "$seed/"
                cd "$seed"
                RUSTFLAGS="-C linker=/src/toolchain/rust/qnx-cc" cargo build -Z build-std=std,panic_abort -Z build-std-features= -Z json-target-spec --target /src/toolchain/rust/armv7-unknown-nto-qnx650.json --release >/tmp/std-seed.log 2>&1 || tail -n 25 /tmp/std-seed.log
                cd /src/toolchain/rust
                find /opt/cargo/registry/src -maxdepth 2 -name libc-0.2.185 | grep -q libc-0.2.185
              fi
              bash port/apply_std_port.sh
              rustc --version
            '
      - name: Adapt original MU1005 live AP source
        run: |
          set -euxo pipefail
          python3 integration/mu1005_donor_daemon/adapt_live_ap.py donor | tee donor-arm-evidence/ap-port.log
          python3 integration/mu1005_donor_daemon/adapt_receiver_unix.py donor | tee donor-arm-evidence/unix-port.log
          python3 integration/mu1005_donor_daemon/adapt_mfi_sequence.py donor | tee donor-arm-evidence/mfi-port.log
          git -C donor diff -- wireless/daemon > donor-arm-evidence/ap-port.diff
      - name: Add already host-verified ACK and inherited endpoint
        run: |
          set -euxo pipefail
          python3 lab/mu1005_route4_5/adapt_donor_ack.py donor | tee donor-arm-evidence/ack-port.log
          python3 lab/mu1005_route4_5/adapt_inherited_stream.py donor | tee donor-arm-evidence/fd-port.log
          python3 lab/mu1005_live_uap_ip/adapt.py donor
          python3 lab/mu1005_donor_ready/adapt.py donor
          python3 lab/mu1005_donor_exit/adapt.py donor | tee donor-arm-evidence/exit-port.log
          python3 lab/mu1005_donor_ie/adapt.py donor | tee donor-arm-evidence/ie-port.log
          git -C donor diff -- wireless/daemon > donor-arm-evidence/combined-port.diff
      - name: Test live slot selection in the actual donor source
        run: |
          set -euxo pipefail
          cargo test --locked --manifest-path donor/wireless/daemon/Cargo.toml --lib mu1005_ie_tests -- --nocapture | tee donor-arm-evidence/ie-host.log
      - name: Build adapted full QNX daemon (default feature set)
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/amd64 --entrypoint /bin/bash \
            -v "$PWD":/src -v "$HOME/.cache/mu1005-rust/rustup":/opt/rustup \
            -v "$HOME/.cache/mu1005-rust/cargo":/opt/cargo \
            -e RUSTUP_HOME=/opt/rustup -e CARGO_HOME=/opt/cargo \
            -w /src/donor qnx65-armv7-toolchain:8.5 -ec '
              /src/toolchain/rust/qnx-cargo build --locked --manifest-path /src/donor/wireless/daemon/Cargo.toml --bin mhi2q-wireless-daemon
            ' 2>&1 | tee donor-arm-evidence/build.log
          bin=donor/wireless/daemon/target/armv7-unknown-nto-qnx650/release/mhi2q-wireless-daemon
          test -s "$bin"
          readelf -h -dW -AW "$bin" | tee donor-arm-evidence/elf.log
          grep -Eq 'Machine:.*ARM' donor-arm-evidence/elf.log
          grep -Eq 'Class:.*ELF32' donor-arm-evidence/elf.log
          sha256sum "$bin" | tee donor-arm-evidence/daemon.sha256
          # Explicitly non-installable research payload, not named like stock binary.
          cp "$bin" donor-arm-evidence/donor-daemon-MU1005-INHERITED-ACK-NO-INSTALL.bin
          for f in LICENSE LICENSE.md COPYING; do if test -f "donor/$f"; then cp "donor/$f" donor-arm-evidence/; fi; done
          printf '%s\n' 'NO INSTALL: nine source adapters including original AP ownership and inherited cleanup; actual band selection, MU1005 runtime ABI, MFi owner, receiver and hardware not accepted' "donor=$DONOR" "toolchain=$TOOLCHAIN" "source=$GITHUB_SHA" > donor-arm-evidence/STATUS.txt
      - name: Verify inherited endpoint and ACK code are in compiled ARM executable
        run: |
          set -euxo pipefail
          bin=donor-arm-evidence/donor-daemon-MU1005-INHERITED-ACK-NO-INSTALL.bin
          readelf -Ws "$bin" > donor-arm-evidence/symbols.log
          strings "$bin" > /tmp/donor-strings
          grep -F 'MU1005_INHERITED_ACK_STREAM' /tmp/donor-strings
          grep -F 'MU1005_RF_ACK_MODE_ENABLED' /tmp/donor-strings
          grep -F 'unexpected RF completion' /tmp/donor-strings
          grep -F 'MU1005 uap0 IPv4 unavailable or changed' /tmp/donor-strings
          grep -F 'MU1005-READY-v1' /tmp/donor-strings
          grep -F 'MU1005 inherited donor requires supervisor readiness' /tmp/donor-strings
          grep -F 'MU1005 requires original SI control endpoint' /tmp/donor-strings
          grep -F 'MU1005 IE slot not explicitly present exactly once' /tmp/donor-strings
          grep -F 'MU1005 refuses unowned IE removal' /tmp/donor-strings
          grep -F 'MU1005 no explicitly free IE slot' /tmp/donor-strings
          printf '%s\n' 'FULL_ADAPTED_DONOR_ARM_BUILD_ONLY_NO_OEM_NO_RF' | tee donor-arm-evidence/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R105248-full-donor-auto-ie-arm-NO-INSTALL
          path: donor-arm-evidence/
          retention-days: 7
