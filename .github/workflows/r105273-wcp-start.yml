name: R105.273 inherited daemon startup integration (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: ['.github/workflows/r105273-wcp-start.yml','lab/mu1005_route4_5/wcp_start.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mu1005-qnx-image
        with:
          require-cache: 'true'
      - name: Compile and combine actual supervisor and startup coordinator
        run: |
          set -euxo pipefail
          mkdir -p output
          docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src qnx65-armv7-toolchain:8.5 bash -ec '
            C=arm-unknown-nto-qnx6.5.0eabi-gcc
            b=project/source/legacy_mu1005/bluetooth
            l=lab/mu1005_route4_5
            for f in "$l"/{wcp_start,supervised_notify,supervised_startup,daemon_supervisor}.c "$b"/{bt_startup_watch,bt_startup_snapshot,bt_trace_latch}.c; do
              "$C" -std=gnu99 -D_QNX_SOURCE -O2 -Wall -Wextra -Werror -fPIC -I"$b" -I"$l" -c "$f" -o "output/$(basename "$f" .c).o"
            done
            "$C" -nostdlib -r output/*.o -o output/wcp-startup-arm.o
            arm-unknown-nto-qnx6.5.0eabi-nm output/wcp-startup-arm.o > output/symbols.txt
            grep -F " T mu_wcp_start_begin" output/symbols.txt
            grep -F " T mu_wcp_start_poll" output/symbols.txt
            grep -F " T mu_supervised_notify_prepare" output/symbols.txt
          '
          printf '%s\n' 'Integrated startup object only. Original lifecycle/owner provider and final native link still required. NO INSTALL.' > output/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: R105273-wcp-startup-ARM-NO-INSTALL
          path: output/
