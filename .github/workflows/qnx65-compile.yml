name: AU57x R52 QNX6.5 ARMv7 (REVIEW ONLY)
# R103 integration baseline: 45 C source modules; QNX/ELF/QEMU validation remains review-only.
on:
  push:
    branches: [main, r92-native-btstack-preload-owner-probe, r93-original-btstack-preload-proof-and-sd-diag, r94-launcher-preload-reversible-offline, r95-offline-steps-03-to-17, r96-oneclick-lab-and-release-review, r97-stock-thread-origin-handoff, r98-stock-iap2-owner-transport, r99-stock-iap2-two-config-fallback, r100-failclosed-dual-route-graft, r101-rfcomm-scn-and-owner-snapshot, mu1005-wireless-implementation-r103-20261125, mu1005-r103-qnx-iap2-link-20261126]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: au57x-qnx65-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qnx-native-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - name: Checkout public review-only C source
        uses: actions/checkout@v4
      - name: Preflight - source only, no OEM binaries
        shell: bash
        run: |
          set -euo pipefail
          echo 'Filenames included in repository:'
          git ls-files
          if git ls-files | grep -Ei '\.(so|dll|elf|img|bin|7z|spk|key|pem|p12|pfx|o|a|zip)$'; then
            echo 'ERROR: this public repository must not contain proprietary binaries or keys'; exit 3
          fi
          test "$(find project/source -name '*.c' | wc -l)" -eq 45
      - name: Host Bluetooth RF/IPC/socket contract (ASan + UBSan)
        shell: bash
        run: bash tests/run_bt_host.sh
      - name: Create artifact log folder
        run: mkdir -p qnx_build_result/logs
      - name: Clone public toolchain source
        run: git clone --depth=1 https://github.com/luka-dev/qnx65-armv7-toolchain.git /tmp/qnx65-toolchain
      - name: Retry transient checksum-verified GNU GCC/binutils fetch errors
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/r95_toolchain_retry.py /tmp/qnx65-toolchain/Dockerfile
      - name: Build QNX 6.5 ARMv7 GCC container
        shell: bash
        run: |
          set -o pipefail
          docker build --platform linux/amd64 --target base-env --build-arg BASE=base-8.5 \
            -t au57x-qnx65-cc:8.5 /tmp/qnx65-toolchain \
            2>&1 | tee qnx_build_result/logs/toolchain_docker_build.log
      - name: QNX compiler sanity + native compile and shared link
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE":/src -w /src \
            au57x-qnx65-cc:8.5 \
            bash /src/ci/compile_qnx_in_image.sh
      - name: R96 QNX supervised SD transaction lifecycle object (LAB ONLY)
        shell: bash
        run: |
          set -euo pipefail
          test -s qnx_build_result/review_txn/supervisor_fixture_R96_LAB_ONLY.o
          file qnx_build_result/review_txn/supervisor_fixture_R96_LAB_ONLY.o
      - name: R92 QNX native LD_PRELOAD library is produced (no OEM calls)
        shell: bash
        run: |
          set -euo pipefail
          test -s qnx_build_result/libau57x_bt_preload_qnx_REVIEW_ONLY.so
          file qnx_build_result/libau57x_bt_preload_qnx_REVIEW_ONLY.so
          grep -q 'Shared library: \[libc.so.3\]' qnx_build_result/logs/r92_preload_readelf.txt
      - name: R100 original runtime route gate is built and QNX native bridge exported (NO OEM event proof)
        shell: bash
        run: |
          test -s qnx_build_result/objects/bt_route_gate.o
          readelf -Ws qnx_build_result/libau57x_r24_native_qnx_REVIEW_ONLY.so | grep -q au100_route_select
      - name: R101 QNX native inbound RFCOMM SCN/SDP and frozen owner interface compiled (NO OEM registration)
        shell: bash
        run: |
          set -euo pipefail
          test -s qnx_build_result/objects/inbound.o
          test -s qnx_build_result/objects/native_binding.o
          test -s qnx_build_result/objects/bt_iap2_owner_handoff.o
          readelf -Ws qnx_build_result/libau57x_r24_native_qnx_REVIEW_ONLY.so | grep -q inbound_publish
      - name: R98 native QNX original R45 registration bridge exported (NO OEM event proof)
        shell: bash
        run: |
          set -euo pipefail
          test -s qnx_build_result/objects/bt_iap2_owner_handoff.o
          readelf -Ws qnx_build_result/libau57x_r24_native_qnx_REVIEW_ONLY.so | grep -q 'au98_bind_stock_native'
          readelf -Ws qnx_build_result/libau57x_r24_native_qnx_REVIEW_ONLY.so | grep -q 'mu_bt_native_attach'
      - name: Strict QNX ELF gate
        shell: bash
        run: |
          set -o pipefail
          python3 project/tools/qnx_elf_gate.py \
            --candidate qnx_build_result/libau57x_r24_native_qnx_REVIEW_ONLY.so \
            --output qnx_build_result/logs/qnx_elf_gate.json \
            2>&1 | tee qnx_build_result/logs/elf_gate_stdout.log
      - name: QNX6.5 QEMU runtime dlopen smoke (no OEM calls)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm
          bash ci/qnx_runtime_smoke.sh
      - name: Hash output artifacts
        if: always()
        shell: bash
        run: |
          if test -d qnx_build_result; then
            find qnx_build_result -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum \
              > qnx_build_result/SHA256SUMS.txt
          fi
      - name: Upload build result and logs even when failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AU57x-R24-QNX65-review-only
          path: qnx_build_result/
          if-no-files-found: warn
          retention-days: 7

  donor-rust-qnx:
    name: Build pinned upstream iAP2 daemon for QNX ARMv7 (REVIEW ONLY)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout AU57x R103 bridge source and pinned vendor tree
        uses: actions/checkout@v4
        with:
          repository: roothongkong-ctrl/AU57x-R22-QNX65-Build
          ref: mu1005-r103-qnx-iap2-link-20261126
          path: au57x
      - name: Checkout pinned upstream wireless CarPlay source
        uses: actions/checkout@v4
        with:
          repository: luka-dev/mib2q-carplay-rgi
          ref: 20c94f51c0f0ae88b154c12e4f604643ba23022c
          path: donor
      - name: Checkout pinned QNX Rust toolchain
        uses: actions/checkout@v4
        with:
          repository: luka-dev/qnx65-armv7-toolchain
          ref: baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          path: qnx-toolchain
      - name: Build QNX 6.5 Rust toolchain image
        run: |
          docker build --platform=linux/amd64 --target with-rust \
            -t qnx65-armv7-toolchain:8.5-rust qnx-toolchain
      - name: Run exact AU57x R103 upstream iAP2 bridge host tests
        run: |
          docker run --rm --platform=linux/amd64 \
            -v "$GITHUB_WORKSPACE":/src -w /src \
            qnx65-armv7-toolchain:8.5-rust \
            cargo test --offline --manifest-path /src/au57x/integration/r103_iap2_bridge/Cargo.toml

      - name: Cross-build AU57x R103 iAP2 bridge for QNX 6.5 ARMv7
        run: |
          docker run --rm --platform=linux/amd64 \
            -v "$GITHUB_WORKSPACE":/src -w /src \
            qnx65-armv7-toolchain:8.5-rust \
            /opt/rust/qnx-cargo build --manifest-path \
            /src/au57x/integration/r103_iap2_bridge/Cargo.toml --bin au57x-r103-qnx-smoke

      - name: Verify AU57x R103 QNX ARMv7 ELF
        run: |
          set -euo pipefail
          BIN="au57x/target/armv7-unknown-nto-qnx650/release/au57x-r103-qnx-smoke"
          test -s "$BIN"
          file "$BIN" | tee qnx-r103-elf.txt
          file "$BIN" | grep -q "ELF 32-bit.*ARM"
          docker run --rm --platform=linux/amd64 \
            -v "$GITHUB_WORKSPACE":/src -w /src \
            qnx65-armv7-toolchain:8.5-rust \
            sh -c 'arm-unknown-nto-qnx6.5.0eabi-readelf -h /src/'"$BIN"' && arm-unknown-nto-qnx6.5.0eabi-readelf -d /src/'"$BIN"''
          {
            echo "target=armv7-unknown-nto-qnx650"
            echo "source=AU57x R103 bridge + pinned LuKa iap2-link"
            echo "status=QNX_ELF_REVIEW_ONLY"
            echo "qemu_runtime_pending=true"
            echo "installable=false"
            echo "safe_to_flash=false"
            echo "vehicle_verified=false"
          } > qnx-r103-build-info.txt

      - name: Run R103 iAP2 LinkEngine on QNX 6.5 QEMU
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm
          BIN="target/armv7-unknown-nto-qnx650/release/au57x-r103-qnx-smoke"
          QEMU_RUN_SECS=20 QEMU_TIMEOUT=80 \
            bash qnx-toolchain/tests/qemu-run.sh "$BIN" 8.5-rust | tee qnx-r103-qemu.log
          grep -Fq AU57X_R103_QNX_IAP2_LINK_PASS qnx-r103-qemu.log
          sed -i 's/qemu_runtime_pending=true/qemu_runtime_pending=false/' qnx-r103-build-info.txt

      - name: Run upstream daemon host tests
        run: |
          docker run --rm --platform=linux/amd64 \
            -v "$GITHUB_WORKSPACE":/src -w /src \
            qnx65-armv7-toolchain:8.5-rust \
            cargo test --offline --manifest-path /src/donor/wireless/daemon/Cargo.toml
      - name: Cross-build upstream daemon for QNX 6.5 ARMv7
        run: |
          docker run --rm --platform=linux/amd64 \
            -v "$GITHUB_WORKSPACE":/src -w /src \
            qnx65-armv7-toolchain:8.5-rust \
            /opt/rust/qnx-cargo build --manifest-path \
            /src/donor/wireless/daemon/Cargo.toml --bin mhi2q-wireless-daemon
      - name: Verify QNX ELF and record hash
        run: |
          set -euo pipefail
          BIN="donor/wireless/daemon/target/armv7-unknown-nto-qnx650/release/mhi2q-wireless-daemon"
          test -s "$BIN"
          file "$BIN" | tee qnx-rust-elf.txt
          file "$BIN" | grep -q "ELF 32-bit.*ARM"
          docker run --rm --platform=linux/amd64 \
            -v "$GITHUB_WORKSPACE":/src -w /src \
            qnx65-armv7-toolchain:8.5-rust \
            sh -c 'arm-unknown-nto-qnx6.5.0eabi-readelf -h /src/'"$BIN"' && arm-unknown-nto-qnx6.5.0eabi-readelf -d /src/'"$BIN"''
          sha256sum "$BIN" | tee qnx-rust-sha256.txt
          {
            echo "upstream_commit=20c94f51c0f0ae88b154c12e4f604643ba23022c"
            echo "toolchain_commit=baa45224f18ae6b13c2e9c77c6663bb8181eb6a1"
            echo "target=armv7-unknown-nto-qnx650"
            echo "status=REVIEW_ONLY"
            echo "installable=false"
            echo "safe_to_flash=false"
            echo "vehicle_verified=false"
          } > qnx-rust-build-info.txt
      - name: Upload review-only upstream QNX Rust ELF and AU57x bridge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R103-QNX-Rust-Bridge-and-Daemon-REVIEW-ONLY
          path: |
            au57x/target/armv7-unknown-nto-qnx650/release/au57x-r103-qnx-smoke
            qnx-r103-elf.txt
            qnx-r103-qemu.log
            qnx-r103-build-info.txt
            donor/wireless/daemon/target/armv7-unknown-nto-qnx650/release/mhi2q-wireless-daemon
            qnx-rust-elf.txt
            qnx-rust-sha256.txt
            qnx-rust-build-info.txt
          if-no-files-found: warn
          retention-days: 14
