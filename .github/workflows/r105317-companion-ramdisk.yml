name: R105.317 original companion launcher with actual RAM filesystem (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: ['.github/workflows/r105317-companion-ramdisk.yml','lab/mu1005_companion_ramdisk/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        profile: ['790']
        ram: [flash, block]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact public donor and existing QNX boot harness
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euxo pipefail
          mkdir evidence stage
          git init donor
          git -C donor remote add origin https://github.com/omonob/VW-MHI2-Wireless-Carplay-Maps.git
          git -C donor fetch --depth 1 origin aec37f5b1c87a0d961d16fe4328ac3638d0a833e
          git -C donor checkout --detach FETCH_HEAD
          case "$PROFILE" in
            790) dir=AID10.5-17PM ;;
            791) dir=AID12.3 ;;
            *) exit 1 ;;
          esac
          cp "donor/standalone/SD_ROOT/carplay/payload/wireless/profiles/$dir/wcp_receiver" stage/wcp_receiver
          cp "donor/standalone/SD_ROOT/carplay/payload/wireless/profiles/$dir/wireless-receiver-exec" "donor/standalone/SD_ROOT/carplay/payload/wireless/profiles/$dir/libomonob-wireless-maps.so" stage/
          cp donor/standalone/SD_ROOT/carplay/payload/wireless/common/runtime/libv75-transport.so stage/
          sha256sum stage/* | tee evidence/donor.sha256
          for f in stage/*; do readelf -h -dW "$f"; done | tee evidence/companion-elf.txt
          readelf -h -dW stage/wcp_receiver | tee evidence/donor-elf.txt
          git init toolchain
          git -C toolchain remote add origin https://github.com/luka-dev/qnx65-armv7-toolchain.git
          git -C toolchain fetch --depth 1 origin baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          git -C toolchain checkout --detach FETCH_HEAD
          if ! command -v qemu-system-arm >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y -qq qemu-system-arm
          fi
      - uses: ./.github/actions/mu1005-qnx-image
        with:
          require-cache: 'true'
      - name: Compile isolated launcher probe with cached SDK
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src qnx65-armv7-toolchain:8.5 sh -ec '
            C=arm-unknown-nto-qnx6.5.0eabi
            "$C-gcc" -std=gnu99 -D_QNX_SOURCE -Wall -Wextra -Werror lab/mu1005_companion_ramdisk/probe.c -o stage/receiver_probe
          '
      - name: Execute untouched upstream launcher with genuine companion files
        run: |
          set -euo pipefail
          python3 lab/mu1005_companion_runtime/prepare.py toolchain/tests/qemu-run.sh
          python3 lab/mu1005_companion_ramdisk/ramdisk.py toolchain/tests/qemu-run.sh "${{ matrix.ram }}"
          QNX_DONOR_STAGE="$PWD/stage" QNX_DONOR_RECEIVER="$PWD/stage/wcp_receiver" QEMU_KEEP_LOG="$PWD/evidence/serial.log" QEMU_TIMEOUT=140 QEMU_RUN_SECS=70 sh toolchain/tests/qemu-run.sh "$PWD/stage/receiver_probe" 8.5 | tee evidence/runtime.log
          grep -F DONOR_RAMDISK_WRITABLE evidence/runtime.log
          grep -E 'DONOR_(EXIT|SIGNAL|LAUNCHER_OR_CHILD_ALIVE|SPAWN_FAILED)' evidence/runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R105317-companion-${{ matrix.profile }}-${{ matrix.ram }}-NO-INSTALL
          path: evidence/
