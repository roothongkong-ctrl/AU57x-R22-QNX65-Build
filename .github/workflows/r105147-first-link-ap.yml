name: R105.147 first-link AP slot selection and QNX build (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [integration/mu1005_si_native/ap_live/ap_live.c, integration/mu1005_si_native/ap_live/ap_live.h, lab/mu1005_first_link_ap/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        case: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test actual AP adapter and existing encoders
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          cc -std=gnu99 -Wall -Wextra -Werror -g -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie -Iproject/source/src -Iintegration/mu1005_si_native/ap_live integration/mu1005_si_native/ap_live/ap_live.c project/source/src/cp_csm.c lab/mu1005_first_link_ap/test.c -o /tmp/ap-test
          /tmp/ap-test "$CASE" | tee evidence/result.log
          grep -Fx "FIRST_LINK_IE_CASE_PASS $CASE FIXTURE_ONLY" evidence/result.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r105147-ap-case-${{ matrix.case }}-NO-INSTALL
          path: evidence/result.log
  qnx-arm-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned public toolchain only (no QEMU)
        run: |
          set -euxo pipefail
          mkdir -p qnx-runtime-evidence
          git init toolchain
          git -C toolchain remote add origin https://github.com/luka-dev/qnx65-armv7-toolchain.git
          git -C toolchain fetch --depth 1 origin baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          git -C toolchain checkout --detach FETCH_HEAD
          test "$(git -C toolchain rev-parse HEAD)" = baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
      - uses: actions/cache/restore@v4
        id: gnu-cache
        with:
          path: ~/.cache/au57x-gnu
          key: mu1005-gnu-gcc850-d308841a-binutils238-e316477a-v1
      - name: Configure reusable compiler build cache
        uses: docker/setup-buildx-action@v3
      - name: Build verified toolchain
        run: |
          set -euxo pipefail
          bash tools/ci/mu1005_gnu_mirrors.sh "$HOME/.cache/au57x-gnu" toolchain | tee qnx-runtime-evidence/gnu.log
          docker buildx build --load --platform linux/amd64 --target base-env --build-arg BASE=base-8.5 --cache-from type=gha,scope=mu1005-qnx65-baa45224-gcc85-v1 --cache-to type=gha,scope=mu1005-qnx65-baa45224-gcc85-v1,mode=min,ignore-error=true -t qnx65-armv7-toolchain:8.5 toolchain 2>&1 | tee qnx-runtime-evidence/compiler.log
          docker run --rm --platform linux/amd64 qnx65-armv7-toolchain:8.5 arm-unknown-nto-qnx6.5.0eabi-gcc --version | tee qnx-runtime-evidence/compiler-version.log
      - name: Compile actual AP adapter for QNX ARM
        run: |
          set -euo pipefail
          mkdir -p qnx-runtime-evidence
          docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src qnx65-armv7-toolchain:8.5 arm-unknown-nto-qnx6.5.0eabi-gcc -std=gnu99 -Wall -Wextra -Werror -fPIC -Iproject/source/src -Iintegration/mu1005_si_native/ap_live -c integration/mu1005_si_native/ap_live/ap_live.c -o qnx-runtime-evidence/ap_live.o
          readelf -h qnx-runtime-evidence/ap_live.o | tee qnx-runtime-evidence/ap-elf.txt
          readelf -sW qnx-runtime-evidence/ap_live.o | grep -E 'mu_ap_ie_(select|install_first_free)' | tee qnx-runtime-evidence/ap-symbols.txt
          test "$(wc -l < qnx-runtime-evidence/ap-symbols.txt)" -eq 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r105147-ap-arm-NO-INSTALL
          path: |
            qnx-runtime-evidence/ap_live.o
            qnx-runtime-evidence/ap-elf.txt
            qnx-runtime-evidence/ap-symbols.txt
