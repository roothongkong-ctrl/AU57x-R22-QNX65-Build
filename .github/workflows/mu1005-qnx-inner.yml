name: MU1005 QNX inner iAP2 runtime integration (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/mu1005-qnx-inner.yml, lab/mu1005_qnx_runtime/inner_runtime.c, lab/mu1005_qnx_runtime/prepare_inner_ifs.py, lab/mu1005_qnx_runtime/full_chain.c, lab/mu1005_qnx_runtime/bootstrap_chain_fixture.c, lab/mu1005_qnx_runtime/vehicle_profile.h, lab/mu1005_qnx_runtime/lab_fixture_provider.c, lab/mu1005_qnx_runtime/prepare_fixture_ifs.py, lab/mu1005_qnx_runtime/bt_owner_runtime.c]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qnx-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download previously verified exact ARM payload
        uses: actions/download-artifact@v4
        with:
          name: mu1005-si-cprx-arm-NO-INSTALL
          run-id: 45546789122
          github-token: ${{ github.token }}
          path: previous-native
      - name: Verify locked artifact and fixture source
        run: |
          set -euxo pipefail
          mkdir -p qnx-runtime-evidence
          grep -Fx 'source=082340439793b5c4aaf4b90d20b48e9a4318535c' previous-native/evidence/revisions.txt
          (cd previous-native && sha256sum -c SHA256SUMS) > qnx-runtime-evidence/checksums.log
          sha256sum previous-native/payload/libmu1005_inner_iap2_review.so | tee qnx-runtime-evidence/library.sha256
          for f in mm_peer.h inner_socket.h inner_iap2.h test_mm_peer.c; do
            cmp "previous-native/source/si/inner_iap2/$f" "integration/mu1005_si_native/inner_iap2/$f"
          done
      - name: Verify continuous byte-level scenario on host before QNX
        run: |
          set -euxo pipefail
          s=project/source/src
          b=project/source/legacy_mu1005/bluetooth
          a=project/source/legacy_mu1005/airplay
          i=integration/mu1005_si_native/inner_iap2
          gcc -std=gnu99 -fPIC -shared -Wall -Wextra lab/mu1005_qnx_runtime/lab_fixture_provider.c -o qnx-runtime-evidence/libmu_lab_fixture_host.so
          export MU_LAB_FIXTURE_PATH="$PWD/qnx-runtime-evidence/libmu_lab_fixture_host.so"
          gcc -std=gnu99 -D_DEFAULT_SOURCE -Wall -Wextra -O2 -ffunction-sections -fdata-sections -Wl,--gc-sections -Wl,--export-dynamic -I"$s" -I"$b" -I"$a" -DMU_AP_REFRESH_TEST lab/mu1005_qnx_runtime/full_chain.c lab/mu1005_qnx_runtime/bootstrap_chain_fixture.c integration/mu1005_si_native/ap_live/{ap_live,ap_refresh}.c "$s"/{cp_cloud_pipeline,cp_wcp_autoconnect,cp_wcp_handoff,cp_radio_policy,cp_session_handoff,cp_step04_session,cp_step04_link,cp_step04_iap2_auth,cp_step04_stock_mfi,cp_oem_boundary,cp_wireless,cp_event,cp_csm}.c "$a"/{mu1005_r34_ap_server,native_exports,cprx_service,semantic}.c "$b/mu1005_rf_ingress.c" "$i"/{inner_iap2,inner_socket,mm_peer}.c -ldl -o qnx-runtime-evidence/host-chain
          qnx-runtime-evidence/host-chain | tee qnx-runtime-evidence/host-chain.log
          grep -F 'CHAIN_IAP2_BYTES_AND_SOCKET_ROUND_TRIP_PASS_NO_OEM' qnx-runtime-evidence/host-chain.log
          gcc -std=gnu99 -D_DEFAULT_SOURCE -DMU_CHAIN_MODEL_IPC -Wall -Wextra -O2 -ffunction-sections -fdata-sections -Wl,--gc-sections -Wl,--export-dynamic -I"$s" -I"$b" -I"$a" -DMU_AP_REFRESH_TEST lab/mu1005_qnx_runtime/full_chain.c lab/mu1005_qnx_runtime/bootstrap_chain_fixture.c integration/mu1005_si_native/ap_live/{ap_live,ap_refresh}.c "$s"/{cp_cloud_pipeline,cp_wcp_autoconnect,cp_wcp_handoff,cp_radio_policy,cp_session_handoff,cp_step04_session,cp_step04_link,cp_step04_iap2_auth,cp_step04_stock_mfi,cp_oem_boundary,cp_wireless,cp_event,cp_csm}.c "$a"/{mu1005_r34_ap_server,native_exports,cprx_service,semantic}.c "$b/mu1005_rf_ingress.c" "$i"/inner_iap2.c -ldl -o qnx-runtime-evidence/host-model-chain
          qnx-runtime-evidence/host-model-chain | tee qnx-runtime-evidence/host-model-chain.log
          grep -F 'CHAIN_IAP2_BYTES_AND_MODEL_IPC_PASS_NO_OEM' qnx-runtime-evidence/host-model-chain.log
      - name: Fetch locked public QNX boot environment and QEMU
        run: |
          set -euxo pipefail
          git init toolchain
          git -C toolchain remote add origin https://github.com/luka-dev/qnx65-armv7-toolchain.git
          git -C toolchain fetch --depth 1 origin baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          git -C toolchain checkout --detach FETCH_HEAD
          test "$(git -C toolchain rev-parse HEAD)" = baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
          for f in startup-virt libstartup.a devc-serdebug u-boot.bin; do test -s "toolchain/tests/qemu/$f"; done
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm
          qemu-system-arm --version | tee qnx-runtime-evidence/qemu-version.log
          sha256sum toolchain/tests/qemu/{startup-virt,libstartup.a,devc-serdebug,u-boot.bin} toolchain/tests/qemu-run.sh | tee qnx-runtime-evidence/boot-inputs.sha256
      - uses: actions/cache/restore@v4
        id: gnu-cache
        with:
          path: ~/.cache/au57x-gnu
          key: mu1005-gnu-gcc850-d308841a-binutils238-e316477a-v1
      - name: Configure reusable compiler build cache
        uses: docker/setup-buildx-action@v3
      - name: Build verified toolchain
        run: |
          set -euxo pipefail
          bash tools/ci/mu1005_gnu_mirrors.sh "$HOME/.cache/au57x-gnu" toolchain | tee qnx-runtime-evidence/gnu.log
          docker buildx build --load --platform linux/amd64 --target base-env --build-arg BASE=base-8.5 --cache-from type=gha,scope=mu1005-qnx65-baa45224-gcc85-v1 --cache-to type=gha,scope=mu1005-qnx65-baa45224-gcc85-v1,mode=min,ignore-error=true -t qnx65-armv7-toolchain:8.5 toolchain 2>&1 | tee qnx-runtime-evidence/compiler.log
          docker run --rm --platform linux/amd64 qnx65-armv7-toolchain:8.5 arm-unknown-nto-qnx6.5.0eabi-gcc --version | tee qnx-runtime-evidence/compiler-version.log
      - name: Build isolated QNX test provider
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src qnx65-armv7-toolchain:8.5 bash -c '
            arm-unknown-nto-qnx6.5.0eabi-gcc -std=gnu99 -D_QNX_SOURCE -fPIC -shared -Wl,--no-undefined -Wall -Wextra lab/mu1005_qnx_runtime/lab_fixture_provider.c -lc -o qnx-runtime-evidence/libmu_lab_fixture.so
            arm-unknown-nto-qnx6.5.0eabi-readelf -sW qnx-runtime-evidence/libmu_lab_fixture.so
          ' | tee qnx-runtime-evidence/fixture-exports.log
          python3 lab/mu1005_qnx_runtime/prepare_fixture_ifs.py toolchain/tests/qemu-run.sh
          echo "QNX_LAB_FIXTURE=$PWD/qnx-runtime-evidence/libmu_lab_fixture.so" >> "$GITHUB_ENV"
      - name: Run continuous scenario with explicit IPC model on QNX
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src qnx65-armv7-toolchain:8.5 bash -c '
            set -eux
            s=project/source/src
            b=project/source/legacy_mu1005/bluetooth
            a=project/source/legacy_mu1005/airplay
            i=integration/mu1005_si_native/inner_iap2
            arm-unknown-nto-qnx6.5.0eabi-gcc -std=gnu99 -D_QNX_SOURCE -DMU_CHAIN_MODEL_IPC -Wall -Wextra -O2 -ffunction-sections -fdata-sections -Wl,--gc-sections -Wl,--export-dynamic -I"$s" -I"$b" -I"$a" -DMU_AP_REFRESH_TEST lab/mu1005_qnx_runtime/full_chain.c lab/mu1005_qnx_runtime/bootstrap_chain_fixture.c integration/mu1005_si_native/ap_live/{ap_live,ap_refresh}.c "$s"/{cp_cloud_pipeline,cp_wcp_autoconnect,cp_wcp_handoff,cp_radio_policy,cp_session_handoff,cp_step04_session,cp_step04_link,cp_step04_iap2_auth,cp_step04_stock_mfi,cp_oem_boundary,cp_wireless,cp_event,cp_csm}.c "$a"/{mu1005_r34_ap_server,native_exports,cprx_service,semantic}.c "$b/mu1005_rf_ingress.c" "$i"/inner_iap2.c -lsocket -lc -o qnx-runtime-evidence/mu1005-model-chain
          ' 2>&1 | tee qnx-runtime-evidence/model-build.log
          QEMU_KEEP_LOG="$PWD/qnx-runtime-evidence/model-serial.log" QEMU_TIMEOUT=65 QEMU_RUN_SECS=20 sh toolchain/tests/qemu-run.sh "$PWD/qnx-runtime-evidence/mu1005-model-chain" 8.5 2>&1 | tee qnx-runtime-evidence/model-runtime.log
          grep -F 'CHAIN_IAP2_BYTES_AND_MODEL_IPC_PASS_NO_OEM' qnx-runtime-evidence/model-runtime.log
          grep -E 'Process [0-9]+ \(mu1005-model-chain\) exited status=0' qnx-runtime-evidence/model-serial.log
      - name: Run integrated dual-ended transport with real QNX socket manager
        if: always()
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src qnx65-armv7-toolchain:8.5 bash -c '
            set -eux
            arm-unknown-nto-qnx6.5.0eabi-gcc -std=gnu99 -D_QNX_SOURCE -Wall -Wextra -Werror -O2 lab/mu1005_qnx_runtime/inner_runtime.c -lsocket -lc -o qnx-runtime-evidence/mu1005-inner-probe
            arm-unknown-nto-qnx6.5.0eabi-readelf -h -dW qnx-runtime-evidence/mu1005-inner-probe
          ' 2>&1 | tee qnx-runtime-evidence/probe-build.log
          python3 lab/mu1005_qnx_runtime/prepare_inner_ifs.py toolchain/tests/qemu-run.sh
          export QNX_TEST_INNER_LIB="$PWD/previous-native/payload/libmu1005_inner_iap2_review.so"
          set +e
          QEMU_KEEP_LOG="$PWD/qnx-runtime-evidence/qemu-serial.log" QEMU_TIMEOUT=95 QEMU_RUN_SECS=50 sh toolchain/tests/qemu-run.sh "$PWD/qnx-runtime-evidence/mu1005-inner-probe" 8.5 2>&1 | tee qnx-runtime-evidence/runtime.log
          rc=${PIPESTATUS[0]}
          set -e
          if test -f qnx-runtime-evidence/qemu-serial.log; then tail -100 qnx-runtime-evidence/qemu-serial.log; fi
          test "$rc" -eq 0
          grep -F 'QNX_INNER_BIDIRECTIONAL_REAL_RUNTIME_PASS_NO_OEM' qnx-runtime-evidence/runtime.log
          grep -E 'Process [0-9]+ \(mu1005-inner-probe\) exited status=0' qnx-runtime-evidence/qemu-serial.log
      - name: Run Bluetooth worker and owner lifecycle using actual QNX sockets
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src qnx65-armv7-toolchain:8.5 bash -c '
            set -eux
            b=project/source/legacy_mu1005/bluetooth
            arm-unknown-nto-qnx6.5.0eabi-gcc -std=gnu99 -D_QNX_SOURCE -Wall -Wextra -Werror -O2 -ffunction-sections -fdata-sections -Wl,--gc-sections -I"$b" lab/mu1005_qnx_runtime/bt_owner_runtime.c "$b"/{bt_socket_worker,bt_iap2_owner_handoff,rf_arg_experiment,bt_notify_bridge,native_binding,native_event,inbound,inbound_r5,mu1005_rf_ingress,mu1005_ipc_stream,mu1005_socket_pump,bt_route_gate,bt_startup_snapshot,bt_owner_identity}.c -lsocket -lc -o qnx-runtime-evidence/mu1005-bt-owner
          ' 2>&1 | tee qnx-runtime-evidence/bt-owner-build.log
          export QNX_TEST_INNER_LIB="$PWD/previous-native/payload/libmu1005_inner_iap2_review.so"
          QEMU_KEEP_LOG="$PWD/qnx-runtime-evidence/bt-owner-serial.log" QEMU_TIMEOUT=95 QEMU_RUN_SECS=50 sh toolchain/tests/qemu-run.sh "$PWD/qnx-runtime-evidence/mu1005-bt-owner" 8.5 2>&1 | tee qnx-runtime-evidence/bt-owner-runtime.log
          grep -F 'BT_OWNER_REAL_SOCKET_PTHREAD_TWO_SESSIONS_PASS_NO_OEM' qnx-runtime-evidence/bt-owner-runtime.log
          grep -E 'Process [0-9]+ \(mu1005-bt-owner\) exited status=0' qnx-runtime-evidence/bt-owner-serial.log
      - name: Run one continuous connection scenario in QNX (simulated hardware)
        if: always()
        run: |
          set -euxo pipefail
          test -d toolchain
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src qnx65-armv7-toolchain:8.5 bash -c '
            set -eux
            s=project/source/src
            b=project/source/legacy_mu1005/bluetooth
            a=project/source/legacy_mu1005/airplay
            i=integration/mu1005_si_native/inner_iap2
            arm-unknown-nto-qnx6.5.0eabi-gcc -std=gnu99 -D_QNX_SOURCE -Wall -Wextra -O2 -ffunction-sections -fdata-sections -Wl,--gc-sections -Wl,--export-dynamic -I"$s" -I"$b" -I"$a" -DMU_AP_REFRESH_TEST lab/mu1005_qnx_runtime/full_chain.c lab/mu1005_qnx_runtime/bootstrap_chain_fixture.c integration/mu1005_si_native/ap_live/{ap_live,ap_refresh}.c "$s"/{cp_cloud_pipeline,cp_wcp_autoconnect,cp_wcp_handoff,cp_radio_policy,cp_session_handoff,cp_step04_session,cp_step04_link,cp_step04_iap2_auth,cp_step04_stock_mfi,cp_oem_boundary,cp_wireless,cp_event,cp_csm}.c "$a"/{mu1005_r34_ap_server,native_exports,cprx_service,semantic}.c "$b/mu1005_rf_ingress.c" "$i"/{inner_iap2,inner_socket,mm_peer}.c -lsocket -lc -o qnx-runtime-evidence/mu1005-chain-probe
          ' 2>&1 | tee qnx-runtime-evidence/chain-build.log
          export QNX_TEST_INNER_LIB="$PWD/previous-native/payload/libmu1005_inner_iap2_review.so"
          QEMU_KEEP_LOG="$PWD/qnx-runtime-evidence/chain-serial.log" QEMU_TIMEOUT=95 QEMU_RUN_SECS=50 sh toolchain/tests/qemu-run.sh "$PWD/qnx-runtime-evidence/mu1005-chain-probe" 8.5 2>&1 | tee qnx-runtime-evidence/chain-runtime.log
          grep -F 'CHAIN_IAP2_BYTES_AND_SOCKET_ROUND_TRIP_PASS_NO_OEM' qnx-runtime-evidence/chain-runtime.log
          grep -E 'Process [0-9]+ \(mu1005-chain-probe\) exited status=0' qnx-runtime-evidence/chain-serial.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mu1005-qnx-inner-runtime-evidence-NO-INSTALL
          path: qnx-runtime-evidence/
          retention-days: 30
