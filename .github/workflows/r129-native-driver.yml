name: R131 QNX native driver adapter (NO INSTALL)
on:
  push:
    branches: [r129-native-driver-review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qnx-native-plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts before building toolchain
        run: |
          bash -n ci/target_plugin.sh
          bash -n ci/host_and_qnx.sh
          test "$(grep -Fxc 'echo AU57X_R125_QNX_ARM_PLUGIN_LINKED_REVIEW_ONLY' ci/target_plugin.sh)" -eq 1
          test "$(tail -n 1 ci/target_plugin.sh)" = "echo AU57X_R125_QNX_ARM_PLUGIN_LINKED_REVIEW_ONLY"
      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm
      - name: Verify sources, compile QNX ARM plugin and load in QEMU
        run: bash ci/host_and_qnx.sh
      - name: Upload actual target evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R131-QNX-DRIVER-REVIEW-NO-INSTALL
          path: build/qnx/
          if-no-files-found: warn
          retention-days: 14
