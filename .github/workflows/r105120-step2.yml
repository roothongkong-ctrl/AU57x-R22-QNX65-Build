name: R105.121 STEP 2 integrated Bluetooth iAP2 (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105120-step2.yml, tests/test_step2_integrated.c, ci/host_step2_integrated.sh]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-step2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify original upstream EIR source and discovery
        run: bash ci/host_r102_upstream_reuse.sh
      - name: Execute full single-socket R98 R45 iAP2 integration
        run: |
          set -euo pipefail
          mkdir -p evidence
          for trial in 1 2 3; do
            bash ci/host_step2_integrated.sh | tee "evidence/step2-$trial.log"
            grep -F STEP2_INTEGRATED_R98_R45_IAP2_FIXTURE_PASS_NO_REAL_MFI_OR_RF "evidence/step2-$trial.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step2-integrated-evidence-NO-INSTALL
          path: evidence/
