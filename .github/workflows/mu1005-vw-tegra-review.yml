name: VW Tegra independent receiver route (NO INSTALL)
on:
  push:
    branches: [mu1005-vw-tegra-receiver-route]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-native-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact VW V3.2 payload tree for read-only review
        run: |
          set -euxo pipefail
          git init donor
          git -C donor remote add origin https://github.com/omonob/VW-MHI2-Wireless-Carplay-Maps.git
          git -C donor fetch --depth 1 origin aec37f5b1c87a0d961d16fe4328ac3638d0a833e
          git -C donor checkout --detach FETCH_HEAD
      - name: Compare native executable identity and receiver dependencies
        run: |
          set -euxo pipefail
          mkdir evidence
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re,subprocess
          root=Path("donor/standalone/SD_ROOT/carplay/payload/wireless")
          baseline=[x.split("\t") for x in (root/"native-baselines.tsv").read_text().splitlines() if x.strip()]
          target="51ecbd44c3581bd69f01ed5bdc053ba28ccc6fef3bf1bd4c3a8f010898ab0566"
          report={"target":"MU1005","target_btstack_sha256":target,"exact_btstack_match":any(target in row[1:] for row in baseline),"donor_profiles":baseline,"components":[],"direct_install":False,"runtime_approved":False}
          assert not report["exact_btstack_match"]
          files=[root/"common/ota/libbtwcp.so",root/"common/ota/wcp_video"]
          files += [p for p in root.glob("profiles/*/*") if p.name in {"wcp_receiver","wireless-receiver-exec","libomonob-wireless-maps.so"}]
          for p in files:
              if p.read_bytes()[:4]!=b"\x7fELF":raise ValueError(str(p))
              def rd(*args):return subprocess.check_output(["readelf",*args,str(p)],text=True)
              st=subprocess.check_output(["strings","-a","-n","5",str(p)],text=True,errors="replace")
              dyn=rd("-dW")
              report["components"].append({"path":str(p.relative_to(root)),"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"size":p.stat().st_size,"needed":re.findall(r"Shared library: \[([^\]]+)\]",dyn),"architecture":rd("-h"),"dynamic_library_candidates":sorted(set(re.findall(r"[A-Za-z0-9_.+-]+\.so(?:\.[0-9]+)*",st))),"hardware_path_candidates":sorted(set(re.findall(r"/dev/[A-Za-z0-9_./-]+",st))),"selected_export_or_import_names":[x.strip() for x in rd("--dyn-syms","-W").splitlines() if re.search(r"PairingSession|MFi|AirPlayReceiver|NvMedia|NvParser|OMX|i2c|devctl|screen_",x,re.I)][:120]})
          Path("evidence/vw-tegra-compatibility.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vw-tegra-receiver-review-metadata-only
          path: evidence/
          retention-days: 7
