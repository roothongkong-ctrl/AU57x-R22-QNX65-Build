name: R105.225 full donor session error and cleanup continuity (NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths: [.github/workflows/r105225-donor-exit.yml, lab/mu1005_donor_exit/**]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  DONOR: 20c94f51c0f0ae88b154c12e4f604643ba23022c
  TOOLCHAIN: baa45224f18ae6b13c2e9c77c6663bb8181eb6a1
jobs:
  actual-donor-exit-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Actual Rust clean EOF and malformed frame exit status
        run: |
          set -euxo pipefail
          git init donor
          git -C donor remote add origin https://github.com/luka-dev/mib2q-carplay-rgi.git
          git -C donor fetch --depth 1 origin "$DONOR"
          git -C donor checkout --detach FETCH_HEAD
          python3 integration/mu1005_donor_daemon/adapt_live_ap.py donor
          python3 integration/mu1005_donor_daemon/adapt_receiver_unix.py donor
          python3 integration/mu1005_donor_daemon/adapt_mfi_sequence.py donor
          python3 lab/mu1005_route4_5/adapt_donor_ack.py donor
          python3 lab/mu1005_route4_5/adapt_inherited_stream.py donor
          python3 lab/mu1005_live_uap_ip/adapt.py donor
          python3 lab/mu1005_donor_ready/adapt.py donor
          python3 lab/mu1005_donor_exit/adapt.py donor
          rustup toolchain install nightly-2026-07-21 --profile minimal
          mkdir -p fixture
          cp donor/wireless/daemon/probes/dio_manager.fixture.json fixture/dio_manager.json
          cargo +nightly-2026-07-21 build --offline --locked --bin mhi2q-wireless-daemon --manifest-path donor/wireless/daemon/Cargo.toml
          env -i PATH="$PATH" IPL_CONFIG_DIR_DIO_MANAGER="$PWD/fixture" MHI2Q_CP_MODEL=LAB-ONLY MHI2Q_CP_SERIAL=LAB-ONLY MHI2Q_CP_HARDWARE=LAB-ONLY MHI2Q_CP_BT_MAC=02:00:00:00:00:01 MHI2Q_CP_DEVICE_ID=02:00:00:00:00:02 MHI2Q_CP_SSID=LAB-ONLY MHI2Q_CP_PASSPHRASE=labfixturepassword MHI2Q_CP_CHANNEL=11 MHI2Q_CP_IP_ADDRESS=127.0.0.1 MHI2Q_CP_AIRPLAY_PORT=5000 MHI2Q_CP_RECEIVER=stock210 python3 lab/mu1005_donor_exit/test_exit.py "$PWD/donor/wireless/daemon/target/debug/mhi2q-wireless-daemon"
  qnx-arm-daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fetch locked daemon and Rust-capable QNX compiler
        run: |
          set -euxo pipefail
          mkdir -p donor-arm-evidence
          git init donor
          git -C donor remote add origin https://github.com/luka-dev/mib2q-carplay-rgi.git
          git -C donor fetch --depth 1 origin "$DONOR"
          git -C donor checkout --detach FETCH_HEAD
          test "$(git -C donor rev-parse HEAD)" = "$DONOR"
          git init toolchain
          git -C toolchain remote add origin https://github.com/luka-dev/qnx65-armv7-toolchain.git
          git -C toolchain fetch --depth 1 origin "$TOOLCHAIN"
          git -C toolchain checkout --detach FETCH_HEAD
          test "$(git -C toolchain rev-parse HEAD)" = "$TOOLCHAIN"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/au57x-gnu
          key: mu1005-gnu-gcc850-d308841a-binutils238-e316477a-v1
      - name: Verify GNU sources
        run: bash tools/ci/mu1005_gnu_mirrors.sh "$HOME/.cache/au57x-gnu" toolchain
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: toolchain
          platforms: linux/amd64
          target: with-rust
          build-args: BASE=base-8.5
          tags: mu1005-qnx65-rust:review
          load: true
          push: false
          cache-from: |
            type=gha,scope=mu1005-qnx65-baa45224-gcc85-v1
            type=gha,scope=mu1005-qnx65-baa45224-rust-v1
          cache-to: type=gha,scope=mu1005-qnx65-baa45224-rust-v1,mode=min,ignore-error=true
      - name: Adapt original MU1005 live AP source
        run: |
          set -euxo pipefail
          python3 integration/mu1005_donor_daemon/adapt_live_ap.py donor | tee donor-arm-evidence/ap-port.log
          python3 integration/mu1005_donor_daemon/adapt_receiver_unix.py donor | tee donor-arm-evidence/unix-port.log
          python3 integration/mu1005_donor_daemon/adapt_mfi_sequence.py donor | tee donor-arm-evidence/mfi-port.log
          git -C donor diff -- wireless/daemon > donor-arm-evidence/ap-port.diff
      - name: Add already host-verified ACK and inherited endpoint
        run: |
          set -euxo pipefail
          python3 lab/mu1005_route4_5/adapt_donor_ack.py donor | tee donor-arm-evidence/ack-port.log
          python3 lab/mu1005_route4_5/adapt_inherited_stream.py donor | tee donor-arm-evidence/fd-port.log
          python3 lab/mu1005_live_uap_ip/adapt.py donor
          python3 lab/mu1005_donor_ready/adapt.py donor
          python3 lab/mu1005_donor_exit/adapt.py donor | tee donor-arm-evidence/exit-port.log
          git -C donor diff -- wireless/daemon > donor-arm-evidence/combined-port.diff
      - name: Build adapted full QNX daemon (default feature set)
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/amd64 -v "$PWD":/src -w /src/donor mu1005-qnx65-rust:review \
            /opt/rust/qnx-cargo build --locked --manifest-path /src/donor/wireless/daemon/Cargo.toml --bin mhi2q-wireless-daemon 2>&1 | tee donor-arm-evidence/build.log
          bin=donor/wireless/daemon/target/armv7-unknown-nto-qnx650/release/mhi2q-wireless-daemon
          test -s "$bin"
          readelf -h -dW -AW "$bin" | tee donor-arm-evidence/elf.log
          grep -Eq 'Machine:.*ARM' donor-arm-evidence/elf.log
          grep -Eq 'Class:.*ELF32' donor-arm-evidence/elf.log
          sha256sum "$bin" | tee donor-arm-evidence/daemon.sha256
          # Explicitly non-installable research payload, not named like stock binary.
          cp "$bin" donor-arm-evidence/donor-daemon-MU1005-INHERITED-ACK-NO-INSTALL.bin
          for f in LICENSE LICENSE.md COPYING; do if test -f "donor/$f"; then cp "donor/$f" donor-arm-evidence/; fi; done
          printf '%s\n' 'NO INSTALL: eight source adapters including inherited failure propagation and cleanup; actual band selection, MU1005 runtime ABI, MFi owner, receiver and hardware not accepted' "donor=$DONOR" "toolchain=$TOOLCHAIN" "source=$GITHUB_SHA" > donor-arm-evidence/STATUS.txt
      - name: Verify inherited endpoint and ACK code are in compiled ARM executable
        run: |
          set -euxo pipefail
          bin=donor-arm-evidence/donor-daemon-MU1005-INHERITED-ACK-NO-INSTALL.bin
          readelf -Ws "$bin" > donor-arm-evidence/symbols.log
          strings "$bin" > /tmp/donor-strings
          grep -F 'MU1005_INHERITED_ACK_STREAM' /tmp/donor-strings
          grep -F 'MU1005_RF_ACK_MODE_ENABLED' /tmp/donor-strings
          grep -F 'unexpected RF completion' /tmp/donor-strings
          grep -F 'MU1005 uap0 IPv4 unavailable or changed' /tmp/donor-strings
          grep -F 'MU1005-READY-v1' /tmp/donor-strings
          grep -F 'MU1005 inherited donor requires supervisor readiness' /tmp/donor-strings
          grep -F 'MU1005 requires original SI control endpoint' /tmp/donor-strings
          printf '%s\n' 'FULL_ADAPTED_DONOR_ARM_BUILD_ONLY_NO_OEM_NO_RF' | tee donor-arm-evidence/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R105225-full-donor-exit-NO-INSTALL
          path: donor-arm-evidence/
          retention-days: 7
