name: R105 iAP2 upstream bridge host regression (HOST ONLY / NO INSTALL)
on:
  push:
    branches: [mu1005-si-cprx-real-review]
    paths:
      - '.github/workflows/r105-iap2-host-review.yml'
      - 'Cargo.toml'
      - 'third_party/luka-dev/mib2q-carplay-rgi/wireless/daemon/vendor/iap2-link/**'
      - 'integration/r103_iap2_bridge/**'
      - 'integration/mu1005_si_native/inner_iap2/**'
      - 'ci/host_r103_*.sh'
      - 'project/source/legacy_mu1005/bluetooth/bt_iap2_owner_handoff.*'
      - 'tests/test_r105_owner_nonblocking_gate.py'
      - 'tests/test_r105_step01_plugin_abi_layout.py'
      - 'tests/test_r105_step02_driver_static_audit.py'
      - 'docs/R105_STEP02_DRIVER_STATIC_AUDIT.json'
      - 'tests/test_r105_step03_mm_ipod_plugin_loader.py'
      - 'docs/R105_STEP03_MM_IPOD_PLUGIN_LOADER_AUDIT.json'
      - 'tests/test_r105_step04_btstack_iap2_owner_audit.py'
      - 'docs/R105_STEP04_BTSTACK_IAP2_OWNER_STATIC_AUDIT.json'
      - 'tests/test_r105_step05_asi_si_control_plane.py'
      - 'docs/R105_STEP05_ASI_SI_CONTROL_PLANE_AUDIT.json'
      - 'tests/test_r105_step06_resmgr_mount_audit.py'
      - 'docs/R105_STEP06_RESMGR_MOUNT_STATIC_AUDIT.json'
      - 'project/source/src/cp_ipod_module_layout.h'
      - 'docs/STEP05_MU1005_USB_PLUGIN_ABI_AUDIT.json'
  pull_request:
    paths:
      - '.github/workflows/r105-iap2-host-review.yml'
      - 'Cargo.toml'
      - 'third_party/luka-dev/mib2q-carplay-rgi/wireless/daemon/vendor/iap2-link/**'
      - 'integration/r103_iap2_bridge/**'
      - 'ci/host_r103_*.sh'
permissions:
  contents: read
jobs:
  r103-host-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify exact upstream donor source and run all Rust tests
        run: |
          set -euxo pipefail
          bash ci/host_r103_upstream_link.sh
      - name: Compile and run the C wire framing tests
        run: |
          set -euxo pipefail
          bash ci/host_r103_c_wire.sh
      - name: Enforce nonblocking OEM owner activation boundary
        run: |
          set -euxo pipefail
          python3 tests/test_r105_owner_nonblocking_gate.py
      - name: Verify Step 01 OEM plugin ABI layout (host structural check only)
        run: |
          set -euxo pipefail
          python3 tests/test_r105_step01_plugin_abi_layout.py
      - name: Verify Step 02 MU1005 iAP2 driver static audit (metadata only)
        run: |
          set -euxo pipefail
          python3 tests/test_r105_step02_driver_static_audit.py
      - name: Verify Step 03 mm-ipod loader and stock USB plugin ABI (metadata only)
        run: |
          set -euxo pipefail
          python3 tests/test_r105_step03_mm_ipod_plugin_loader.py
      - name: Verify Step 04 BTStack iAP2 owner boundary (static evidence only)
        run: |
          set -euxo pipefail
          python3 tests/test_r105_step04_btstack_iap2_owner_audit.py
      - name: Verify Step 05 ASI and SmartphoneIntegration control-plane contract (static evidence only)
        run: |
          set -euxo pipefail
          python3 tests/test_r105_step05_asi_si_control_plane.py
      - name: Verify Step 06 mm-ipod Resource Manager mount owner (static evidence only)
        run: |
          set -euxo pipefail
          python3 tests/test_r105_step06_resmgr_mount_audit.py
      - name: Exercise AirPlay iAP2 envelope adapter (host fake only)
        run: |
          set -euxo pipefail
          cc -std=c11 -Wall -Wextra -Werror -rdynamic \
            -I integration/mu1005_si_native/inner_iap2 \
            integration/mu1005_si_native/inner_iap2/inner_airplay.c \
            integration/mu1005_si_native/inner_iap2/inner_iap2.c \
            integration/mu1005_si_native/inner_iap2/inner_socket.c \
            integration/mu1005_si_native/inner_iap2/inner_session.c \
            integration/mu1005_si_native/inner_iap2/test_airplay.c \
            -ldl -o /tmp/r105-airplay-envelope-host
          /tmp/r105-airplay-envelope-host
      - name: Record scope boundary
        run: |
          printf '%s\n' 'HOST_ONLY=1' 'QNX_TARGET_RUNTIME=NOT_TESTED' 'OEM_RFCOMM_OWNER=NOT_PROVEN' 'MFI=NOT_TESTED' 'VEHICLE_VERIFIED=0' 'INSTALLABLE=0' | tee r105-host-scope.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r105-iap2-host-only-scope
          path: r105-host-scope.txt
          if-no-files-found: error
